function getSemesterLabel() {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth() + 1;
  const day = now.getDate();
  const is2nd = month > 8 || (month === 8 && day >= 1);
  const semester = is2nd ? '2' : '1';
  return `${year}학년도 ${semester}학기`;
}

function adjustToByteRange(text, min=1400, max=1500) {
  const enc = new TextEncoder();
  if (!text || typeof text !== 'string') return text || '';
  let r = text.trim().replace(/^(이\s*)?학생은\s*/,'').replace(/^해당\s*학생은\s*/,'');
  let bytes = enc.encode(r).length;
  if (bytes >= min && bytes <= max) return r;
  if (bytes > max) {
    const ends = ['함.','임.','음.','됨.','보임.','나타냄.'];
    let attempts = 0;
    while (enc.encode(r).length > max && attempts < 200) {
      attempts++;
      if (r.length < 10) break;
      let lastPos = -1;
      for (const e of ends) { const idx = r.lastIndexOf(e); if (idx > lastPos && idx < r.length - e.length) lastPos = idx; }
      if (lastPos > 0) {
        const endPattern = ends.find(e => r.indexOf(e, lastPos) === lastPos);
        r = r.slice(0, lastPos + (endPattern ? endPattern.length : 2)).trim();
      } else {
        const lastDot = r.lastIndexOf('.');
        if (lastDot > r.length * 0.5) r = r.slice(0, lastDot + 1).trim();
        else r = r.slice(0, -Math.ceil(20/3)).trim();
      }
    }
  }
  return r;
}

const GAS_URL = 'https://script.google.com/macros/s/AKfycbwGWlTMoZh-3RUH4fPn_ibxuJht-bGcBww64XPOfrETc-0jD-GG91OJxLdgUjEE2p8Q/exec';

function callAPI(payload) {
  return fetch(GAS_URL, {
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload)
  }).then(r => {
    if (!r.ok) return r.text().then(t=>{throw new Error('HTTP '+r.status+': '+t.substring(0,100));});
    return r.json();
  });
}

async function callAIWithRetry(text, onProgress) {
  const MAX_ATTEMPTS = 5;
  const DELAYS = [0,3000,5000,8000,12000];
  for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
    if (DELAYS[attempt] > 0) {
      const sec = Math.round(DELAYS[attempt]/1000);
      if (onProgress) onProgress(`재시도 ${attempt}/${MAX_ATTEMPTS-1}... (${sec}초 대기 중)`);
      await new Promise(r=>setTimeout(r,DELAYS[attempt]));
    } else { if (onProgress) onProgress('AI 생성 요청 중...'); }
    try {
      const res = await callAPI({action:'generateAI',text});
      if (res.success && res.content) return res;
      const msg = (res.message||'').toLowerCase();
      const is503 = msg.includes('503')||msg.includes('unavailable')||msg.includes('high demand')||msg.includes('overloaded');
      if (is503 && attempt < MAX_ATTEMPTS-1) { if (onProgress) onProgress(`서버 과부하 (시도 ${attempt+1}/${MAX_ATTEMPTS}), 잠시 후 재시도...`); continue; }
      return res;
    } catch(e) {
      if (attempt < MAX_ATTEMPTS-1) { if (onProgress) onProgress(`통신 오류 (시도 ${attempt+1}/${MAX_ATTEMPTS}), 재시도 중...`); continue; }
      throw e;
    }
  }
  return {success:false,message:'서버가 계속 과부하 상태입니다. 잠시 후 다시 시도해 주세요.'};
}

          return;
        }
      }
      const savedOnlyId=localStorage.getItem(idKey);
      if (savedOnlyId) { setId(savedOnlyId); setSaveId(true); }
    } catch(e) {}

    e.preventDefault();
    if (!id.trim()||!pw.trim()) return alert('입력해주세요!');
    if (mode==='register'&&!name.trim()) return alert('이름을 입력해주세요!');
    if (mode==='register'&&isStudent&&!match) return alert('학번, 이름, 전화번호 확인이 필요합니다!');
    if (mode==='register'&&isTeacher&&!match) return alert('이름과 인증코드 확인이 필요합니다!');
    setLoading(true);
    try {
      let res;
      if (mode==='login') {
        res=await callAPI({action:'login',studentId:id.trim(),password:pw,role});
      } else if (isStudent) {
        res=await callAPI({action:'register',studentId:id.trim(),name:name.trim(),password:pw,role:'student',homeroomClass:''});
      } else if (isTeacher) {
        // 교과목 데이터 먼저 준비
        const validAssigns=assigns.filter(a=>a.subject&&a.classes.size>0);
        const assignData=validAssigns.length>0
          ? JSON.stringify(validAssigns.map(a=>({subject:a.subject,classes:[...a.classes].sort()})))
          : '';
        // 담임+교과목 한번에 등록
        res=await callAPI({action:'registerTeacher',teacherId:id.trim(),name:name.trim(),password:pw,role:'teacher',
          grade:match?.grade||'',classNum:match?.classNum||'',assignments:assignData});
        if (res.success) res.assignments=assignData;
      } else {
        // 진로담당
        res=await callAPI({action:'registerTeacher',teacherId:id.trim(),name:name.trim(),password:pw,role:'career',grade:'',classNum:'',assignments:''});
      }
      if (res.success) {
        if (mode==='login') {
          if (autoLogin) { try{localStorage.setItem(storageKey,JSON.stringify({savedId:id.trim(),savedPw:pw}));}catch(e){} }
          else if (saveId) { try{localStorage.removeItem(storageKey);}catch(e){} try{localStorage.setItem(idKey,id.trim());}catch(e){} }
          else { try{localStorage.removeItem(storageKey);}catch(e){} try{localStorage.removeItem(idKey);}catch(e){} }
        }
        onLogin({studentId:id.trim(),name:mode==='login'?res.name:name.trim(),role,
          homeroomClass:res.homeroomClass||(isTeacher&&match?match.homeroomClass:''),
          assignments:res.assignments||''});
      } else alert(res.message||'오류가 발생했습니다.');
    } catch(e) { alert('서버 오류'); }
    setLoading(false);
  };

  if (loading&&autoLogin) {
    return (
      <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',background:phoneBg}}>
        <div style={{textAlign:'center'}}>
          <div style={{width:52,height:52,background:c,borderRadius:15,margin:'0 auto 14px',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <RoleIcon role={role}/>
          </div>
          <p style={{fontSize:14,fontWeight:700,color:c,margin:'0 0 8px'}}>자동 로그인 중...</p>
          <Spin/>
        </div>
      </div>
    );
  }

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',background:phoneBg,overflowY:'auto'}}>
      <div style={{background:c,padding:'30px 20px 44px',position:'relative',overflow:'hidden',flexShrink:0}}>
        <div style={{position:'absolute',top:0,left:0,right:0,bottom:0,background:'repeating-linear-gradient(135deg,rgba(255,255,255,0) 0px,rgba(255,255,255,0) 20px,rgba(255,255,255,0.025) 20px,rgba(255,255,255,0.025) 22px)',pointerEvents:'none'}}/>
        <div style={{position:'absolute',top:-40,right:-40,width:140,height:140,borderRadius:'50%',border:'1.5px solid rgba(255,255,255,0.08)',background:'rgba(255,255,255,0.04)'}}/>
        <div style={{position:'absolute',bottom:8,right:12,width:55,height:55,borderRadius:'50%',border:'1px solid rgba(255,255,255,0.07)'}}/>
        <div style={{position:'absolute',bottom:-1,left:0,right:0,lineHeight:0,zIndex:2}}>
          <svg viewBox="0 0 390 40" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" style={{display:'block',width:'100%'}}>
            <path d="M0,0 C80,38 180,42 280,28 C340,20 370,14 390,12 L390,40 L0,40 Z" fill={phoneBg}/>
          </svg>
        </div>
        <div style={{position:'relative',zIndex:3}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:22}}>
            <button onClick={onBack} style={{display:'inline-flex',alignItems:'center',gap:5,background:'rgba(255,255,255,0.15)',border:'1px solid rgba(255,255,255,0.25)',borderRadius:20,padding:'5px 12px',height:26,fontSize:11,color:'rgba(255,255,255,0.9)',fontWeight:500,cursor:'pointer',fontFamily:'inherit'}}>
              <svg width="11" height="11" fill="none" stroke="rgba(255,255,255,0.9)" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7"/></svg>
              역할 선택
            </button>
            <div style={{display:'inline-flex',alignItems:'center',gap:6,background:'rgba(255,255,255,0.18)',border:'1px solid rgba(255,255,255,0.3)',borderRadius:20,padding:'5px 11px',height:26}}>
              <div style={{width:5,height:5,borderRadius:'50%',background:'#ffd580',flexShrink:0}}/>
              <span style={{fontSize:10,color:'rgba(255,255,255,0.9)',fontWeight:600,letterSpacing:'0.05em'}}>{ROLE_LABELS[role]}</span>
            </div>
          </div>
          <div style={{width:46,height:46,background:'rgba(255,255,255,0.15)',borderRadius:13,display:'flex',alignItems:'center',justifyContent:'center',marginBottom:10}}>
            <RoleIcon role={role}/>
          </div>
          <p style={{fontSize:22,fontWeight:700,color:'#fff',letterSpacing:'-0.3px',margin:'0 0 3px'}}>{mode==='login'?'로그인':'계정 등록'}</p>
          <p style={{fontSize:10,color:'rgba(255,255,255,0.5)',letterSpacing:'0.1em',margin:0}}>GWACHEON WOMANS HIGH SCHOOL</p>
        </div>
      </div>

      <div style={{padding:'8px 16px 28px'}}>
        <div style={{display:'flex',gap:6,marginBottom:18,marginTop:4}}>
          {['login','register'].map(m=>(
            <button key={m} onClick={()=>{setMode(m);setPw('');setName('');setPhone('');setMatch(null);setTeacherCode('');setCodeErr('');setAddSubject(true);}}
              style={{flex:1,padding:'9px 0',borderRadius:12,border:`1.5px solid ${mode===m?c:'#e8d8db'}`,background:mode===m?c:'#fff',fontSize:12,fontWeight:700,color:mode===m?'#fff':'#bbb',cursor:'pointer',fontFamily:'inherit'}}>
              {m==='login'?'로그인':'계정 등록'}
            </button>
          ))}
        </div>

        <form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:10}}>

          {/* 교사 등록 — 이름+인증코드 확인 전 */}
          {mode==='register'&&isTeacher&&!match&&(
            <>
              <div style={{display:'flex',alignItems:'center',gap:6,margin:'4px 0 6px'}}>
                <div style={{width:3,height:12,background:c,borderRadius:2}}/>
                <span style={{fontSize:10,fontWeight:600,color:c,letterSpacing:'0.05em'}}>이름 · 인증코드 입력</span>
              </div>
              <div style={{position:'relative'}}>
                <span style={{position:'absolute',left:13,top:'50%',transform:'translateY(-50%)',opacity:0.35}}>
                  <svg width="15" height="15" fill="none" stroke={c} strokeWidth="1.7" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                </span>
                <input className="input" type="text" placeholder="이름" value={name} onChange={e=>{setName(e.target.value);setCodeErr('');}} style={{paddingLeft:36}}/>
              </div>
              <div style={{position:'relative'}}>
                <span style={{position:'absolute',left:13,top:'50%',transform:'translateY(-50%)',opacity:0.35}}>
                  <svg width="15" height="15" fill="none" stroke={c} strokeWidth="1.7" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                </span>
                <input className="input" type="password" placeholder="교사 인증코드" value={teacherCode} onChange={e=>{setTeacherCode(e.target.value);setCodeErr('');}} style={{paddingLeft:36}}/>
              </div>
              <button type="button" disabled={codeChecking} onClick={async()=>{
                if (!name.trim()) return setCodeErr('이름을 입력하세요.');
                if (!teacherCode.trim()) return setCodeErr('인증코드를 입력하세요.');
                setCodeChecking(true); setCodeErr('');
                try {
                  const codeRes=await callAPI({action:'checkTeacherCode',code:teacherCode.trim()});
                  if (!codeRes.success) { setCodeErr(codeRes.message||'잘못된 인증코드입니다.'); setCodeChecking(false); return; }
                  const nameRes=await callAPI({action:'lookupTeacher',name:name.trim()});
                  if (nameRes.success) setMatch(nameRes);
                  else setCodeErr(nameRes.message||'교사명단에 없는 이름입니다.');
                } catch(e) { setCodeErr('서버 오류'); }
                setCodeChecking(false);
              }} style={{width:'100%',padding:'13px',borderRadius:14,border:'none',background:codeErr?'#6a1515':c,color:'#fff',fontSize:13,fontWeight:800,cursor:'pointer',fontFamily:'inherit',opacity:codeChecking?0.7:1}}>
                {codeChecking?<Spin/>:codeErr?'❌ 다시 확인하기':'이름 · 인증코드 확인하기'}
              </button>
              {codeErr&&<p style={{fontSize:11,color:'#e53935',margin:0}}>❌ {codeErr}</p>}
              <div style={{background:'#e8f5e9',border:'1px solid #b2dfce',borderRadius:10,padding:'8px 12px',display:'flex',alignItems:'flex-start',gap:7}}>
                <div style={{width:4,height:4,borderRadius:'50%',background:c,flexShrink:0,marginTop:5}}/>
                <p style={{fontSize:10,color:'#0a6e55',margin:0,lineHeight:1.65,fontWeight:500}}>
                  교사명단에 등록된 이름과 일치해야 합니다<br/>인증코드는 교무기획부에 문의하세요
                </p>
              </div>
            </>
          )}

          {/* 교사 등록 — 확인 완료 후 */}
          {mode==='register'&&isTeacher&&match&&(
            <>
              <div style={{background:'#e8f5e9',border:'1px solid #a5d6a7',borderRadius:10,padding:'8px 12px',fontSize:12,color:'#2e7d32',fontWeight:700,display:'flex',alignItems:'center',gap:6}}>
                <svg width="13" height="13" fill="none" stroke="#2e7d32" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>
                {match.homeroomClass?`${match.homeroomClass[0]}학년 ${match.homeroomClass.slice(1)}반 담임 확인됐습니다`:'확인됐습니다'}
              </div>
              <div style={{display:'flex',alignItems:'center',gap:6,margin:'4px 0 2px'}}>
                <div style={{width:3,height:12,background:c,borderRadius:2}}/>
                <span style={{fontSize:10,fontWeight:600,color:c,letterSpacing:'0.05em'}}>아이디 · 비밀번호 설정</span>
              </div>
              <div style={{position:'relative'}}>
                <span style={{position:'absolute',left:13,top:'50%',transform:'translateY(-50%)',opacity:0.35}}>
                  <svg width="15" height="15" fill="none" stroke={c} strokeWidth="1.7" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                </span>
                <input className="input" type="text" placeholder="사용할 아이디" value={id} onChange={e=>setId(e.target.value)} style={{paddingLeft:36}}/>
              </div>
              <div style={{position:'relative'}}>
                <span style={{position:'absolute',left:13,top:'50%',transform:'translateY(-50%)',opacity:0.35}}>
                  <svg width="15" height="15" fill="none" stroke={c} strokeWidth="1.7" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                </span>
                <input className="input" type="password" placeholder="비밀번호" value={pw} onChange={e=>setPw(e.target.value)} style={{paddingLeft:36}}/>
              </div>

              {/* 교과목 등록 (필수) */}
<div style={{margin:'6px 0 2px'}}>
  <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:6}}>
    <div style={{width:3,height:12,background:'#5c2fa0',borderRadius:2}}/>
    <span style={{fontSize:10,fontWeight:600,color:'#5c2fa0',letterSpacing:'0.05em'}}>교과목 등록</span>
  </div>
</div>

              {addSubject&&(
                <div style={{background:'#faf7ff',border:'1px solid #ede7f6',borderRadius:14,padding:14}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
                    <span style={{fontSize:12,fontWeight:800,color:'#5c2fa0'}}>담당 과목</span>
                    <button type="button" onClick={()=>setAssigns(p=>[...p,{grade:'1',subject:'',classes:new Set()}])}
                      style={{background:'#ede7f6',color:'#5c2fa0',border:'none',borderRadius:10,padding:'4px 10px',fontSize:11,fontWeight:700,cursor:'pointer'}}>+ 추가</button>
                  </div>
                  {assigns.map((a,idx)=>(
                    <div key={idx} style={{background:'white',borderRadius:12,padding:12,border:'1px solid #ede7f6',marginBottom:8}}>
                      {assigns.length>1&&<button type="button" onClick={()=>setAssigns(p=>p.filter((_,i)=>i!==idx))} style={{float:'right',background:'none',border:'none',color:'#ccc',cursor:'pointer',fontSize:14}}>✕</button>}
                      <p style={{fontSize:10,color:'#999',margin:'0 0 5px',fontWeight:700}}>학년</p>
                      <div style={{display:'flex',gap:5,marginBottom:8}}>
                        {['1','2','3'].map(g=>(
                          <button type="button" key={g} onClick={()=>setAssigns(p=>p.map((x,i)=>i===idx?{...x,grade:g,subject:'',classes:new Set()}:x))}
                            style={{flex:1,padding:'6px 0',borderRadius:8,border:'none',fontWeight:700,fontSize:12,cursor:'pointer',background:a.grade===g?'#5c2fa0':'#eee',color:a.grade===g?'white':'#666'}}>{g}학년</button>
                        ))}
                      </div>
                      <p style={{fontSize:10,color:'#999',margin:'0 0 5px',fontWeight:700}}>과목</p>
                      <select value={a.subject} onChange={e=>setAssigns(p=>p.map((x,i)=>i===idx?{...x,subject:e.target.value}:x))}
                        style={{width:'100%',padding:'7px 10px',borderRadius:9,border:'1px solid #ede7f6',background:'white',fontSize:12,fontWeight:600,marginBottom:8,outline:'none'}}>
                        <option value="">과목 선택</option>
                        {(subjects[a.grade]||[]).map(s=><option key={s} value={s}>{s}</option>)}
                      </select>
                      <p style={{fontSize:10,color:'#999',margin:'0 0 5px',fontWeight:700}}>담당 학급</p>
                      <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
                        {Array.from({length:CLASS_COUNT[a.grade]||5},(_,i)=>{
                          const cls=a.grade+String(i+1); const sel=a.classes.has(cls);
                          return <button type="button" key={cls} onClick={()=>toggleClass(idx,cls)}
                            style={{padding:'4px 11px',borderRadius:20,border:'none',fontSize:11,fontWeight:700,cursor:'pointer',background:sel?'#5c2fa0':'#eee',color:sel?'white':'#666'}}>{i+1}반</button>;
                        })}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </>
          )}

          {/* 학생 등록 */}
          {mode==='register'&&isStudent&&(
            <>
              <div style={{display:'flex',alignItems:'center',gap:6,margin:'4px 0 6px'}}>
                <div style={{width:3,height:12,background:c,borderRadius:2}}/>
                <span style={{fontSize:10,fontWeight:600,color:c,letterSpacing:'0.05em'}}>학번 · 이름 · 전화번호 입력</span>
              </div>
              <div style={{position:'relative'}}>
                <span style={{position:'absolute',left:13,top:'50%',transform:'translateY(-50%)',opacity:0.35}}>
                  <svg width="15" height="15" fill="none" stroke={c} strokeWidth="1.7" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                </span>
                <input className="input" type="number" placeholder="학번 (예: 1101)" value={id} onChange={e=>{setId(e.target.value);setMatch(null);}} style={{paddingLeft:36}}/>
              </div>
              <div style={{position:'relative'}}>
                <span style={{position:'absolute',left:13,top:'50%',transform:'translateY(-50%)',opacity:0.35}}>
                  <svg width="15" height="15" fill="none" stroke={c} strokeWidth="1.7" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                </span>
                <input className="input" type="text" placeholder="이름" value={name} onChange={e=>{setName(e.target.value);setMatch(null);}} style={{paddingLeft:36}}/>
              </div>
              <div style={{position:'relative'}}>
                <span style={{position:'absolute',left:13,top:'50%',transform:'translateY(-50%)',opacity:0.35}}>
                  <svg width="15" height="15" fill="none" stroke={c} strokeWidth="1.7" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                </span>
                <input className="input" type="tel" placeholder="전화번호 (예: 01012345678)" value={phone} onChange={e=>{setPhone(e.target.value);setMatch(null);}} style={{paddingLeft:36}}/>
              </div>
              <button type="button" onClick={checkName} disabled={checking}
                style={{width:'100%',padding:'13px',borderRadius:14,border:'none',background:match===true?'#2e7d32':match===false?'#6a1515':c,color:'#fff',fontSize:13,fontWeight:800,cursor:'pointer',fontFamily:'inherit',opacity:checking?0.7:1}}>
                {checking?<Spin/>:match===true?'✅ 확인됐습니다':match===false?'❌ 일치하지 않습니다 — 다시 확인하기':'학번 · 이름 · 전화번호 확인하기'}
              </button>
              <div style={{background:'#fff5f5',border:'1px solid #f5c6c6',borderRadius:10,padding:'8px 12px',display:'flex',alignItems:'flex-start',gap:7}}>
                <div style={{width:4,height:4,borderRadius:'50%',background:c,flexShrink:0,marginTop:5}}/>
                <p style={{fontSize:10,color:c,margin:0,lineHeight:1.65,fontWeight:500}}>
                  하이픈(-) 없이 숫자만 입력하세요<br/>
                  전화번호 오류는 교감선생님께 문의하세요
                </p>
              </div>
            </>
          )}

          {/* 학번/아이디 — 로그인 or 진로 등록 */}
          {(mode==='login'||(mode==='register'&&isCareer))&&(
            <>
              {mode==='register'&&isCareer&&(
                <div style={{display:'flex',alignItems:'center',gap:6,margin:'4px 0 6px'}}>
                  <div style={{width:3,height:12,background:c,borderRadius:2}}/>
                  <span style={{fontSize:10,fontWeight:600,color:c,letterSpacing:'0.05em'}}>아이디 · 이름 · 비밀번호 입력</span>
                </div>
              )}
              {mode==='login'&&(
                <div style={{display:'flex',alignItems:'center',gap:6,margin:'4px 0 6px'}}>
                  <div style={{width:3,height:12,background:c,borderRadius:2}}/>
                  <span style={{fontSize:10,fontWeight:600,color:c,letterSpacing:'0.05em'}}>{isStudent?'학번과 비밀번호 입력':'아이디와 비밀번호 입력'}</span>
                </div>
              )}
              <div style={{position:'relative'}}>
                <span style={{position:'absolute',left:13,top:'50%',transform:'translateY(-50%)',opacity:0.35}}>
                  <svg width="15" height="15" fill="none" stroke={c} strokeWidth="1.7" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                </span>
                <input className="input" type={isStudent?'number':'text'} placeholder={isStudent?'학번 (예: 1101)':'아이디'} value={id} onChange={e=>setId(e.target.value)} style={{paddingLeft:36}}/>
              </div>
              {mode==='register'&&isCareer&&(
                <div style={{position:'relative'}}>
                  <span style={{position:'absolute',left:13,top:'50%',transform:'translateY(-50%)',opacity:0.35}}>
                    <svg width="15" height="15" fill="none" stroke={c} strokeWidth="1.7" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                  </span>
                  <input className="input" type="text" placeholder="이름" value={name} onChange={e=>setName(e.target.value)} style={{paddingLeft:36}}/>
                </div>
              )}
            </>

function SubjectRegister({onDone,onBack}){

  const [id,setId]=useState(''), [name,setName]=useState(''), [pw,setPw]=useState(''), [loading,setLoading]=useState(false);
  const [subjects,setSubjects]=useState({});

  useEffect(()=>{ callAPI({action:'getSubjectList'}).then(r=>{if(r.success)setSubjects(r.subjects||{});}).catch(()=>{}); },[]);
  const checkCode=async()=>{
    if (!code.trim()) return setCodeErr('코드를 입력하세요.');
    setChecking(true); setCodeErr('');
    try { const r=await callAPI({action:'checkTeacherCode',code:code.trim()}); if(r.success) setVerified(true); else setCodeErr(r.message||'코드가 틀렸습니다.'); }
    catch(e) { setCodeErr('서버 오류'); }
    setChecking(false);
  };
  const toggle=(idx,cls)=>setAssigns(prev=>prev.map((a,i)=>{ if(i!==idx) return a; const s=new Set(a.classes); s.has(cls)?s.delete(cls):s.add(cls); return {...a,classes:s}; }));
  const submit=async(e)=>{
    e.preventDefault();
    if (!id||!name||!pw) return alert('모든 항목을 입력하세요!');

    setLoading(true);

      const data=assigns.map(a=>({subject:a.subject,classes:[...a.classes].sort()}));
      const r=await callAPI({action:'registerTeacher',teacherId:id.trim(),name:name.trim(),password:pw,role:'subject',grade:'',classNum:'',assignments:JSON.stringify(data)});
      if (r.success) { alert('등록 완료!'); onDone(JSON.stringify(data)); }

    setLoading(false);

            <button onClick={checkCode} className="btn-pink" style={{background:'#5c2fa0'}} disabled={checking}>{checking?<Spin/>:'인증 확인'}</button>

function AIReport({student,onBack}){
  const [recs,setRecs]=useState([]), [loading,setLoading]=useState(true);
  const [sel,setSel]=useState(new Set()), [result,setResult]=useState(''), [generating,setGenerating]=useState(false), [saving,setSaving]=useState(false), [errMsg,setErrMsg]=useState('');
  const [progress,setProgress]=useState('');
  useEffect(()=>{ callAPI({action:'getRecords',studentId:student.id}).then(r=>{setRecs(r.records||[]);setLoading(false);}).catch(()=>setLoading(false)); },[]);
  const generate=async()=>{
    if (!sel.size) return alert('기록을 선택하세요!');
    setGenerating(true); setResult(''); setErrMsg(''); setProgress('AI 생성 요청 중...');
    const text=recs.filter(r=>sel.has(r.id)).map(r=>r.categoryId==='subject'?`[${r.subject}]${r.unit} 탐구:${r.inquiry} 배움:${r.learned} 느낌:${r.reflection}`:`[${r.categoryId==='career'?'진로':'창체'}]${r.title}: ${r.content}`).join('\n');
    try {
      const res=await callAIWithRetry(text,(msg)=>setProgress(msg));
      if (res.success) setResult(adjustToByteRange(res.content||''));
      else setErrMsg(res.message||'AI 생성 실패');
    } catch(e) { setErrMsg('서버 오류: '+e.message); }
    setProgress(''); setGenerating(false);
  };
  const save=async()=>{
    if (!result) return; setSaving(true);
    try { await callAPI({action:'saveReport',studentId:student.id,name:student.name,content:result,savedAt:new Date().toLocaleString()}); alert('저장됐습니다!'); }
    catch(e) { alert('저장 실패'); }
    setSaving(false);
  };
  return(
    <div style={{paddingBottom:20}}>
      <div style={{background:'linear-gradient(135deg,#4db6ac,#26a69a)',padding:'20px 16px 28px'}}>
        <button onClick={onBack} style={{background:'rgba(255,255,255,0.2)',border:'none',color:'white',borderRadius:20,padding:'5px 12px',fontSize:12,fontWeight:700,cursor:'pointer',marginBottom:12,display:'flex',alignItems:'center',gap:4}}><Back/> 학생 목록</button>
        <h2 style={{fontSize:18,fontWeight:900,color:'white',margin:0}}>{student.name}</h2>
        <p style={{fontSize:12,color:'rgba(255,255,255,0.8)',margin:'4px 0 0'}}>{student.id}</p>
      </div>
      <div style={{padding:'12px 14px'}}>
        {result&&(
          <div style={{background:'#e8f5e9',borderRadius:14,padding:16,marginBottom:12}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
              <span style={{fontSize:12,fontWeight:800,color:'#2e7d32'}}>✨ AI 생기부</span>
              <span style={{fontSize:11,color:'#999'}}>{new TextEncoder().encode(result).length} bytes</span>
            </div>
            <p style={{fontSize:13,color:'#333',lineHeight:1.7,margin:'0 0 10px'}}>{result}</p>
            <div style={{display:'flex',gap:8}}>
              <button onClick={()=>navigator.clipboard.writeText(result)} style={{flex:1,background:'#f5f5f5',border:'none',borderRadius:10,padding:'8px 0',fontSize:12,fontWeight:700,cursor:'pointer'}}>복사</button>
              <button onClick={save} disabled={saving} className="btn-pink" style={{flex:2,padding:'8px 0',fontSize:12}}>{saving?<Spin/>:'저장하기'}</button>
            </div>

function StudentList({user,records,onSelect,onBack}){
  const [students,setStudents]=useState(null), [loading,setLoading]=useState(true);
  const hc=user.homeroomClass||'';
  useEffect(()=>{
    if (hc) { callAPI({action:'getStudentsByClass',classCode:hc}).then(r=>{setStudents(r.students||[]);setLoading(false);}).catch(()=>setLoading(false)); }
    else {
      const map={}; records.forEach(r=>{if(!map[r.studentId])map[r.studentId]={id:r.studentId,name:r.name};});
      setStudents(Object.values(map).sort((a,b)=>a.id.localeCompare(b.id))); setLoading(false);
    }
  },[]);
  const getCount=id=>records.filter(r=>String(r.studentId)===String(id)).length;
  const col = ROLE_COLORS[user.role];
  return(
    <div style={{paddingBottom:20}}>
      <div style={{background:`linear-gradient(135deg,${col},${col}cc)`,padding:'20px 16px 28px'}}>
        <button onClick={onBack} style={{background:'rgba(255,255,255,0.2)',border:'none',color:'white',borderRadius:20,padding:'5px 12px',fontSize:12,fontWeight:700,cursor:'pointer',marginBottom:12,display:'flex',alignItems:'center',gap:4}}><Back/> 홈</button>
        <h2 style={{fontSize:18,fontWeight:900,color:'white',margin:0}}>학생 목록</h2>

        {loading&&<p style={{textAlign:'center',color:'#ccc',padding:20}}>불러오는 중...</p>}

          <button key={s.studentId||s.id} onClick={()=>onSelect({id:s.studentId||s.id,name:s.name})} className="active-btn card" style={{padding:'11px 14px',display:'flex',alignItems:'center',gap:12,textAlign:'left',width:'100%',border:'none',cursor:'pointer'}}>

        );})}

  );

  const [showAI,setShowAI]=useState(false), [result,setResult]=useState(''), [generating,setGenerating]=useState(false), [copied,setCopied]=useState(false), [saving,setSaving]=useState(false);
  const [errMsg,setErrMsg]=useState(''), [progress,setProgress]=useState('');

    setGenerating(true); setResult(''); setErrMsg(''); setProgress('AI 생성 요청 중...');

      const res=await callAIWithRetry(text,(msg)=>setProgress(msg));
      if (res.success&&res.content) { setResult(adjustToByteRange(res.content)); setProgress(''); }
      else { setErrMsg(res.message||'AI 생성 실패'); setProgress(''); }
    } catch(e) { setErrMsg('서버 통신 오류: '+(e.message||String(e))); setProgress(''); }

function App() {
  const [role,setRole]=useState(null);
  const [user,setUser]=useState(null);
  const [records,setRecords]=useState([]);
  const [loading,setLoading]=useState(false);
  const [view,setView]=useState('home');
  const [catId,setCatId]=useState(null);
  const [subject,setSubject]=useState(null);
  const [writing,setWriting]=useState(false);
  const [editing,setEditing]=useState(null);
  const [selStudent,setSelStudent]=useState(null);
  const [selAssignment,setSelAssignment]=useState(null);
  const [selClass,setSelClass]=useState(null);
  const [isDesktop,setIsDesktop]=useState(window.innerWidth>500);

  useEffect(()=>{ const handler=()=>setIsDesktop(window.innerWidth>500); window.addEventListener('resize',handler); return()=>window.removeEventListener('resize',handler); },[]);

  const fetchRecords=useCallback(async(u)=>{
    if (!u) return;
    setLoading(true);
    try {
      const isStudent=u.role==='student';
      let payload;
      if (isStudent) payload={action:'getRecords',studentId:u.studentId};
      else {
        let sc=[];
        if (u.assignments) { try { sc=JSON.parse(u.assignments).flatMap(a=>a.classes); } catch(e) {} }
        payload={action:'getAllRecords',role:u.role,grade:u.grade,classNum:u.classNum,homeroomClass:u.homeroomClass||'',subjectClasses:sc,studentId:u.studentId};
      }
      const res=await callAPI(payload);
      if (res.success) setRecords(res.records||[]);
    } catch(e) {}
    setLoading(false);
  },[]);

  const login=u=>{ setUser(u); fetchRecords(u); };

  const logout=()=>{
    try { if(user) localStorage.removeItem(`autologin_${user.role}`); } catch(e) {}
    setUser(null); setRole(null); setRecords([]); setView('home');
  };

  const goBackToRole=()=>{
    try { if(user) localStorage.removeItem(`autologin_${user.role}`); } catch(e) {}
    setUser(null); setRole(null); setRecords([]); setView('home');
    setCatId(null); setSubject(null); setWriting(false); setEditing(null);
    setSelStudent(null); setSelAssignment(null); setSelClass(null);
  };

  const saveRecord=async(data)=>{
    try {
      const r=await callAPI({action:'saveRecord',record:{...data,studentId:user.studentId,name:user.name}});
      if (r.success) { await fetchRecords(user); setWriting(false); setEditing(null); }
      else alert(r.message);
    } catch(e) { alert('저장 실패'); }
  };
  const updateRecord=async(data)=>{
    try {
      const r=await callAPI({action:'updateRecord',record:{...data,studentId:user.studentId,name:user.name}});
      if (r.success) { await fetchRecords(user); setWriting(false); setEditing(null); }
      else alert(r.message);
    } catch(e) { alert('수정 실패'); }
  };
  const deleteRecord=async(id)=>{
    if (!confirm('삭제할까요?')) return;
    try { await callAPI({action:'deleteRecord',recordId:id,studentId:user.studentId}); fetchRecords(user); }
    catch(e) { alert('삭제 실패'); }
  };

  const desktopH=isDesktop?Math.min(window.innerHeight*0.92,900):null;
  const desktopW=isDesktop?Math.round(desktopH*(430/844)):null;
  const containerStyle={
    width:isDesktop?desktopW:'100%', maxWidth:isDesktop?desktopW:430,
    margin:isDesktop?`${window.innerHeight*0.04}px auto`:0,
    background:'white',
    height:isDesktop?desktopH:'auto', minHeight:isDesktop?desktopH:'100dvh',
    display:'flex', flexDirection:'column',
    position:'relative', overflow:'hidden',
    boxShadow:isDesktop?'0 30px 80px rgba(206,147,216,0.4)':'none',
    borderRadius:isDesktop?44:0
  };

  if (!role) return <div style={containerStyle}><RoleScreen onSelect={setRole}/></div>;
  if (!user) return <div style={containerStyle}><LoginScreen role={role} onLogin={login} onBack={()=>setRole(null)}/></div>;

  const isStudent=user.role==='student';
const isTeacher=user.role==='teacher';
const isCareer=user.role==='career';
const phoneBg=ROLE_PHONE_BG[user.role]||'#f7f0f2';

  return (
    <div style={containerStyle}>
      <div style={{background:'white',borderBottom:'1px solid #f8e8f0',padding:'0 20px',height:52,display:'flex',alignItems:'center',position:'sticky',top:0,zIndex:30,boxShadow:'0 1px 10px rgba(206,147,216,0.1)'}}>
        <h1 style={{flex:1,textAlign:'center',fontSize:15,fontWeight:900,color:'#1a1a2e',margin:0,letterSpacing:'-0.3px'}}>
          {'창체 다이어리'}
        </h1>
        <button onClick={logout} style={{position:'absolute',right:16,background:'#fce4ec',border:'none',color:'#c2185b',fontSize:11,fontWeight:700,padding:'5px 11px',borderRadius:18,cursor:'pointer'}}>로그아웃</button>
      </div>
      <div className="no-scrollbar" style={{flex:1,overflowY:'auto',minHeight:0,background:phoneBg}}>
        {isStudent&&view==='home'&&!catId&&<StudentHome user={user} records={records} loading={loading} onCat={id=>{setCatId(id);setView('cat');}} onBack={goBackToRole}/>}
        {isStudent&&view==='cat'&&catId!=='subject'&&!writing&&<RecordList catId={catId} records={records} onBack={()=>{setCatId(null);setView('home');}} onWrite={()=>setWriting(true)} onDelete={deleteRecord} onEdit={r=>{setEditing(r);setWriting(true);}}/>}
        {isStudent&&view==='cat'&&catId!=='subject'&&writing&&<WriteForm catId={catId} editing={editing} onSave={editing?updateRecord:saveRecord} onCancel={()=>{setWriting(false);setEditing(null);}}/>}
        {isStudent&&view==='cat'&&catId==='subject'&&!subject&&<SubjectList user={user} records={records} onSelect={s=>{setSubject(s);}} onBack={()=>{setCatId(null);setView('home');}}/>}
        {isStudent&&view==='cat'&&catId==='subject'&&subject&&!writing&&<SubjectRecords subject={subject} records={records} onBack={()=>setSubject(null)} onWrite={()=>setWriting(true)} onDelete={deleteRecord} onEdit={r=>{setEditing(r);setWriting(true);}}/>}
        {isStudent&&view==='cat'&&catId==='subject'&&subject&&writing&&<SubjectForm subject={subject} editing={editing} onSave={editing?updateRecord:saveRecord} onCancel={()=>{setWriting(false);setEditing(null);}}/>}
        {(isTeacher||isCareer)&&view==='home'&&
  <TeacherHome user={user} records={records}
    onSelectStudent={()=>setView('students')}
    onViewReports={()=>setView('reports')}
    onSubjectHome={()=>setView('subjectHome')}
    onAddSubject={()=>setView('addSubject')}
    onBack={goBackToRole}/>}
{(isTeacher||isCareer)&&view==='students'&&!selStudent&&
  <StudentList user={user} records={records} onSelect={s=>{setSelStudent(s);setView('ai');}} onBack={()=>setView('home')}/>}
{(isTeacher||isCareer)&&view==='ai'&&selStudent&&
  <AIReport student={selStudent} onBack={()=>{setSelStudent(null);setView('students');}}/>}
{isTeacher&&view==='reports'&&
  <ReportList user={user} onBack={()=>setView('home')}/>}
{isTeacher&&view==='addSubject'&&
  <AddSubjectOnly
    onDone={async(newAssignData)=>{
      // 기존 과목 + 새 과목 합치기
      const existing=user.assignments?JSON.parse(user.assignments):[];
      const newItems=JSON.parse(newAssignData);
      // 같은 과목이면 학급 합치기, 새 과목이면 추가
      const merged=[...existing];
      newItems.forEach(ni=>{
        const idx=merged.findIndex(e=>e.subject===ni.subject);
        if(idx>=0){
          const combined=[...new Set([...merged[idx].classes,...ni.classes])].sort();
          merged[idx]={...merged[idx],classes:combined};
        } else {
          merged.push(ni);
        }
      });
      const mergedStr=JSON.stringify(merged);
      alert('전송 아이디: '+user.studentId+' / 데이터: '+mergedStr);
const res=await callAPI({action:'updateTeacherAssignments',teacherId:user.studentId,role:'teacher',assignments:mergedStr});
alert('응답결과: '+JSON.stringify(res));
      if(res.success){
        const updated={...user,assignments:mergedStr};
        setUser(updated);
        fetchRecords(updated);
      }
      setView('home');
    }}
    onBack={()=>setView('home')}/>}
{isTeacher&&view==='subjectHome'&&!selAssignment&&
  <SubjectTeacherHome user={user} onSelectSubject={a=>{setSelAssignment(a);setView('classes');}} onBack={()=>setView('home')}/>}
{isTeacher&&view==='classes'&&selAssignment&&!selClass&&
  <SubjectClassList assignment={selAssignment} records={records} onSelect={cls=>{setSelClass(cls);setView('students2');}} onBack={()=>{setSelAssignment(null);setView('subjectHome');}}/>}
{isTeacher&&view==='students2'&&selClass&&!selStudent&&
  <SubjectStudentList assignment={selAssignment} classCode={selClass} records={records} onSelect={s=>{setSelStudent(s);setView('detail');}} onBack={()=>{setSelClass(null);setView('classes');}}/>}
{isTeacher&&view==='detail'&&selStudent&&
  <SubjectStudentDetail student={selStudent} records={records} onBack={()=>{setSelStudent(null);setView('students2');}}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
