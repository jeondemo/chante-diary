function adjustToByteRange(text,min=1400,max=1500){const enc=new TextEncoder();if(!text||typeof text!=='string')return text||'';let r=text.trim().replace(/^(이\s*)?학생은\s*/,'').replace(/^해당\s*학생은\s*/,'');if(enc.encode(r).length>=min&&enc.encode(r).length<=max)return r;if(enc.encode(r).length>max){const ends=['함.','임.','음.','됨.','보임.','나타냄.'];let at=0;while(enc.encode(r).length>max&&at<200){at++;if(r.length<10)break;let lp=-1;for(const e of ends){const idx=r.lastIndexOf(e);if(idx>lp&&idx<r.length-e.length)lp=idx;}if(lp>0){const ep=ends.find(e=>r.indexOf(e,lp)===lp);r=r.slice(0,lp+(ep?ep.length:2)).trim();}else{const ld=r.lastIndexOf('.');if(ld>r.length*0.5)r=r.slice(0,ld+1).trim();else r=r.slice(0,-Math.ceil(20/3)).trim();}}}return r;}

const GAS_URL='https://script.google.com/macros/s/AKfycbzqesWKR4hO0Yo4kb0sp4-RdJ3h8d8bmQoUQ4fKDUQfifP7itBSjtj6CTmyReX5rVjl/exec';

function emitAIProgress(state){

function callAPI(payload){
  const publicActions=['login','register','registerTeacher','lookupTeacher','lookupStudent','checkTeacherCode','getSubjectList','getClubList','getSubjectsByClass','getStudentsByClass'];
  if(currentUser&&currentUser.authToken&&publicActions.indexOf(payload.action)===-1){
    payload.authToken=currentUser.authToken;
    payload.requesterId=currentUser.studentId;
  }
  return fetch(GAS_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(r=>{if(!r.ok)return r.text().then(t=>{throw new Error('HTTP '+r.status);});return r.json().then(data=>{if(data.authExpired){alert('인증이 만료되었습니다. 다시 로그인해주세요.');try{sessionStorage.removeItem('diary_session');localStorage.removeItem('autologin_student');localStorage.removeItem('autologin_teacher');localStorage.removeItem('autologin_career');}catch(e){}location.reload();}return data;});});
}

async function callAIWithRetry(text,onProgress,logContext){
  const MAX=4, DELAYS=[0,4000,8000,12000];
  const MODEL_KEYS=['gemini-2.5-flash','gemini-flash-latest','gpt-4o-mini','gemini-2.5-pro'];
  const ENGINE_MSGS=[
    '⚡ Gemini 2.5 Flash 시도 중...',
    'Flash Latest로 재시도 중...',
    'GPT-4o Mini로 전환 중...',
    '🚀 Gemini 2.5 Pro로 최종 고품질 생성 중...'
  ];
  // AI 진행 화면 시작 (GAS 내부 타임아웃 고려: 0~15초 정상, 15~40초 재시도/폴백, 40초+ OpenAI)
  const _startTime=Date.now();
  let _currentPhase='running';
  const _timer=setInterval(()=>{
    const elapsed=Math.floor((Date.now()-_startTime)/1000);
    if(elapsed>=50 && _currentPhase==='running') _currentPhase='fallback';
    emitAIProgress({elapsed,phase:_currentPhase,visible:true});
  },1000);
  emitAIProgress({elapsed:0,phase:'running',visible:true});
  const _cleanup=()=>{clearInterval(_timer);emitAIProgress({visible:false});};
  const _origProgress=onProgress;
  onProgress=(msg)=>{
    if(_origProgress)_origProgress(msg);
    if(msg&&(msg.includes('Flash Latest')||msg.includes('GPT-4o')||msg.includes('대체'))){
      _currentPhase='fallback';
    }
  };
  // 요청 ID: 같은 요청의 시도들을 묶기 위한 고유 ID
  const _requestId='REQ-'+Date.now()+'-'+Math.random().toString(36).substr(2,6);
  const _logAttempt=(modelKey,success,failReason)=>{
    if(!logContext)return;
    try{callAPI({action:'logAIRequest',teacherId:logContext.teacherId||'',teacherName:logContext.teacherName||'',category:logContext.category||'',model:modelKey,success,failReason:failReason||'',elapsed:Math.floor((Date.now()-_startTime)/1000),logType:'attempt',requestId:_requestId});}catch(e){}
  };
  const _logFinal=(modelKey,success,failReason)=>{
    if(!logContext)return;
    try{callAPI({action:'logAIRequest',teacherId:logContext.teacherId||'',teacherName:logContext.teacherName||'',category:logContext.category||'',model:modelKey||'',success,failReason:failReason||'',elapsed:Math.floor((Date.now()-_startTime)/1000),logType:'final',requestId:_requestId});}catch(e){}
  };
  try{
  for(let i=0;i<MAX;i++){
    if(DELAYS[i]>0){
      if(onProgress)onProgress(`${ENGINE_MSGS[i]} (${Math.round(DELAYS[i]/1000)}초 대기)`);
      await new Promise(r=>setTimeout(r,DELAYS[i]));
    } else {
      if(onProgress)onProgress(ENGINE_MSGS[i]);
    }
    try{
      const res=await callAPI({action:'generateAI',text});
      if(res.success&&res.content){
        const modelLabel=res.model==='gpt-4o-mini'?'GPT-4o Mini':res.model||'AI';
        if(onProgress)onProgress(`✓ ${modelLabel} 생성 완료!`);
        _logAttempt(res.model||MODEL_KEYS[i],true,'');
        _logFinal(res.model||MODEL_KEYS[i],true,'');
        return res;
      }
      if(res.errorType==='overloaded'&&i<MAX-1){
        _logAttempt(MODEL_KEYS[i],false,res.errorType||'overloaded');
        if(onProgress)onProgress(`${ENGINE_MSGS[i]} 실패 → 다음 엔진으로...`);
        continue;
      }
      // 마지막 시도에서 최종 실패
      _logAttempt(MODEL_KEYS[i],false,res.errorType||'unknown');
      _logFinal(MODEL_KEYS[i],false,res.errorType||'unknown');
      return res;
    }catch(e){
      _logAttempt(MODEL_KEYS[i],false,'exception:'+(e.message||'error'));
      if(i<MAX-1){if(onProgress)onProgress(`${ENGINE_MSGS[i]} 오류 → 다음 엔진으로...`);continue;}
      _logFinal(MODEL_KEYS[i],false,'exception:'+(e.message||'error'));
      throw e;
    }
  }
  // 모든 시도 실패
  const _failResult={success:false,errorType:'overloaded',message:'선생님! 지금은 AI 요청이 많아 완성하지 못했습니다. 한번 더 시도해 주세요.'};
  _logFinal(MODEL_KEYS[MAX-1],false,'overloaded');
  return _failResult;
  }finally{
    const finalElapsed=Math.floor((Date.now()-_startTime)/1000);
    emitAIProgress({elapsed:finalElapsed,phase:'finishing',visible:true});
    await new Promise(r=>setTimeout(r,800));
    _cleanup();
  }
}

/* ── 관리자: 교사별 사용 현황 리더보드 ── */
function AdminTeacherRanking({onBack,onLogout}){
  const c='#4a148c';
  const phoneBg='#f4f0f9';
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    callAPI({action:'getAIStats'}).then(r=>{
      setData(r);
      setLoading(false);
    }).catch(()=>setLoading(false));
  },[]);

  if(loading)return(<div style={{background:phoneBg,minHeight:'100%',display:'flex',alignItems:'center',justifyContent:'center',padding:40}}><Spin/></div>);
  if(!data||!data.byTeacher)return(<div style={{background:phoneBg,minHeight:'100%',padding:40,textAlign:'center',color:'#999'}}>데이터 없음</div>);

  const byTeacher=data.byTeacher||[];
  const activeList=byTeacher.filter(t=>(t.success+t.fail)>0).sort((a,b)=>(b.success+b.fail)-(a.success+a.fail));
  const unusedList=byTeacher.filter(t=>(t.success+t.fail)===0);
  const totalGenerated=activeList.reduce((sum,t)=>sum+t.success+t.fail,0);

  return(<div style={{background:phoneBg,minHeight:'100%',paddingBottom:30}}>
    <div style={{background:`linear-gradient(135deg,${c},#6a1b9a)`,padding:'22px 20px 38px',position:'relative',overflow:'hidden'}}>
      <div style={{position:'absolute',bottom:-1,left:0,right:0,lineHeight:0,zIndex:2}}><svg viewBox="0 0 390 40" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" style={{display:'block',width:'100%'}}><path d="M0,0 C80,38 180,42 280,28 C340,20 370,14 390,12 L390,40 L0,40 Z" fill={phoneBg}/></svg></div>
      <div style={{position:'relative',zIndex:3}}>
        <button onClick={onBack} style={{display:'inline-flex',alignItems:'center',gap:5,background:'rgba(255,255,255,0.15)',border:'1px solid rgba(255,255,255,0.25)',borderRadius:20,padding:'5px 12px',height:26,fontSize:11,color:'rgba(255,255,255,0.9)',fontWeight:500,cursor:'pointer',marginBottom:14,fontFamily:'inherit'}}><svg width="11" height="11" fill="none" stroke="rgba(255,255,255,0.9)" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7"/></svg>관리자 홈</button>
        <p style={{fontSize:20,fontWeight:900,color:'white',margin:'0 0 3px'}}>👨‍🏫 교사별 사용 현황</p>
        <p style={{fontSize:11,color:'rgba(255,255,255,0.7)',margin:0}}>선생님별 AI 생성 횟수 리더보드</p>
      </div>
    </div>

    <div style={{padding:'14px'}}>
      {/* 전체 통계 */}
      <div style={{background:'white',borderRadius:12,padding:14,border:'1px solid #e1bee7',marginBottom:14}}>
        <p style={{fontSize:10,color:'#888',margin:'0 0 8px',fontWeight:700}}>전체 통계</p>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}}>
          <div style={{textAlign:'center',padding:'10px 4px',background:'#faf7fc',borderRadius:8}}>
            <p style={{fontSize:20,fontWeight:900,color:c,margin:'0 0 2px',lineHeight:1}}>{activeList.length}</p>
            <p style={{fontSize:9,color:'#888',margin:0,fontWeight:600}}>사용 교사</p>
          </div>
          <div style={{textAlign:'center',padding:'10px 4px',background:'#faf7fc',borderRadius:8}}>
            <p style={{fontSize:20,fontWeight:900,color:'#999',margin:'0 0 2px',lineHeight:1}}>{unusedList.length}</p>
            <p style={{fontSize:9,color:'#888',margin:0,fontWeight:600}}>미사용</p>
          </div>
          <div style={{textAlign:'center',padding:'10px 4px',background:'#faf7fc',borderRadius:8}}>
            <p style={{fontSize:20,fontWeight:900,color:c,margin:'0 0 2px',lineHeight:1}}>{totalGenerated}</p>
            <p style={{fontSize:9,color:'#888',margin:0,fontWeight:600}}>총 생성</p>
          </div>
        </div>
      </div>

      {/* 사용 순위 */}
      {activeList.length>0&&(<div style={{background:'white',borderRadius:12,padding:14,border:'1px solid #e1bee7',marginBottom:14}}>
        <p style={{fontSize:11,color:'#888',margin:'0 0 10px',fontWeight:700}}>🏆 사용 순위 (많이 사용한 순)</p>
        {activeList.map((t,i)=>{
          const total=t.success+t.fail;
          const rate=total>0?Math.round(t.success/total*100):0;
          const isTop3=i<=2;
          const rankBg=i===0?'linear-gradient(135deg,#ffd700,#ffa000)':i===1?'linear-gradient(135deg,#c0c0c0,#808080)':i===2?'linear-gradient(135deg,#cd7f32,#8b4513)':'#e0e0e0';
          const rankColor=isTop3?'white':'#666';
          const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
          const rowBg=i===0?'linear-gradient(135deg,#fff9e6,#fff3cd)':i===1?'linear-gradient(135deg,#f5f5f5,#e8e8e8)':i===2?'linear-gradient(135deg,#fff3e0,#ffe0b2)':'white';
          const rowBorder=i===0?'1.5px solid #ffc107':i===1?'1.5px solid #9e9e9e':i===2?'1.5px solid #ff9800':'0.5px solid #f0e8f5';
          return(<div key={t.teacherId} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',marginBottom:6,background:rowBg,border:rowBorder,borderRadius:10}}>
            <div style={{width:28,height:28,background:rankBg,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:isTop3?16:12,fontWeight:900,color:rankColor,flexShrink:0,boxShadow:isTop3?'0 2px 6px rgba(0,0,0,0.15)':'none'}}>{isTop3?medal:i+1}</div>
            <div style={{width:32,height:32,background:'linear-gradient(135deg,#f4f0f9,#e1bee7)',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,fontWeight:900,color:c,flexShrink:0}}>{(t.teacherName||'?')[0]}</div>
            <div style={{flex:1,minWidth:0}}>
              <p style={{fontSize:13,fontWeight:800,color:'#1a1a2e',margin:'0 0 2px'}}>{t.teacherName||t.teacherId} 선생님</p>
              <p style={{fontSize:10,color:'#888',margin:0}}>성공 {t.success}건 · 실패 {t.fail}건 · 성공률 {rate}%</p>
            </div>
            <div style={{textAlign:'right',flexShrink:0}}>
              <p style={{fontSize:18,fontWeight:900,color:c,margin:'0 0 1px',lineHeight:1}}>{total}</p>
              <p style={{fontSize:9,color:'#888',margin:0,fontWeight:600}}>건 생성</p>
            </div>
          </div>);
        })}
      </div>)}

      {/* 미사용 교사 */}
      {unusedList.length>0&&(<div style={{background:'white',borderRadius:12,padding:14,border:'1px solid #e1bee7'}}>
        <p style={{fontSize:11,color:'#888',margin:'0 0 10px',fontWeight:700}}>💤 미사용 교사 ({unusedList.length}명)</p>
        {unusedList.map((t,i)=>(<div key={t.teacherId} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 10px',marginBottom:5,background:'#fafafa',borderRadius:8,opacity:0.7}}>
          <div style={{width:26,height:26,background:'#e0e0e0',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:900,color:'#999',flexShrink:0}}>—</div>
          <div style={{width:28,height:28,background:'#f5f5f5',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:900,color:'#bbb',flexShrink:0}}>{(t.teacherName||'?')[0]}</div>
          <span style={{fontSize:12,fontWeight:700,color:'#999',flex:1}}>{t.teacherName||t.teacherId} 선생님</span>
          <span style={{fontSize:9,color:'#bbb',fontWeight:700,background:'#f5f5f5',padding:'2px 8px',borderRadius:10}}>미사용</span>
        </div>))}
      </div>)}
    </div>
  </div>);
}

function AdminUnregistered({user,onBack,onLogout}){
  const c='#4a148c';
  const phoneBg='#f4f0f9';
  const [data,setData]=useState(null),[loading,setLoading]=useState(true);
  const [gradeFilter,setGradeFilter]=useState('');
  const [classFilter,setClassFilter]=useState('');
  const [sending,setSending]=useState(false),[sendResult,setSendResult]=useState(null);

  useEffect(()=>{
    callAPI({action:'getUnregisteredStudents'}).then(r=>{
      if(r.success)setData(r);
      else alert(r.message||'조회 실패');
      setLoading(false);
    }).catch(()=>{alert('서버 오류');setLoading(false);});
  },[]);

  if(loading)return(<div style={{background:phoneBg,minHeight:'100%',display:'flex',alignItems:'center',justifyContent:'center',padding:40}}><Spin/></div>);
  if(!data)return(<div style={{background:phoneBg,minHeight:'100%',padding:40,textAlign:'center',color:'#999'}}>데이터 없음</div>);

  const filtered=data.unregistered.filter(s=>{
    if(gradeFilter&&s.grade!==gradeFilter)return false;
    if(classFilter&&s.classNum!==classFilter)return false;
    return true;
  });

  const classOptions=gradeFilter?(CLASS_COUNT[gradeFilter]?Array.from({length:CLASS_COUNT[gradeFilter]},(_,i)=>String(i+1)):[]):[];

  return(<div style={{background:phoneBg,minHeight:'100%',paddingBottom:30}}>

      <div style={{position:'absolute',bottom:-1,left:0,right:0,lineHeight:0,zIndex:2}}><svg viewBox="0 0 390 40" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" style={{display:'block',width:'100%'}}><path d="M0,0 C80,38 180,42 280,28 C340,20 370,14 390,12 L390,40 L0,40 Z" fill={phoneBg}/></svg></div>
      <div style={{position:'relative',zIndex:3}}>
        <button onClick={onBack} style={{display:'inline-flex',alignItems:'center',gap:5,background:'rgba(255,255,255,0.15)',border:'1px solid rgba(255,255,255,0.25)',borderRadius:20,padding:'5px 12px',height:26,fontSize:11,color:'rgba(255,255,255,0.9)',fontWeight:500,cursor:'pointer',marginBottom:14,fontFamily:'inherit'}}><svg width="11" height="11" fill="none" stroke="rgba(255,255,255,0.9)" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7"/></svg>관리자 홈</button>
        <p style={{fontSize:20,fontWeight:900,color:'white',margin:'0 0 2px'}}>가입 안 한 학생</p>
        <p style={{fontSize:11,color:'rgba(255,255,255,0.7)',margin:0}}>전체 {data.totalStudents}명 중 {data.unregistered.length}명 미가입</p>
      </div>
    </div>
    <div style={{padding:'12px 14px'}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:12}}>
        <div style={{background:'white',borderRadius:10,padding:'10px 8px',border:'1px solid #e1bee7',textAlign:'center'}}>
          <p style={{fontSize:9,color:'#999',margin:'0 0 3px',fontWeight:600}}>전체 학생</p>
          <p style={{fontSize:18,fontWeight:900,color:'#1a1a2e',margin:0}}>{data.totalStudents}명</p>
        </div>
        <div style={{background:'#e8f5e9',borderRadius:10,padding:'10px 8px',border:'1px solid #a5d6a7',textAlign:'center'}}>
          <p style={{fontSize:9,color:'#2e7d32',margin:'0 0 3px',fontWeight:600}}>가입</p>
          <p style={{fontSize:18,fontWeight:900,color:'#2e7d32',margin:0}}>{data.registeredCount}명</p>
        </div>
        <div style={{background:'#fce4ec',borderRadius:10,padding:'10px 8px',border:'1px solid #f8bbd0',textAlign:'center'}}>
          <p style={{fontSize:9,color:'#c2185b',margin:'0 0 3px',fontWeight:600}}>미가입</p>
          <p style={{fontSize:18,fontWeight:900,color:'#c2185b',margin:0}}>{data.unregistered.length}명</p>
        </div>
      </div>
      <div style={{background:'white',borderRadius:10,padding:12,border:'1px solid #e1bee7',marginBottom:12}}>
        <p style={{fontSize:11,fontWeight:700,color:c,margin:'0 0 8px'}}>반별 가입 현황</p>
        <div style={{display:'flex',flexDirection:'column',gap:5}}>
          {Object.keys(data.classStats).sort().map(k=>{
            const s=data.classStats[k];
            const rate=s.total?Math.round(s.registered/s.total*100):0;
            return(<div key={k} style={{display:'flex',alignItems:'center',gap:8}}>
              <span style={{fontSize:10,color:'#888',fontWeight:700,width:48,flexShrink:0}}>{k[0]}학년 {k[1]}반</span>
              <div style={{flex:1,height:6,background:'#f5f5f5',borderRadius:3,overflow:'hidden'}}>
                <div style={{width:`${rate}%`,height:'100%',background:rate>=80?'#66bb6a':rate>=50?'#ffa726':'#ef5350'}}/>
              </div>
              <span style={{fontSize:10,color:'#999',fontWeight:600,width:60,textAlign:'right',flexShrink:0}}>{s.registered}/{s.total}명 ({rate}%)</span>
            </div>);
          })}
        </div>
      </div>
      <div style={{display:'flex',gap:5,marginBottom:6}}>
        <button type="button" onClick={()=>{setGradeFilter('');setClassFilter('');}} style={{flex:1,padding:'7px 0',borderRadius:8,border:'none',fontSize:11,fontWeight:700,cursor:'pointer',background:!gradeFilter?c:'white',color:!gradeFilter?'white':'#bbb',fontFamily:'inherit',boxShadow:!gradeFilter?'none':'0 0 0 0.5px rgba(0,0,0,0.1) inset'}}>전체</button>
        {['1','2','3'].map(g=>(<button key={g} type="button" onClick={()=>{setGradeFilter(g);setClassFilter('');}} style={{flex:1,padding:'7px 0',borderRadius:8,border:'none',fontSize:11,fontWeight:700,cursor:'pointer',background:gradeFilter===g?c:'white',color:gradeFilter===g?'white':'#bbb',fontFamily:'inherit',boxShadow:gradeFilter===g?'none':'0 0 0 0.5px rgba(0,0,0,0.1) inset'}}>{g}학년</button>))}
      </div>
      {classOptions.length>0&&(<div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:8}}>
        <button type="button" onClick={()=>setClassFilter('')} style={{padding:'4px 10px',borderRadius:14,border:'none',fontSize:10,fontWeight:700,cursor:'pointer',background:!classFilter?c:'white',color:!classFilter?'white':'#bbb',fontFamily:'inherit',boxShadow:!classFilter?'none':'0 0 0 0.5px rgba(0,0,0,0.1) inset'}}>전체 반</button>
        {classOptions.map(cls=>(<button key={cls} type="button" onClick={()=>setClassFilter(cls)} style={{padding:'4px 10px',borderRadius:14,border:'none',fontSize:10,fontWeight:700,cursor:'pointer',background:classFilter===cls?c:'white',color:classFilter===cls?'white':'#bbb',fontFamily:'inherit',boxShadow:classFilter===cls?'none':'0 0 0 0.5px rgba(0,0,0,0.1) inset'}}>{cls}반</button>))}
      </div>)}
      {/* 일괄 발송 버튼 (필터된 학생 중 전화번호 있는 경우만) */}
      {(()=>{
        const sendable=filtered.filter(s=>s.phone&&s.phone.length>=10);
        if(sendable.length===0)return null;
        return(<button type="button" onClick={async()=>{
          if(!confirm(`${sendable.length}명에게 카카오 알림톡을 일괄 발송할까요?\n\n(전화번호 없는 학생은 제외됨)`))return;
          setSending(true);setSendResult(null);
          try{
            const r=await callAPI({action:'sendUnregisteredAlimtalk',students:sendable.map(s=>({studentId:s.studentId,name:s.name,phone:s.phone})),senderId:user?.studentId||'',senderName:user?.name||''});
            if(r.success){
              setSendResult({total:r.total,success:r.successCount,fail:r.failCount});
              alert(`발송 완료!\n성공: ${r.successCount}건\n실패: ${r.failCount}건`);
            }else alert(r.message||'발송 실패');
          }catch(e){alert('서버 오류: '+e.message);}
          setSending(false);
        }} disabled={sending} style={{width:'100%',padding:'11px 0',marginBottom:10,borderRadius:10,border:'none',background:sending?'#ccc':'linear-gradient(135deg,#fee500,#ffcd00)',color:'#1a1a2e',fontSize:13,fontWeight:800,cursor:sending?'default':'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',justifyContent:'center',gap:6}}>
          {sending?<><Spin/> 발송 중...</>:<>💬 {sendable.length}명에게 카카오 알림톡 일괄 발송</>}
        </button>);
      })()}

}

}

function StudentList({user,records,onSelect,onTeacherWrite,onBack}){
  const [students,setStudents]=useState(null),[loading,setLoading]=useState(true);
  const hc=user.homeroomClass||'',isCareer=user.role==='career';
  useEffect(()=>{
    if(!isCareer&&hc){
      callAPI({action:'getStudentsByClass',classCode:hc}).then(r=>{setStudents(r.students||[]);setLoading(false);}).catch(()=>setLoading(false));
    }else{
      const map={};
      records.forEach(r=>{if(!map[r.studentId])map[r.studentId]={id:r.studentId,name:r.name,studentId:r.studentId};});
      setStudents(Object.values(map).sort((a,b)=>String(a.id).localeCompare(String(b.id))));
      setLoading(false);
    }
  },[]);
  // 진로/자율 건수를 각각 계산
  const getCounts=(id)=>{
    const recs=records.filter(r=>String(r.studentId)===String(id));
    return {
      career: recs.filter(r=>r.categoryId==='career').length,
      creative: recs.filter(r=>r.categoryId==='creative').length,
    };
  };
  const col=ROLE_COLORS[user.role];
  return(<div style={{paddingBottom:20}}>
    <div style={{background:`linear-gradient(135deg,${col},${col}cc)`,padding:'20px 16px 28px'}}>
      <button onClick={onBack} style={{background:'rgba(255,255,255,0.2)',border:'none',color:'white',borderRadius:20,padding:'5px 12px',fontSize:12,fontWeight:700,cursor:'pointer',marginBottom:12,display:'flex',alignItems:'center',gap:4}}><Back/> 홈</button>
      <h2 style={{fontSize:18,fontWeight:900,color:'white',margin:0}}>학생 목록</h2>
    </div>
    <div style={{padding:'0 14px',marginTop:-12,display:'flex',flexDirection:'column',gap:6}}>
      {loading&&<p style={{textAlign:'center',color:'#ccc',padding:20}}>불러오는 중...</p>}
      {!loading&&(students||[]).length===0&&<div className="card" style={{padding:30,textAlign:'center',color:'#ccc'}}>기록된 학생이 없습니다</div>}
      {(students||[]).map(s=>{
        const sid=s.studentId||s.id;
        const c=getCounts(sid);
        const total=c.career+c.creative;
        return(<div key={sid} className="card" style={{padding:'10px 12px',display:'flex',alignItems:'center',gap:8,width:'100%'}}>
          <span style={{fontSize:12,color:'#bbb',fontWeight:700,width:36,flexShrink:0}}>{s.number?s.number+'번':String(sid).slice(2)}</span>
          <span style={{fontSize:14,fontWeight:800,color:'#1a1a2e'}}>{s.name}</span>
          <button onClick={(e)=>{e.stopPropagation();onTeacherWrite({id:sid,name:s.name});}} style={{background:'#0a6e55',color:'white',border:'none',borderRadius:14,padding:'4px 9px',fontSize:10,fontWeight:700,cursor:'pointer',flexShrink:0,fontFamily:'inherit'}}>+담임작성</button>
          <span style={{flex:1}}></span>
          {total>0?(
            <div style={{display:'flex',gap:3,flexShrink:0}}>
              <span style={{fontSize:10,background:c.career>0?'#fce4ec':'#f5f5f5',color:c.career>0?'#c2185b':'#ccc',padding:'2px 6px',borderRadius:8,fontWeight:700}}>진로 {c.career}</span>
              <span style={{fontSize:10,background:c.creative>0?'#e0f2f1':'#f5f5f5',color:c.creative>0?'#00695c':'#ccc',padding:'2px 6px',borderRadius:8,fontWeight:700}}>자율 {c.creative}</span>

function AIProgressOverlay() {
  const [state, setState] = useState({ visible: false, elapsed: 0, phase: 'running' });

  useEffect(() => {
    const listener = (s) => {
      setState(prev => ({ ...prev, ...s }));
    };
    window.__aiProgressListeners.push(listener);
    return () => {
      window.__aiProgressListeners = window.__aiProgressListeners.filter(fn => fn !== listener);
    };
  }, []);

  if (!state.visible) return null;
  const { elapsed, phase } = state;

  const mm = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const ss = String(elapsed % 60).padStart(2, '0');

  // 진행률 계산 (0~95%, 완료 직전엔 95% 고정)
  let progress;
  if (phase === 'finishing') {
    progress = 95;
  } else if (phase === 'fallback') {
    progress = Math.min(60 + (elapsed - 40) * 1.0, 85);
  } else {
    progress = Math.min(elapsed * 1.5, 60);
  }

  // 상태별 테마
  const theme = {
    running:   { bar: '#9B1C2E', tipBg: '#ECFDF5', tipBorder: '#A7F3D0', tipText: '#065F46' },
    fallback:  { bar: '#D97706', tipBg: '#FFFBEB', tipBorder: '#FCD34D', tipText: '#92400E' },
    finishing: { bar: '#059669', tipBg: '#ECFDF5', tipBorder: '#A7F3D0', tipText: '#065F46' },
  }[phase];

  // 상태별 텍스트
  const copy = {
    running: {
      title: 'AI가 생기부를 작성하고 있어요',
      message: '⚡ Gemini 2.5 Flash 엔진이 학생의 활동 기록을 분석하여 생기부 초안을 만들고 있어요',
      tip: '💡 보통 30~90초 정도 소요됩니다. 트래픽이 심할 시 더 정교한 엔진(Pro)으로 재시도합니다. 화면을 닫지 말고 잠시만 기다려 주세요.',
    },
    fallback: {
      title: 'AI가 생기부를 작성하고 있어요',
      message: '🔄 트래픽이 많아 다른 엔진으로 자동 전환하여 생기부를 계속 작성하고 있어요',
      tip: '⏳ 현재 서버 트래픽이 많아 다음 엔진으로 자동 전환되었습니다. 잠시만 더 기다려 주세요.',
    },
    finishing: {
      title: '거의 다 완성됐어요!',
      message: '생기부 초안이 완성되어 마무리 검토 중이에요',
      tip: '✨ 거의 완성됐어요! 1,500byte 분량과 규칙 준수를 확인 중이에요.',
    },
  }[phase];

  // 시스템 상태 로그 (시간 흐름 기반 3단계 순차 표시 + Fallback 이력)
  const logs = [];

  if (phase === 'running') {
    // 0~5초: 프롬프트 분석중 (반짝)
    if (elapsed < 5) {
      logs.push({ icon: '⚡', text: '프롬프트 분석중', animated: true });
      logs.push({ icon: '⏸️', text: '프롬프트 구성중', pending: true });
      logs.push({ icon: '⏸️', text: 'Gemini 2.5 Flash로 생성 중', pending: true });
    }
    // 5~10초: 프롬프트 구성중 (반짝)
    else if (elapsed < 10) {
      logs.push({ icon: '✅', text: '프롬프트 분석중', done: true });
      logs.push({ icon: '⚡', text: '프롬프트 구성중', animated: true });
      logs.push({ icon: '⏸️', text: 'Gemini 2.5 Flash로 생성 중', pending: true });
    }
    // 10초 이후: Flash로 생성 중 (반짝)
    else {
      logs.push({ icon: '✅', text: '프롬프트 분석중', done: true });
      logs.push({ icon: '✅', text: '프롬프트 구성중', done: true });
      logs.push({ icon: '⚡', text: 'Gemini 2.5 Flash로 생성 중', animated: true });
    }
  } else if (phase === 'fallback') {
    // 이전 단계 모두 완료 + Flash 실패 이력
    logs.push({ icon: '✅', text: '프롬프트 분석중', done: true });
    logs.push({ icon: '✅', text: '프롬프트 구성중', done: true });
    logs.push({ icon: '⚠️', text: 'Gemini 2.5 Flash 응답 지연', warn: true });

    // 경과 시간에 따라 다음 엔진 순차 시도
    if (elapsed < 90) {
      logs.push({ icon: '🔄', text: 'Flash Latest로 재시도 중', animated: true });
    } else if (elapsed < 120) {
      logs.push({ icon: '⚠️', text: 'Flash Latest 응답 지연', warn: true });
      logs.push({ icon: '🔄', text: 'GPT-4o Mini로 재시도 중', animated: true });
    } else {
      logs.push({ icon: '⚠️', text: 'Flash Latest 응답 지연', warn: true });
      logs.push({ icon: '⚠️', text: 'GPT-4o Mini 응답 지연', warn: true });
      logs.push({ icon: '🚀', text: 'Gemini 2.5 Pro로 최종 생성 중', animated: true });
    }
  } else {
    logs.push({ icon: '✅', text: '프롬프트 분석중', done: true });
    logs.push({ icon: '✅', text: '프롬프트 구성중', done: true });
    logs.push({ icon: '✅', text: 'AI 응답 수신 완료', done: true });
    logs.push({ icon: '⏳', text: '1,250~1,450byte 분량 검증 중', animated: true });
  }
  return (
    <div style={{
      position: 'fixed', inset: 0, zIndex: 9999,
      background: 'rgba(0,0,0,0.55)', backdropFilter: 'blur(4px)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      padding: '16px',
    }}>
      <style>{`
        @keyframes aipo-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        @keyframes aipo-shimmer {
          0% { background-position: -200% 0; }
          100% { background-position: 200% 0; }
        }
        @keyframes aipo-pulse-dot {
          0%,100% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.4); opacity: 0.6; }
        }
        .aipo-animated { animation: aipo-pulse 1.2s ease-in-out infinite; }
        .aipo-bar-fill {
          background: linear-gradient(90deg, var(--aipo-bar) 0%, var(--aipo-bar) 50%, rgba(255,255,255,0.3) 50%, var(--aipo-bar) 100%);
          background-size: 200% 100%;
          animation: aipo-shimmer 2s linear infinite;
        }
      `}</style>

      <div style={{
        background: '#fff', borderRadius: '16px', width: '100%', maxWidth: '480px',
        boxShadow: '0 20px 60px rgba(0,0,0,0.3)', overflow: 'hidden',
        maxHeight: '90vh', overflowY: 'auto',
      }}>
        {/* 헤더 */}
        <div style={{ padding: '20px 20px 12px', borderBottom: '1px solid #F1EFE8' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '12px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px', minWidth: 0 }}>
              <div style={{ fontSize: '28px', flexShrink: 0 }}>🤖</div>
              <div style={{ fontSize: '16px', fontWeight: 700, color: '#1F1F1F', lineHeight: 1.3 }}>
                {copy.title}
              </div>
            </div>
            <div style={{
              fontFamily: 'monospace', fontSize: '14px', fontWeight: 600,
              color: '#6B5B4D', background: '#FAF5F0', padding: '4px 10px',
              borderRadius: '6px', flexShrink: 0,
            }}>
              {mm}:{ss}
            </div>
          </div>
        </div>

        {/* 진행률 바 */}
        <div style={{ padding: '16px 20px' }}>
          <div style={{
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            marginBottom: '8px',
          }}>
            <div style={{ fontSize: '12px', color: '#6B5B4D', fontWeight: 500 }}>진행률</div>
            <div style={{ fontSize: '13px', color: theme.bar, fontWeight: 700 }}>{Math.round(progress)}%</div>
          </div>
          <div style={{
            height: '8px', background: '#F1EFE8', borderRadius: '4px', overflow: 'hidden',
          }}>
            <div
              className="aipo-bar-fill"
              style={{
                width: `${progress}%`, height: '100%',
                '--aipo-bar': theme.bar,
                transition: 'width 0.5s ease-out',
              }}
            />
          </div>
        </div>

        
        {/* 시스템 상태 박스 */}
        <div style={{ padding: '0 20px 12px' }}>
          <div style={{
            background: '#F1EFE8', borderRadius: '10px', padding: '14px 16px',
          }}>
            <div style={{ fontSize: '12px', fontWeight: 700, color: '#6B5B4D', marginBottom: '10px' }}>
              ⚙️ 시스템 상태
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
              {logs.map((log, i) => (
                <div
                  key={i}

                  style={{
                    display: 'flex', alignItems: 'center', gap: '8px',

      {isStudent&&view==='cat'&&catId==='subject'&&subject&&writing&&<SubjectForm subject={subject} editing={editing} onSave={editing?updateRec:saveRec} onCancel={()=>{setWriting(false);setEditing(null);}}/>}
      {isStudent&&view==='cat'&&catId==='club'&&!subject&&<ClubList user={user} records={records} onSelect={s=>setSubject(s)} onBack={()=>{setCatId(null);setView('home');}}/>}
      {isStudent&&view==='cat'&&catId==='club'&&subject&&!writing&&<ClubRecords club={subject} records={records} onBack={()=>{setSubject(null);setCatId(null);setView('home');}} onWrite={()=>setWriting(true)} onDelete={deleteRec} onEdit={r=>{setEditing(r);setWriting(true);}} onChangeClub={()=>{try{localStorage.removeItem('selectedClub_'+user.studentId);}catch(e){}setSubject(null);}}/>}
      {isStudent&&view==='cat'&&catId==='club'&&subject&&writing&&<ClubForm club={subject} editing={editing} onSave={editing?updateRec:saveRec} onCancel={()=>{setWriting(false);setEditing(null);}}/>}

      {(isTeacher||isCareer)&&view==='home'&&<TeacherHome user={user} records={records} onSelectStudent={()=>setView('students')} onViewReports={()=>setView('reports')} onSubjectHome={()=>{setView('subjectHome');let sc=[];if(user.assignments){try{sc=JSON.parse(user.assignments).flatMap(a=>a.classes);}catch(e){}}callAPI({action:'getAllRecords',role:'subject',grade:'',classNum:'',homeroomClass:'',subjectClasses:sc,studentId:user.studentId}).then(res=>{if(res.success)setSubjectRecords(res.records||[]);});}} onAddSubject={()=>setView('addSubject')} onMyReports={()=>setView('myReports')} onClubReports={()=>setView('clubReports')} onBehavior={()=>setView('behavior')} onClubHome={()=>{setView('clubHome');callAPI({action:'getAllRecords',role:'club',grade:'',classNum:'',homeroomClass:'',subjectClasses:[],studentId:user.studentId,club:user.club||''}).then(res=>{if(res.success)setSubjectRecords(res.records||[]);});}} onBack={goBackToRole} onLogout={logout}/>}
      {isAdmin&&view==='home'&&<AdminHome user={user} onUnregistered={()=>setView('adminUnregistered')} onClassStats={()=>setView('adminClassStats')} onAIStats={()=>setView('adminAIStats')} onTeacherRanking={()=>setView('adminTeacherRanking')} onBack={goBackToRole} onLogout={logout}/>}
      {isAdmin&&view==='adminTeacherRanking'&&<AdminTeacherRanking onBack={()=>setView('home')} onLogout={logout}/>}
      {isAdmin&&view==='adminUnregistered'&&<AdminUnregistered user={user} onBack={()=>setView('home')} onLogout={logout}/>}
      {isAdmin&&view==='adminClassStats'&&<AdminClassStats onStudentClick={s=>{setSelStudent(s);setView('adminStudentRecords');}} onBack={()=>setView('home')} onLogout={logout}/>}
      {isAdmin&&view==='adminStudentRecords'&&selStudent&&<AdminStudentRecords student={selStudent} onBack={()=>{setSelStudent(null);setView('adminClassStats');}} onLogout={logout}/>}
      {isAdmin&&view==='adminAIStats'&&<AdminAIStats onBack={()=>setView('home')} onLogout={logout}/>}
      {(isTeacher||isCareer)&&view==='students'&&!selStudent&&!teacherWriteStudent&&<StudentList user={user} records={records} onSelect={s=>{setSelStudent(s);setView('ai');}} onTeacherWrite={s=>{setTeacherWriteStudent(s);setTeacherWriteEditing(null);setView('teacherWrite');}} onBack={()=>setView('home')}/>}
      {(isTeacher||isCareer)&&view==='ai'&&selStudent&&<AIReport student={selStudent} user={user} refreshKey={aiRefreshKey} onEdit={(r)=>{setTeacherWriteStudent(selStudent);setTeacherWriteEditing(r);setView('teacherWrite');}} onDelete={async(id)=>{if(!confirm('삭제할까요?'))return;try{await callAPI({action:'deleteRecord',recordId:id,studentId:selStudent.id});setAiRefreshKey(k=>k+1);fetchRecords(user);}catch(e){alert('삭제 실패');}}} onBack={()=>{setSelStudent(null);setView('students');}}/>}
      {(isTeacher||isCareer)&&view==='teacherWrite'&&teacherWriteStudent&&<TeacherWriteForm student={teacherWriteStudent} editing={teacherWriteEditing} onSave={async(data)=>{try{const payload={...data,studentId:teacherWriteStudent.id,name:teacherWriteStudent.name};const action=teacherWriteEditing?'updateRecord':'saveRecord';const r=await callAPI({action,record:payload});if(r.success){await fetchRecords(user);setAiRefreshKey(k=>k+1);setTeacherWriteStudent(null);setTeacherWriteEditing(null);setView(selStudent?'ai':'students');}else alert(r.message);}catch(e){alert('저장 실패');}}} onCancel={()=>{setTeacherWriteStudent(null);setTeacherWriteEditing(null);setView(selStudent?'ai':'students');}}/>}
      {isTeacher&&view==='teacherClubWrite'&&teacherWriteStudent&&<TeacherClubWriteForm student={teacherWriteStudent} editing={teacherWriteEditing} onSave={async(data)=>{try{const payload={...data,studentId:teacherWriteStudent.id,name:teacherWriteStudent.name};const action=teacherWriteEditing?'updateRecord':'saveRecord';const r=await callAPI({action,record:payload});if(r.success){let sc=[];if(user.assignments){try{sc=JSON.parse(user.assignments).flatMap(a=>a.classes);}catch(e){}}callAPI({action:'getAllRecords',role:'club',grade:'',classNum:'',homeroomClass:'',subjectClasses:[],studentId:user.studentId,club:user.club||''}).then(res=>{if(res.success)setSubjectRecords(res.records||[]);});setAiRefreshKey(k=>k+1);setTeacherWriteStudent(null);setTeacherWriteEditing(null);setView(selStudent?'clubDetail':'clubHome');}else alert(r.message);}catch(e){alert('저장 실패');}}} onCancel={()=>{setTeacherWriteStudent(null);setTeacherWriteEditing(null);setView(selStudent?'clubDetail':'clubHome');}}/>}
      {(isTeacher||isCareer)&&view==='reports'&&<ReportList user={user} onBack={()=>setView('home')}/>}

      {isTeacher&&view==='myReports'&&<MyReportList user={user} onBack={()=>setView('home')}/>}
      {isTeacher&&view==='addSubject'&&<AddSubjectOnly onDone={async(nd)=>{let ex=[];try{ex=user.assignments?JSON.parse(user.assignments):[];}catch(e){}const ni=JSON.parse(nd);const mg=[...ex];ni.forEach(n=>{const idx=mg.findIndex(e=>e.subject===n.subject);if(idx>=0)mg[idx]={...mg[idx],classes:[...new Set([...mg[idx].classes,...n.classes])].sort()};else mg.push(n);});const ms=JSON.stringify(mg);const res=await callAPI({action:'updateTeacherAssignments',teacherId:user.studentId,assignments:ms});if(res.success){const u2={...user,assignments:ms};setUser(u2);saveSession({role:u2.role,user:u2});fetchRecords(u2);}setView('home');}} onBack={()=>setView('home')}/>}
      {isTeacher&&view==='subjectHome'&&!selAssignment&&<SubjectTeacherHome user={user} records={subjectRecords||[]} onSelectSubject={a=>{setSelAssignment(a);setView('classes');}} onAddSubject={()=>setView('addSubject')} onDeleteSubject={async(a)=>{if(!confirm(`"${a.subject}" 과목을 삭제할까요?`))return;let ex=[];try{ex=user.assignments?JSON.parse(user.assignments):[];}catch(e){}const mg=ex.filter(e=>e.subject!==a.subject);const ms=JSON.stringify(mg);const res=await callAPI({action:'updateTeacherAssignments',teacherId:user.studentId,assignments:ms});if(res.success){const u2={...user,assignments:ms};setUser(u2);saveSession({role:u2.role,user:u2});fetchRecords(u2);}}} onBack={()=>setView('home')}/>}
      {isTeacher&&view==='classes'&&selAssignment&&!selClass&&<SubjectClassList assignment={selAssignment} records={subjectRecords||records} onSelect={cls=>{setSelClass(cls);setView('students2');}} onBack={()=>{setSelAssignment(null);setView('subjectHome');}}/>}
      {isTeacher&&view==='students2'&&selClass&&!selStudent&&<SubjectStudentList assignment={selAssignment} classCode={selClass} records={subjectRecords||records} onSelect={s=>{setSelStudent(s);setView('detail');}} onBack={()=>{setSelClass(null);setView('classes');}}/>}
      {isTeacher&&view==='detail'&&selStudent&&<SubjectStudentDetail student={selStudent} user={user} records={subjectRecords||records} onBack={()=>{setSelStudent(null);setView('students2');}}/>}
      {isTeacher&&view==='clubHome'&&!selStudent&&!teacherWriteStudent&&<ClubStudentList user={user} records={subjectRecords||[]} refreshKey={aiRefreshKey} onSelect={s=>{setSelStudent(s);setView('clubDetail');}} onTeacherWrite={s=>{setTeacherWriteStudent({id:s.id,name:s.name,club:s.club,forClub:true});setTeacherWriteEditing(null);setView('teacherClubWrite');}} onImportStudents={()=>setView('clubPicker')} onBack={()=>setView('home')}/>}
      {isTeacher&&view==='clubPicker'&&<ClubStudentPicker user={user} onBack={()=>setView('clubHome')} onDone={()=>{setAiRefreshKey(k=>k+1);setView('clubHome');}}/>}
      {isTeacher&&view==='clubDetail'&&selStudent&&<ClubStudentDetail student={selStudent} user={user} records={subjectRecords||[]} onBack={()=>{setSelStudent(null);setView('clubHome');}}/>}
      {isTeacher&&view==='clubReports'&&<ClubReportList user={user} onBack={()=>setView('home')}/>}
      {isTeacher&&view==='behavior'&&!selStudent&&<BehaviorStudentList user={user} onSelect={s=>{setSelStudent(s);setView('behaviorDetail');}} onBack={()=>setView('home')}/>}
      {isTeacher&&view==='behaviorDetail'&&selStudent&&<BehaviorDetail student={selStudent} user={user} onBack={()=>{setSelStudent(null);setView('behavior');}}/>}
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
