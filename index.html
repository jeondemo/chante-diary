<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>과천여고 창체 다이어리</title>
    <base target="_top">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background: #f0f2f5; margin: 0; padding: 0; color: #1a1a1a; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        
        /* 💎 Premium Glassmorphism & Animations */
        .glass-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.08);
            position: relative;
            overflow: hidden;
        }
        .glass-card::before {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.6s;
        }
        .glass-card:hover::before { left: 100%; }
        
        .premium-shadow { box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.15); }
        .active-scale:active { transform: scale(0.95); }
        
        @keyframes fadeInSlideUp {
            from { opacity: 0; transform: translateY(25px) scale(0.98); filter: blur(8px); }
            to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }
        .animate-premium { animation: fadeInSlideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes meshAnimation {
            0% { background-position: 0% 50%; opacity: 0.85; }
            50% { background-position: 100% 50%; opacity: 1; }
            100% { background-position: 0% 50%; opacity: 0.85; }
        }
        .bg-mesh {
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.4) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.4) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.35) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(236, 72, 153, 0.35) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(139, 92, 246, 0.3) 0px, transparent 50%);
            background-attachment: fixed;
            background-size: 200% 200%;
            animation: meshAnimation 12s ease-in-out infinite;
        }

        /* 🌈 Rainbow Border Animation */
        @keyframes rainbow-rotate {
            100% { transform: rotate(360deg); }
        }
        .rainbow-container {
            position: relative;
            z-index: 0;
            overflow: hidden;
            padding: 2.5px; /* Border thickness */
        }
        .rainbow-container::before {
            content: "";
            position: absolute;
            z-index: -2;
            left: -50%; top: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(
                to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8f00ff, #ff0000
            );
        }
        .rainbow-container::after {
            content: "";
            position: absolute;
            z-index: -1;
            left: 2.5px; top: 2.5px;
            width: calc(100% - 5px); height: calc(100% - 5px);
            background: white; /* Blocks inner chaos */
            border-radius: inherit;
        }

        .premium-text-glow {
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.7), 0 0 20px rgba(99,102,241,0.5);
        }

        .chip-glow {
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }
        
        .horizontal-scroll {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        .horizontal-scroll::-webkit-scrollbar { display: none; }
        
        .class-chip {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .class-chip:active { transform: scale(0.92); }
        .class-chip.active {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
            border: none;
        }
        
        .teacher-card-vibrant {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #6366f1 100%);
            position: relative;
            overflow: hidden;
        }
        .teacher-card-vibrant::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: meshAnimation 8s linear infinite;
        }
        
        .roster-item {
            background: white;
            border: 1px solid rgba(0,0,0,0.03);
            transition: all 0.2s;
        }
        .roster-item:active { transform: scale(0.98); background: #f8fafc; }

        /* 🌌 Vivid but Restrained: Neon Edge Card */
        .neon-edge-container {
            position: relative;
            z-index: 1;
            padding: 2px;
            overflow: hidden;
            border-radius: 4rem;
        }
        .neon-edge-container::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(from 0deg, 
                transparent, #6366f1, #22d3ee, transparent 25%, 
                transparent 50%, #6366f1, #22d3ee, transparent 75%);
            animation: rainbow-rotate 4s linear infinite;
            z-index: -1;
        }
        .neon-card-inner {
            background: #0f172a;
            border-radius: calc(4rem - 2px);
            z-index: 1;
            position: relative;
            overflow: hidden;
        }
        .neon-card-inner::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 60%);
            pointer-events: none;
        }
        
        .premium-text-gradient {
            background: linear-gradient(135deg, #1e293b 0%, #475569 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-mesh lg:py-8 lg:flex lg:justify-center lg:items-center min-h-screen selection:bg-indigo-100 selection:text-indigo-900 overflow-x-hidden">
<div id="root"></div>
<script type="text/babel">
    const { useState, useEffect } = React;
    // ── 설정 ──────────────────────────────────────────────────────
    const API_URL = ""; // 보안을 위해 비워둡니다. google.script.run을 사용합니다.
    // 🔐 보안: API 키는 더 이상 이곳에 적지 않습니다. Code.gs 서버에서 관리합니다.
    // ── 아이콘 ────────────────────────────────────────────────────
    const HomeIcon     = ({ active }) => <svg className={`w-7 h-7 ${active ? 'text-blue-600' : 'text-gray-400'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>;
    const SparklesIcon = ({ active }) => <svg className={`w-7 h-7 ${active ? 'text-blue-600' : 'text-gray-400'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>;
    const BackIcon     = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M15 19l-7-7 7-7"/></svg>;
    const CareerIcon   = () => <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>;
    const SubjectIcon  = () => <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>;
    const CreativeIcon = () => <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"/></svg>;
    const FingerprintIcon = () => <svg className="w-10 h-10 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"/></svg>;
    const LoadingSpinner = () => <svg className="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/></svg>;
    const RefreshIcon = ({ size=16 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>;
    const LogOutIcon = ({ size=20 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>;
    // ── 카테고리 ──────────────────────────────────────────────────
    const CATEGORIES = {
        career:   { id:'career',   title:'진로활동',       color:'from-orange-400 to-red-500',    shadow:'shadow-orange-500/30',  bg:'bg-orange-50',  text:'text-orange-700', icon:<CareerIcon />,   desc:'나의 꿈과 진로 탐색 및 희망 전공 관련 기록' },
        subject:  { id:'subject',  title:'교과활동',       color:'from-blue-500 to-indigo-600',   shadow:'shadow-blue-500/30',    bg:'bg-blue-50',    text:'text-blue-700',   icon:<SubjectIcon />,  desc:'수업 시간의 배움, 수행평가, 세특 심화 탐구' },
        creative: { id:'creative', title:'창의적 체험활동', color:'from-emerald-400 to-teal-500', shadow:'shadow-teal-500/30',    bg:'bg-emerald-50', text:'text-teal-700',   icon:<CreativeIcon />, desc:'동아리, 자율, 봉사 등 학교 생활의 다양한 경험' }
    };
    // ── 역할 ──────────────────────────────────────────────────────
    const ROLES = {
        student:  { id:'student',  label:'학생',      emoji:'🎒', color:'from-blue-500 to-indigo-600',    shadow:'shadow-blue-500/30',   desc:'나의 창체활동 기록' },
        homeroom: { id:'homeroom', label:'담임교사',   emoji:'🏫', color:'from-emerald-500 to-teal-600',  shadow:'shadow-emerald-500/30', desc:'반 학생 기록 조회 + AI 생기부' },
        career:   { id:'career',   label:'진로담당',   emoji:'🧭', color:'from-orange-500 to-red-500',    shadow:'shadow-orange-500/30',  desc:'진로활동 전체 조회' },
        subject:  { id:'subject',  label:'교과목교사', emoji:'📚', color:'from-violet-500 to-purple-600', shadow:'shadow-violet-500/30',  desc:'교과활동 전체 조회' },
    };
    // ── 학년별 반 수 설정 ────────────────────────────────────────
    const CLASS_COUNT = { '1': 5, '2': 5, '3': 6 };
    
    // 🏷️ 학급 코드 변환기 (예: 11 -> 1학년 1반)
    const formatClassCode = (code) => {
        if (!code) return '';
        const sCode = String(code);
        if (sCode.length >= 2) {
            const grade = sCode.charAt(0);
            const cls = sCode.substring(1);
            return `${grade}학년 ${cls}반`;
        }
        return code + '반';
    };

    // ── 생기부 바이트 강제 조정 ───────────────────────────────────
    function adjustToByteRange(text, maxBytes = 1500) {
        const encoder = new TextEncoder();
        let result = text.trim();
        result = result.replace(/^(이\s*)?학생은\s*/g, '').replace(/^해당\s*학생은\s*/g, '');
        while (encoder.encode(result).length > maxBytes) {
            const endings = ['함.', '임.', '음.', '됨.', '보임.', '나타냄.', '드러냄.', '보여줌.', '있음.'];
            let lastIdx = -1;
            for (const e of endings) {
                const idx = result.lastIndexOf(e);
                if (idx > lastIdx) lastIdx = idx;
            }
            if (lastIdx > 0) {
                result = result.slice(0, lastIdx).trim();
            } else {
                result = result.slice(0, -3).trim();
            }
        }
        return result;
    }



    function callAPI(payload) {
        return new Promise((resolve, reject) => {
            google.script.run
                .withSuccessHandler(result => {
                    try {
                        resolve(typeof result === 'string' ? JSON.parse(result) : result);
                    } catch(e) {
                        reject(new Error('응답 파싱 오류: ' + result));
                    }
                })
                .withFailureHandler(err => {
                    reject(new Error(err.message || '서버 오류'));
                })
                .handleRequest(payload);
        });
    }

    function Header({ title, user, onLogout }) {
        const displayTitle = (user?.role === 'subject') ? '과천여자고등학교' : title;
        return (
            <div className="bg-white/40 backdrop-blur-2xl sticky top-0 z-30 px-6 py-5 border-b border-white/20 flex items-center shadow-lg relative h-[70px]">
                <h1 className="flex-1 text-center text-[19px] font-black premium-text-gradient tracking-tight">{displayTitle}</h1>
                {user && (
                    <button onClick={onLogout} className="absolute right-6 text-gray-500 hover:text-red-500 font-bold text-[11px] bg-white/60 backdrop-blur-md border border-white/50 px-4 py-2 rounded-2xl transition-all shadow-sm active-scale ring-1 ring-black/5">
                        로그아웃
                    </button>
                )}
            </div>
        );
    }
    // ── 역할 선택 화면 ────────────────────────────────────────────
    function RoleSelectScreen({ onSelectRole }) {
        return (
            <div className="w-full h-[100dvh] flex flex-col items-center justify-center p-8 relative overflow-hidden">
                <div className="absolute inset-0 flex items-center justify-center opacity-[0.04] pointer-events-none">
                    <img src="./logo.png" onError={e=>e.target.style.display='none'} alt="" className="w-full max-w-[500px] object-contain mix-blend-multiply scale-[1.5]" />
                </div>
                <div className="w-full max-w-[380px] relative z-10 animate-premium">
                    <div className="text-center mb-10">
                        <div className="w-24 h-24 glass-card mx-auto mb-6 flex items-center justify-center shadow-2xl rounded-[2.2rem] border-white/60 chip-glow">
                            <FingerprintIcon />
                        </div>
                        <h1 className="text-[2rem] font-black premium-text-gradient tracking-tighter mb-2 leading-none">과천여고 창체 다이어리</h1>
                        <p className="text-gray-400 text-[14px] font-bold tracking-tight">계속하려면 본인의 역할을 선택해 주세요</p>
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                        {Object.values(ROLES).map(role => (
                            <button key={role.id} onClick={() => onSelectRole(role.id)}
                                className="group glass-card rounded-[2.5rem] p-6 shadow-xl border-white/50 text-center transition-all duration-500 active-scale relative bg-white/40">
                                <div className={`absolute -bottom-8 -right-8 w-24 h-24 bg-gradient-to-br ${role.color} rounded-full opacity-[0.08] group-hover:scale-150 transition-transform duration-700`}></div>
                                <div className={`w-16 h-16 rounded-[1.4rem] bg-gradient-to-br ${role.color} text-white text-3xl flex items-center justify-center shadow-xl ${role.shadow} mx-auto mb-4 group-hover:scale-110 group-hover:rotate-3 transition-all`}>
                                    {role.emoji}
                                </div>
                                <p className="font-black text-gray-800 text-[16px] mb-1.5 tracking-tight">{role.label}</p>
                                <p className="text-[10px] text-gray-400 font-bold leading-tight break-keep opacity-80">{role.desc}</p>
                            </button>
                        ))}
                    </div>
                </div>
            </div>
        );
    }
    // ── 로그인/회원가입 화면 ──────────────────────────────────────
    function LoginScreen({ role, onLogin, onBack }) {
        const roleInfo    = ROLES[role];
        const isStudent   = role === 'student';
        const isHomeroom  = role === 'homeroom';
        const isSubject   = role === 'subject';
        const [showRegister,   setShowRegister]   = useState(false);
        const [isLoginMode,    setIsLoginMode]    = useState(true);
        const [userId,         setUserId]          = useState('');
        const [name,           setName]            = useState('');
        const [password,       setPassword]        = useState('');
        const [matchedClass,   setMatchedClass]    = useState(null);
        const [subjectMatched, setSubjectMatched]  = useState(null);
        const [studentMatch,   setStudentMatch]    = useState(null);
        const [checkingName,   setCheckingName]    = useState(false);
        const [loading,        setLoading]         = useState(false);

        if (isSubject && showRegister) {
            return <SubjectTeacherRegister onRegister={onLogin} onBack={() => setShowRegister(false)} />;
        }

        const handleNameBlur = async () => {
            if (isLoginMode) return;
            if (isHomeroom && name.trim()) {
                setCheckingName(true);
                setMatchedClass(null);
                try {
                    const res = await callAPI({ action: 'lookupTeacher', name: name.trim() });
                    if (res.success && res.homeroomClass) {
                        setMatchedClass({ homeroomClass: res.homeroomClass, grade: res.grade, classNum: res.classNum });
                    } else {
                        setMatchedClass(false);
                    }
                } catch(e) { setMatchedClass(false); }
                finally { setCheckingName(false); }
            }
            if (isSubject && name.trim()) {
                setCheckingName(true);
                setSubjectMatched(null);
                try {
                    const res = await callAPI({ action: 'lookupSubjectTeacher', name: name.trim() });
                    if (res.success && res.assignments) {
                        setSubjectMatched(res.assignments);
                    } else {
                        setSubjectMatched(false);
                    }
                } catch(e) { setSubjectMatched(false); }
                finally { setCheckingName(false); }
            }
            if (isStudent && userId.trim().length === 4 && name.trim()) {
                setCheckingName(true);
                setStudentMatch(null);
                try {
                    const res = await callAPI({ action: 'lookupStudent', studentId: userId.trim(), name: name.trim() });
                    setStudentMatch(res.success ? true : false);
                } catch(e) { setStudentMatch(false); }
                finally { setCheckingName(false); }
            }
        };

        const handleUserIdBlur = async () => {
            if (!isStudent || isLoginMode || !userId.trim() || !name.trim()) return;
            if (userId.trim().length !== 4) return;
            setCheckingName(true);
            setStudentMatch(null);
            try {
                const res = await callAPI({ action: 'lookupStudent', studentId: userId.trim(), name: name.trim() });
                setStudentMatch(res.success ? true : false);
            } catch(e) { setStudentMatch(false); }
            finally { setCheckingName(false); }
        };

        const handleSubmit = async (e) => {
            e.preventDefault();
            if (isLoginMode) {
                if (!userId.trim() || !password.trim()) return alert('아이디와 비밀번호를 입력해주세요!');
            } else {
                if (!userId.trim() || !name.trim() || !password.trim()) return alert('모든 항목을 채워주세요!');
                if (isHomeroom && !matchedClass) return alert('이름을 입력하고 학급 매칭을 확인해주세요!');
                if (isStudent && !studentMatch) return alert('학번과 이름이 학생 명단과 일치하지 않습니다!');
            }
            if (isStudent && userId.trim().length !== 4) return alert('학번은 4자리 숫자입니다! (예: 1101)');
            setLoading(true);
            try {
                const isTeacher = (role === 'homeroom' || role === 'subject' || role === 'career');
                const action = isLoginMode ? 'login' : (isTeacher ? 'registerTeacher' : 'register');
                const payload = isLoginMode
                    ? { action, studentId: userId.trim(), password, role }
                    : isTeacher
                        ? { action,
                            teacherId: userId.trim(), name: name.trim(), password, role,
                            grade:    (isHomeroom && matchedClass) ? matchedClass.grade : '',
                            classNum: (isHomeroom && matchedClass) ? matchedClass.classNum : '',
                            assignments: '' }
                        : { action,
                            studentId: userId.trim(), name: name.trim(), password, role,
                            homeroomClass: '' };
                const res = await callAPI(payload);
                if (res.success) {
                    if (isLoginMode) {
                        onLogin({ studentId: userId.trim(), name: res.name, role, homeroomClass: res.homeroomClass || '', assignments: res.assignments || '' });
                    } else {
                        const hc = (isHomeroom && matchedClass) ? matchedClass.homeroomClass : '';
                        alert(`환영합니다! ${name.trim()} 계정이 생성되었습니다.`);
                        onLogin({ studentId: userId.trim(), name: name.trim(), role, homeroomClass: hc, assignments: '' });
                    }
                } else {
                    alert(res.message || res.error || '알 수 없는 오류가 발생했습니다.');
                }
            } catch(err) {
                alert('서버와 연결할 수 없습니다. 잠시 후 다시 시도해주세요.');
            } finally {
                setLoading(false);
            }
        };

        const inputClass = "w-full bg-white/50 backdrop-blur-md border border-white/80 rounded-[1.4rem] px-6 py-4 text-gray-800 font-black focus:outline-none focus:border-indigo-400 focus:ring-8 focus:ring-indigo-500/5 transition-all text-center tracking-widest shadow-inner placeholder:text-gray-300";

        return (
            <div className="w-full h-[100dvh] flex flex-col items-center justify-center p-8 relative overflow-hidden">
                <div className="absolute inset-0 flex items-center justify-center opacity-[0.04] pointer-events-none">
                    <img src="./logo.png" onError={e=>e.target.style.display='none'} alt="" className="w-full max-w-[500px] object-contain mix-blend-multiply scale-[1.5]" />
                </div>
                <div className="w-full max-w-[340px] glass-card p-6 rounded-[2.5rem] shadow-2xl border-white/60 relative z-10 animate-premium text-center mx-auto bg-white/50">
                    <button onClick={onBack} className="absolute top-5 left-5 text-gray-400 hover:text-indigo-600 bg-white/60 hover:bg-indigo-50 rounded-full p-2 transition-all active-scale shadow-sm ring-1 ring-black/5">
                        <BackIcon />
                    </button>
                    <div className="flex flex-col items-center justify-center">
                        <div className={`w-12 h-12 bg-gradient-to-br ${roleInfo.color} rounded-[1.2rem] mb-2 flex items-center justify-center shadow-2xl ${roleInfo.shadow} text-2xl transform -rotate-3`}>
                            {roleInfo.emoji}
                        </div>
                        <div className={`inline-block text-[8px] font-black px-3 py-1 rounded-full mb-1.5 bg-gradient-to-r ${roleInfo.color} text-white shadow-lg tracking-widest uppercase`}>{roleInfo.label}</div>
                        <h2 className="text-[1.4rem] font-black premium-text-gradient tracking-tighter mb-0.5 leading-none">{isLoginMode ? '로그인' : '계정 등록'}</h2>
                        <p className="text-gray-400 text-[10px] font-bold mb-4 leading-tight">{isLoginMode ? '시스템에 접속하세요.' : '새로운 계정을 시작하세요.'}</p>
                    </div>
                    <form onSubmit={handleSubmit} className="space-y-2 text-left">
                        <div className="space-y-0.5">
                            <label className="block text-[9px] font-black text-indigo-900/40 ml-2 uppercase tracking-[0.2em]">ID</label>
                            <input type={isStudent ? 'number' : 'text'} value={userId}
                                onChange={e => { setUserId(e.target.value); setStudentMatch(null); }}
                                onBlur={handleUserIdBlur}
                                placeholder={isStudent ? '학번 (1101)' : 'ID'}
                                className="w-full bg-white/50 backdrop-blur-md border border-white/80 rounded-[1.2rem] px-5 py-3.5 text-gray-800 font-black focus:outline-none focus:border-indigo-400 text-center tracking-widest shadow-inner placeholder:text-gray-300" />
                        </div>
                        {!isLoginMode && (
                            <>
                                <div className="space-y-0.5">
                                    <label className="block text-[9px] font-black text-indigo-900/40 ml-2 uppercase tracking-[0.2em]">Name</label>
                                    <input type="text" value={name}
                                        onChange={e => { setName(e.target.value); setMatchedClass(null); setStudentMatch(null); }}
                                        onBlur={handleNameBlur}
                                        placeholder="이름 입력"
                                        className="w-full bg-white/50 backdrop-blur-md border border-white/80 rounded-[1.2rem] px-5 py-3.5 text-gray-800 font-black focus:outline-none focus:border-indigo-400 text-center tracking-widest shadow-inner placeholder:text-gray-300" />
                                </div>
                                {isStudent && (
                                    <div className="animate-premium mt-1">
                                        {checkingName && (
                                            <div className="flex items-center justify-center gap-2 bg-white/40 rounded-xl p-1.5 border border-white/50">
                                                <LoadingSpinner /><span className="text-[8px] text-gray-400 font-black uppercase">Verify</span>
                                            </div>
                                        )}
                                        {!checkingName && studentMatch === false && name.trim() && userId.trim() && (
                                            <div className="bg-red-500/10 border border-red-500/20 rounded-xl p-1.5 text-center animate-premium">
                                                <p className="text-red-600 font-black text-[9px]">❌ 불일치</p>
                                            </div>
                                        )}
                                        {!checkingName && studentMatch === true && (
                                            <div className="bg-blue-500/10 border border-blue-500/20 rounded-xl p-1.5 text-center animate-premium">
                                                <p className="text-blue-700 font-black text-[9px]">✅ 확인됨</p>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </>
                        )}
                        <div className="space-y-0.5">
                            <label className="block text-[9px] font-black text-indigo-900/40 ml-2 uppercase tracking-[0.2em]">Password</label>
                            <input type="password" value={password} onChange={e => setPassword(e.target.value)}
                                placeholder="●●●●"
                                className="w-full bg-white/50 backdrop-blur-md border border-white/80 rounded-[1.2rem] px-5 py-3.5 text-gray-800 font-black focus:outline-none focus:border-indigo-400 text-center tracking-[0.4em] shadow-inner placeholder:text-gray-300" />
                        </div>
                        <div className="pt-1">
                            <button type="submit"
                                disabled={loading || (!isLoginMode && isHomeroom && !matchedClass) || (!isLoginMode && isSubject && !subjectMatched) || (!isLoginMode && isStudent && !studentMatch)}
                                className={`w-full bg-gradient-to-br ${roleInfo.color} text-white font-black py-4 rounded-[1.2rem] transition-all shadow-xl ${roleInfo.shadow} active-scale text-[15px] flex justify-center items-center h-[52px] disabled:opacity-30 disabled:grayscale tracking-tighter`}>

                    </form>
                    <div className="mt-4 text-center border-t border-white/20 pt-3">
                        <button type="button"
                            onClick={() => {
                                if (isSubject && isLoginMode) { setShowRegister(true); return; }
                                setIsLoginMode(!isLoginMode); setPassword(''); setName(''); setMatchedClass(null); setStudentMatch(null); setSubjectMatched(null);
                            }}
                            className="text-[10px] font-black text-gray-400 hover:text-indigo-600 transition-colors tracking-tight">
                            {isLoginMode ? '📍 계정 등록하기' : '📍 로그인하기'}

    // ── 교과목교사 전용 회원가입 컴포넌트 ────────────────────────
    function SubjectTeacherRegister({ onRegister, onBack }) {
        const [subjectList, setSubjectList] = useState({});
        const [loadingList, setLoadingList] = useState(true);
        const [userId,    setUserId]    = useState('');
        const [name,      setName]      = useState('');
        const [password,  setPassword]  = useState('');
        const [loading,   setLoading]   = useState(false);
        const [codeInput,   setCodeInput]   = useState('');
        const [codeVerified, setCodeVerified] = useState(false);
        const [codeChecking, setCodeChecking] = useState(false);
        const [codeError,   setCodeError]   = useState('');

        const handleCheckCode = async () => {
            if (!codeInput.trim()) return setCodeError('인증코드를 입력해주세요.');
            setCodeChecking(true); setCodeError('');
            try {
                const res = await callAPI({ action: 'checkTeacherCode', code: codeInput.trim() });
                if (res.success) { setCodeVerified(true); }
                else { setCodeError(res.message || '인증코드가 틀렸습니다.'); }
            } catch(e) { setCodeError('서버 오류가 발생했습니다.'); }
            finally { setCodeChecking(false); }
        };
        const [assignments, setAssignments] = useState([
            { grade: '1', subject: '', classes: new Set() }
        ]);

        useEffect(() => {
            const fetch = async () => {
                try {
                    const res = await callAPI({ action: 'getSubjectList' });
                    if (res.success) setSubjectList(res.subjects || {});
                } catch(e) {}
                finally { setLoadingList(false); }
            };
            fetch();
        }, []);

        const addAssignment = () => {
            setAssignments(prev => [...prev, { grade: '1', subject: '', classes: new Set() }]);
        };

        const removeAssignment = (idx) => {
            setAssignments(prev => prev.filter((_, i) => i !== idx));
        };

        const updateGrade = (idx, grade) => {
            setAssignments(prev => prev.map((a, i) => i === idx ? { ...a, grade, subject: '', classes: new Set() } : a));
        };

        const updateSubject = (idx, subject) => {
            setAssignments(prev => prev.map((a, i) => i === idx ? { ...a, subject } : a));
        };

        const toggleClass = (idx, cls) => {
            setAssignments(prev => prev.map((a, i) => {
                if (i !== idx) return a;
                const newClasses = new Set(a.classes);
                newClasses.has(cls) ? newClasses.delete(cls) : newClasses.add(cls);
                return { ...a, classes: newClasses };
            }));
        };

        const handleSubmit = async (e) => {
            e.preventDefault();
            if (!userId.trim() || !name.trim() || !password.trim()) return alert('모든 항목을 입력해주세요!');
            const valid = assignments.every(a => a.subject && a.classes.size > 0);
            if (!valid) return alert('모든 과목의 담당 학급을 1개 이상 선택해주세요!');
            setLoading(true);
            try {
                const assignData = assignments.map(a => ({
                    subject: a.subject,
                    classes: [...a.classes].sort()
                }));
                const res = await callAPI({
                    action: 'registerTeacher',
                    teacherId: userId.trim(),
                    name: name.trim(),
                    password,
                    role: 'subject',
                    grade: '',
                    classNum: '',
                    assignments: JSON.stringify(assignData)
                });
                if (res.success) {
                    alert(`환영합니다! ${name.trim()} 선생님 계정이 생성되었습니다.`);
                    onRegister({ studentId: userId.trim(), name: name.trim(), role: 'subject', homeroomClass: '', assignments: JSON.stringify(assignData) });
                } else {
                    alert(res.message || '오류가 발생했습니다.');
                }
            } catch(e) {
                alert('서버와 연결할 수 없습니다.');
            } finally {
                setLoading(false);
            }
        };

        const inputClass = "w-full bg-gray-50/70 border border-gray-200/80 rounded-[1.2rem] px-5 py-3.5 text-gray-800 font-extrabold focus:outline-none focus:border-violet-400 focus:ring-4 focus:ring-violet-500/10 transition-all shadow-inner";

        return (
            <div className="w-full min-h-[100dvh] flex flex-col items-center justify-start py-8 px-5 bg-[#eff2f6]">
                <div className="w-full max-w-[380px]">
                    <button onClick={onBack} className="flex items-center text-gray-500 hover:text-gray-800 mb-5 font-bold text-sm transition-colors">
                        <BackIcon /><span className="ml-1">역할 선택으로</span>
                    </button>
                    <div className="bg-white rounded-[2.5rem] p-7 shadow-sm border border-gray-100 mb-4">
                        <div className="flex items-center mb-6">
                            <div className="w-12 h-12 rounded-[1.2rem] bg-gradient-to-br from-violet-500 to-purple-600 text-white text-xl flex items-center justify-center shadow-lg mr-4">📚</div>
                            <div>
                                <p className="text-xs font-extrabold text-violet-600 mb-0.5">교과목교사</p>
                                <h2 className="text-xl font-black text-gray-800">신규 계정 등록</h2>
                            </div>
                        </div>
                        {!codeVerified ? (
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-[11px] font-extrabold text-gray-600 mb-1.5 ml-1 uppercase tracking-wider">교사 인증코드</label>
                                    <input type="password" value={codeInput} onChange={e=>setCodeInput(e.target.value)}
                                        onKeyDown={e => e.key === 'Enter' && handleCheckCode()}
                                        placeholder="관리자에게 문의하세요"
                                        className={inputClass} />
                                    {codeError && <p className="text-red-500 text-[12px] mt-1.5 ml-1 font-bold">❌ {codeError}</p>}
                                </div>
                                <button type="button" onClick={handleCheckCode} disabled={codeChecking}
                                    className="w-full bg-gradient-to-br from-violet-500 to-purple-600 text-white font-black py-4 rounded-[1.2rem] transition-all shadow-xl active:scale-95 text-[15px] flex justify-center items-center h-[54px] disabled:opacity-40">
                                    {codeChecking ? <LoadingSpinner /> : '인증 확인'}
                                </button>
                            </div>
                        ) : (
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="bg-green-50 border border-green-200 rounded-2xl p-3 text-center mb-2">
                                <p className="text-green-700 font-extrabold text-[13px]">✅ 교사 인증 완료</p>
                            </div>
                            <div>
                                <label className="block text-[11px] font-extrabold text-gray-600 mb-1.5 ml-1 uppercase tracking-wider">교사 아이디</label>
                                <input type="text" value={userId} onChange={e=>setUserId(e.target.value)} placeholder="아이디 입력" className={inputClass} />
                            </div>
                            <div>
                                <label className="block text-[11px] font-extrabold text-gray-600 mb-1.5 ml-1 uppercase tracking-wider">실명</label>
                                <input type="text" value={name} onChange={e=>setName(e.target.value)} placeholder="이름 입력" className={inputClass} />
                            </div>
                            <div>
                                <label className="block text-[11px] font-extrabold text-gray-600 mb-1.5 ml-1 uppercase tracking-wider">비밀번호</label>
                                <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="****" className={inputClass} />
                            </div>

                            <div className="pt-2">
                                <div className="flex items-center justify-between mb-3">
                                    <label className="text-[13px] font-extrabold text-gray-700">담당 과목 설정</label>
                                    <button type="button" onClick={addAssignment}
                                        className="text-[12px] font-bold text-violet-600 bg-violet-50 hover:bg-violet-100 px-3 py-1.5 rounded-full transition-colors active:scale-95">
                                        ➕ 과목 추가
                                    </button>
                                </div>
                                {loadingList ? (
                                    <div className="text-center py-4 text-gray-400 text-sm">과목 목록 불러오는 중...</div>
                                ) : (
                                    <div className="space-y-4">
                                        {assignments.map((a, idx) => (
                                            <div key={idx} className="bg-gray-50 rounded-[1.5rem] p-4 border border-gray-200 relative">
                                                {assignments.length > 1 && (
                                                    <button type="button" onClick={() => removeAssignment(idx)}
                                                        className="absolute top-3 right-3 text-gray-300 hover:text-red-400 transition-colors text-lg font-bold">✕</button>
                                                )}
                                                <div className="mb-3">
                                                    <label className="block text-[11px] font-bold text-gray-500 mb-1.5">학년</label>
                                                    <div className="flex gap-2">
                                                        {['1','2','3'].map(g => (
                                                            <button type="button" key={g} onClick={() => updateGrade(idx, g)}
                                                                className={`flex-1 py-2 rounded-xl text-[13px] font-extrabold transition-all ${a.grade === g ? 'bg-violet-600 text-white shadow-md' : 'bg-white text-gray-500 border border-gray-200'}`}>
                                                                {g}학년
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                                <div className="mb-3">
                                                    <label className="block text-[11px] font-bold text-gray-500 mb-1.5">과목</label>
                                                    <select value={a.subject} onChange={e => updateSubject(idx, e.target.value)}
                                                        className="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-gray-800 font-bold text-[13px] focus:outline-none focus:border-violet-400">
                                                        <option value="">과목 선택</option>
                                                        {(subjectList[a.grade] || []).map(s => (
                                                            <option key={s} value={s}>{s}</option>
                                                        ))}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-[11px] font-bold text-gray-500 mb-1.5">담당 학급</label>
                                                    <div className="flex flex-wrap gap-2">
                                                        {Array.from({ length: CLASS_COUNT[a.grade] || 5 }, (_, i) => {
                                                            const cls = a.grade + String(i+1);
                                                            const selected = a.classes.has(cls);
                                                            return (
                                                                <button type="button" key={cls} onClick={() => toggleClass(idx, cls)}
                                                                    className={`px-3 py-1.5 rounded-full text-[12px] font-extrabold transition-all ${selected ? 'bg-violet-600 text-white shadow-sm' : 'bg-white text-gray-500 border border-gray-200'}`}>
                                                                    {i+1}반
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <button type="submit" disabled={loading}
                                className="w-full bg-gradient-to-br from-violet-500 to-purple-600 text-white font-black py-4 rounded-[1.2rem] transition-all shadow-xl active:scale-95 text-[15px] flex justify-center items-center h-[54px] disabled:opacity-40 mt-2">
                                {loading ? <LoadingSpinner /> : '등록하고 시작하기'}
                            </button>
                        </form>
                        )}
                    </div>
                </div>
            </div>
        );
    }

    // ── 학생 대시보드 ─────────────────────────────────────────────
    function Dashboard({ onSelectCategory, records, loadingRecords }) {

            <div className="space-y-8 animate-premium relative pt-12 z-10">

                </div>
            </div>
        );
    }

                        </div>

    // ── 학생 리스트 화면 (Roster Info Cards) ─────────────

    // ── 학생 AI 요약 화면 ─────────────────────────────────────────
    function StudentAI({ student, onBack, onSave }) {
        const [records,    setRecords]    = useState([]);
        const [loading,    setLoading]    = useState(true);
        const [selectedIds, setSelectedIds] = useState(new Set());
        const [aiResult,   setAiResult]   = useState('');
        const [isGenerating, setIsGenerating] = useState(false);
        const [isSaving,   setIsSaving]   = useState(false);
        const [saved,      setSaved]      = useState(false);

        useEffect(() => {
            const fetch = async () => {
                try {
                    const res = await callAPI({ action: 'getRecords', studentId: student.id });
                    if (res.success) setRecords(res.records || []);
                } catch(e) {}
                finally { setLoading(false); }
            };
            fetch();
        }, [student.id]);

        const toggleSelect = (id) => {
            const next = new Set(selectedIds);
            next.has(id) ? next.delete(id) : next.add(id);
            setSelectedIds(next);
        };

        const generateAI = async () => {
            if (selectedIds.size === 0) return alert('활동을 1개 이상 선택해주세요!');
            setIsGenerating(true); setAiResult('');
            const selected = records.filter(r => selectedIds.has(r.id));
            const text = selected.map(r => {
                const head = r.categoryId === 'subject' ? `[교과-${r.subject}]` : (r.categoryId === 'career' ? '[진로]' : '[창체]');
                const title = r.categoryId === 'subject' ? r.unit : r.title;
                const content = r.categoryId === 'subject' ? `탐구:${r.inquiry}, 배움:${r.learned}, 느낀점:${r.reflection}` : r.content;
                return `${head} ${r.date} ${title}: ${content}`;
            }).join('\n');

            try {
                // 🔐 보안: index.html에서 직접 Gemini API를 호출하지 않고, Code.gs 서버를 거칩니다.
                const res = await callAPI({ action: 'generateAI', text });
                if (res.success) {
                    const cleaned = adjustToByteRange(res.content);
                    setAiResult(cleaned);
                } else {
                    alert(res.message || 'AI 생성 실패');
                }
            } catch(e) {
                alert('서버 연결 중 오류 발생');
            } finally {
                setIsGenerating(false);
            }
        };

        const handleSave = async () => {
            if (!aiResult.trim()) return;
            setIsSaving(true);
            try {
                const res = await callAPI({ action: 'saveReport', studentId: student.id, name: student.name, content: aiResult, savedAt: new Date().toLocaleString() });
                if (res.success) {
                    setSaved(true); onSave(student.id, aiResult); alert('성공적으로 저장되었습니다!');
                } else {
                    alert('저장 실패: ' + res.message);
                }
            } catch(e) { alert('서버 오류'); }
            finally { setIsSaving(false); }
        };

        return (
            <div className="animate-fade-in flex flex-col min-h-full -mx-5 -mt-5 pb-20">
                <div className="bg-white px-6 pt-10 pb-6 sticky top-0 z-30 border-b border-gray-100 shrink-0">
                    <button onClick={onBack} className="flex items-center text-gray-400 hover:text-gray-700 mb-5 font-bold text-sm transition-colors">
                        <BackIcon /><span className="ml-1">학생 목록</span>
                    </button>
                    <div className="flex items-center justify-between">
                        <div>
                            <p className="text-[11px] font-extrabold text-emerald-600 mb-0.5">{student.id}</p>
                            <h2 className="text-2xl font-black text-gray-800 tracking-tighter">{student.name} 학생 기록</h2>
                        </div>
                        <button onClick={generateAI} disabled={isGenerating || selectedIds.size === 0}
                            className="bg-indigo-600 text-white px-5 py-2.5 rounded-2xl font-bold text-sm shadow-lg shadow-indigo-200 active:scale-95 transition-all disabled:opacity-40 disabled:shadow-none flex items-center gap-2">
                            {isGenerating ? <LoadingSpinner /> : <><SparklesIcon active /> <span className="mt-0.5">AI 생성</span></>}
                        </button>
                    </div>
                </div>
                <div className="p-5 flex-1 space-y-4">
                    {loading ? (
                        <div className="py-20 text-center font-bold text-gray-400"><LoadingSpinner /></div>
                    ) : records.length === 0 ? (
                        <div className="py-20 text-center text-gray-400 text-sm font-bold">기록된 활동이 없습니다.</div>
                    ) : (
                        records.sort((a,b)=>new Date(b.date)-new Date(a.date)).map(r => (
                            <div key={r.id} onClick={() => toggleSelect(r.id)}
                                className={`p-5 rounded-[1.8rem] border transition-all cursor-pointer relative overflow-hidden ${selectedIds.has(r.id) ? 'bg-indigo-50 border-indigo-200 shadow-md ring-2 ring-indigo-500/20' : 'bg-white border-gray-100 shadow-sm opacity-70'}`}>
                                <div className="flex items-center justify-between mb-2 relative z-10">
                                    <span className={`text-[10px] font-black px-2 py-0.5 rounded-lg ${CATEGORIES[r.categoryId]?.bg} ${CATEGORIES[r.categoryId]?.text}`}>{CATEGORIES[r.categoryId]?.title}</span>
                                    <span className="text-[10px] font-bold text-gray-400">{r.date}</span>
                                </div>
                                <h4 className="font-bold text-gray-800 text-[15px] mb-1 relative z-10">{r.categoryId==='subject' ? r.unit : r.title}</h4>
                                <p className="text-[12px] text-gray-500 leading-relaxed line-clamp-2 relative z-10">{r.categoryId==='subject' ? r.learned : r.content}</p>
                                {selectedIds.has(r.id) && <div className="absolute top-4 right-4 bg-indigo-600 rounded-full p-1 shadow-sm"><svg className="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="4" d="M5 13l4 4L19 7"/></svg></div>}
                            </div>
                        ))
                    )}
                </div>
                {aiResult && (
                    <div className="fixed bottom-0 left-0 w-full p-5 bg-white/90 backdrop-blur-xl border-t border-gray-100 z-40 animate-fade-in shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
                        <div className="max-w-[400px] mx-auto">
                            <div className="flex items-center justify-between mb-3 px-1">
                                <h3 className="font-black text-gray-800 flex items-center gap-1.5"><SparklesIcon active /> <span className="mt-0.5">AI 생성 생기부 (추천)</span></h3>
                                <div className="text-[10px] font-bold px-2.5 py-1 rounded-full bg-gray-100 text-gray-500">
                                    {new TextEncoder().encode(aiResult).length} Bytes
                                </div>
                            </div>
                            <div className="bg-indigo-50/50 p-5 rounded-[1.5rem] border border-indigo-100 text-gray-700 text-[13.5px] leading-[1.7] mb-4 max-h-[300px] overflow-y-auto no-scrollbar font-medium break-keep">
                                {aiResult}
                            </div>
                            <div className="flex gap-3">
                                <button onClick={() => setAiResult('')} className="flex-1 bg-gray-100 text-gray-500 font-bold py-3.5 rounded-2xl active:scale-95 transition-all text-sm">닫기</button>
                                <button onClick={handleSave} disabled={isSaving}
                                    className="flex-[2] bg-indigo-600 text-white font-black py-3.5 rounded-2xl shadow-lg shadow-indigo-100 active:scale-95 transition-all text-sm flex items-center justify-center gap-2">
                                    {isSaving ? <LoadingSpinner /> : (saved ? '✅ 저장 완료' : '반영 및 저장하기')}
                                </button>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    }
    // ── 생기부 요약 결과 그리드 ──────────────────────────────────
    function ReportsGrid({ homeroomClass, onBack }) {
        const [reports, setReports] = useState([]);

        const copyAll = () => {

            alert('전체 내용이 클립보드에 복사되었습니다.');

        return (
            <div className="animate-fade-in flex flex-col min-h-full -mx-5 -mt-5 pb-10">

                        <BackIcon /><span className="ml-1">뒤로가기</span>
                    </button>
                    <div className="flex items-center justify-between">
                        <h2 className="text-2xl font-black text-gray-800 tracking-tighter">생기부 요약 결과</h2>
                        <button onClick={copyAll} className="text-[12px] font-bold text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-xl border border-indigo-100 active:scale-95 transition-all">전체 복사</button>
                    </div>
                </div>
                <div className="p-5 space-y-4">
                    {loading ? (
                        <div className="py-20 flex flex-col items-center justify-center font-bold text-gray-400"><LoadingSpinner /><p className="mt-4 text-sm animate-pulse">결과 불러오는 중...</p></div>
                    ) : reports.length === 0 ? (
                        <div className="py-20 text-center text-gray-400 font-bold text-sm">저장된 생기부 요약이 아직 없습니다.</div>
                    ) : (
                        reports.map(r => <ReportItem key={r.studentId} report={r} />)
                    )}
                </div>
            </div>
        );
    }

    function ReportItem({ report }) {
        const copyItem = () => {
            navigator.clipboard.writeText(report.content);
            alert(`${report.name} 학생의 내용이 복사되었습니다.`);
        };
        return (
            <div className="bg-white p-5 rounded-[1.8rem] shadow-sm border border-gray-100">
                <div className="flex items-center justify-between mb-3">
                    <div className="flex items-center gap-2">
                        <span className="text-[11px] font-black text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-lg">{report.studentId}</span>
                        <h4 className="font-bold text-gray-800">{report.name}</h4>
                    </div>
                    <button onClick={copyItem} className="text-[11px] font-bold text-gray-400 hover:text-indigo-600 transition-colors">복사</button>
                </div>
                <div className="bg-gray-50/50 p-4 rounded-2xl text-[13px] text-gray-600 leading-relaxed break-keep font-medium border border-gray-50">
                    {report.content}
                </div>
            </div>
        );
    }

    // ── 메인 앱 컴포넌트 ──────────────────────────────────────────
    function ReactApp() {
        const [user,      setUser]      = useState(null);
        const [view,      setView]      = useState('role'); // role, login, dashboard, category, subjectList, studentGrid, studentAI, reports
        const [role,      setRole]      = useState(null);
        const [category,  setCategory]  = useState(null);
        const [records,   setRecords]   = useState([]);
        const [loading,   setLoading]   = useState(false);
        const [error,     setError]     = useState(null);
        const [subjects,  setSubjects]  = useState([]);
        const [selSubject, setSelSubject] = useState(null);
        const [selAssignment, setSelAssignment] = useState(null);
        const [selClass,    setSelClass]    = useState(null);
        const [selStudent, setSelStudent] = useState(null);
        const [writeMode, setWriteMode] = useState(false);
        const [editRecord, setEditRecord] = useState(null);

        useEffect(() => {
            const saved = localStorage.getItem('school_diary_user');
            if (saved) {
                const u = JSON.parse(saved);
                setUser(u);
                if (u.role === 'student' || (!u.role && u.studentId)) {
                    fetchRecords(u.studentId);
                } else {
                    fetchTeacherRecords(u);
                }
                setView('dashboard');
            }
        }, []);

        useEffect(() => {
            if (user) {
                if (user.role === 'student') {
                    fetchRecords(user.studentId);
                } else {
                    fetchTeacherRecords(user);
                }
            }
        }, [user]);

        // ✅ Define fetcher using function declaration to ensure hoisting/availability
        async function fetchTeacherRecords(u) {
            if (!u || u.role === 'student') return;
            setLoading(true);
            try {
                // Ensure assignments parsing is extremely robust
                let subjectClasses = [];
                if (u.assignments) {
                    try {
                        if (u.assignments.startsWith('[')) {
                            subjectClasses = JSON.parse(u.assignments).flatMap(a => a.classes || []);
                        } else {
                            subjectClasses = u.assignments.split(',').map(c => c.trim());
                        }
                    } catch(e) { console.warn('Assignments parse warning', e); }
                }

                const payload = { 
                    role: u.role || (u.homeroomClass ? 'homeroom' : 'subject'),
                    grade: u.grade, 
                    classNum: u.classNum,
                    homeroomClass: u.homeroomClass,
                    subjectClasses: subjectClasses,
                    studentId: u.teacherId || u.studentId // Pass ID for recovery
                };
                const res = await callAPI({ action: 'getAllRecords', payload });
                if (res.success) {
                    setRecords(res.records || []);
                    setError(null);
                    console.log('Teacher records sync successful', res.debug);
                } else {
                    setError(res.message);
                    setRecords([]);
                }
            } catch(e) { console.error('Fetch error', e); }
            finally { setLoading(false); }
        }

        async function fetchRecords(sid) {
            setLoading(true);
            try {
                const res = await callAPI({ action: 'getRecords', studentId: sid });
                if (res.success) setRecords(res.records || []);
            } catch(e) {}
            finally { setLoading(false); }
        }

        const handleLogin = (u) => {
            setUser(u);
            localStorage.setItem('school_diary_user', JSON.stringify(u));
            if (u.role === 'student') fetchRecords(u.studentId);
            else fetchTeacherRecords(u);
            setView('dashboard');
        };

        const handleLogout = (options = {}) => {
            if (options.refresh) {
                fetchTeacherRecords(user);
                return;
            }
            localStorage.removeItem('school_diary_user');
            setUser(null);
            setView('role');
            setRecords([]);
        };

        const handleSaveRecord = async (recordData) => {
            try {
                const action = recordData.id ? 'updateRecord' : 'saveRecord';
                const res = await callAPI({ action, record: { ...recordData, studentId: user.studentId, name: user.name } });
                if (res.success) {
                    await fetchRecords(user.studentId);
                    setWriteMode(false);
                    setEditRecord(null);
                } else {
                    alert('저장 실패: ' + res.message);
                }
            } catch(e) { alert('서버 오류'); }
        };

        const handleDeleteRecord = async (id) => {
            if (!confirm('정말 삭제하시겠습니까?')) return;
            try {
                const res = await callAPI({ action: 'deleteRecord', recordId: id, studentId: user.studentId });
                if (res.success) fetchRecords(user.studentId);
                else alert('삭제 실패: ' + res.message);
            } catch(e) { alert('서버 오류'); }
        };

        return (
            <div className="w-full max-w-md mx-auto bg-white/30 backdrop-blur-[40px] min-h-[100dvh] lg:min-h-[850px] lg:max-h-[90%] lg:rounded-[3.5rem] lg:shadow-[0_80px_150px_rgba(31,38,135,0.2)] lg:border-[12px] lg:border-white/60 relative flex flex-col overflow-hidden shadow-inner font-pretendard ring-1 ring-white/20">
                {view !== 'role' && view !== 'login' && (view !== 'dashboard' || (user && user.role === 'student')) && (
                    <Header title="창체 다이어리" user={user} onLogout={handleLogout} />
                )}
                
                <div className={`flex-1 overflow-y-auto no-scrollbar pb-safe ${view !== 'role' && view !== 'login' ? 'px-6' : ''}`}>
                    {view === 'role' && <RoleSelectScreen onSelectRole={(r) => { setRole(r); setView('login'); }} />}
                    {view === 'login' && <LoginScreen role={role} onLogin={handleLogin} onBack={() => setView('role')} />}
                    
                    {view === 'dashboard' && user && (
                        user.role === 'student' ? (
                            <Dashboard records={records} loadingRecords={loading} onSelectCategory={(cid) => {
                                if (cid === 'subject') {
                                    setLoading(true); setView('subjectList');
                                    callAPI({ action: 'getSubjectsByClass', classCode: user.studentId.substring(0, 2) })
                                        .then(res => { setSubjects(res.subjects || []); setLoading(false); });
                                } else {
                                    setCategory(cid); setView('category');
                                }
                            }} />
                        ) : (
                        <TeacherDashboard user={user} 
                            records={records}
                            error={error}
                            onLogout={handleLogout}
                            onSelectStudent={() => setView('studentGrid')} 
                            onViewReports={() => setView('reports')}
                            onSelectSubject={(asg) => { setSelAssignment(asg); setView('classSelect'); }}
                        />
                        )
                    )}

                    {view === 'classSelect' && (
                        <ClassSelectScreen assignment={selAssignment} records={records}
                            onSelectClass={(cls) => { setSelClass(cls); setView('studentGrid'); }}
                            onBack={() => setView('dashboard')} 
                        />
                    )}

                    {view === 'category' && (
                        writeMode ? (
                            <WriteForm categoryId={category} onSave={handleSaveRecord} onCancel={() => setWriteMode(false)} />
                        ) : (
                            <CategoryList categoryId={category} records={records} loadingRecords={loading} onBack={() => setView('dashboard')} onWrite={() => setWriteMode(true)} onDelete={handleDeleteRecord} />
                        )
                    )}

                    {view === 'subjectList' && (
                        <SubjectSelectScreen subjects={subjects} loading={loading} onSelectSubject={(s) => { setSelSubject(s); setView('subjectRecords'); }} onBack={() => setView('dashboard')} />
                    )}

                    {view === 'subjectRecords' && (
                        writeMode ? (
                            <SubjectWriteForm subject={selSubject} editingRecord={editRecord} onSave={handleSaveRecord} onCancel={() => { setWriteMode(false); setEditRecord(null); }} />
                        ) : (
                            <SubjectRecordList subject={selSubject} records={records} loadingRecords={loading} onBack={() => setView('subjectList')} onWrite={() => setWriteMode(true)} onDelete={handleDeleteRecord} onEdit={(r) => { setEditRecord(r); setWriteMode(true); }} />
                        )
                    )}

                    {view === 'studentGrid' && (
                        <StudentGrid 
                            role={user.role} 
                            grade={user.grade}
                            classNum={user.classNum}
                            homeroomClass={user.homeroomClass} 
                            subjectClasses={selClass ? [selClass] : (user.assignments ? JSON.parse(user.assignments).flatMap(a=>a.classes) : [])} 
                            records={records}
                            onSelect={(s) => { setSelStudent({ id: s.studentId, name: s.name }); setView('studentAI'); }} 
                            onBack={() => {
                                if (user.role === 'subject') setView('classSelect');
                                else setView('dashboard');
                            }} 
                        />
                    )}

                    {view === 'studentAI' && (
                        <StudentAI student={selStudent} onBack={() => setView('studentGrid')} onSave={(sid, content) => console.log('Saved', sid)} />
                    )}

                    {view === 'reports' && (
                        <ReportsGrid homeroomClass={user.homeroomClass} onBack={() => setView('dashboard')} />
                    )}
                </div>

                {user && user.role === 'student' && (
                    <div className="h-[80px] bg-white/80 backdrop-blur-2xl border-t border-gray-100 flex justify-around items-center px-6 shrink-0 relative z-40">
                        <button onClick={() => { setView('dashboard'); setWriteMode(false); setEditRecord(null); }} className="flex flex-col items-center gap-1 group">
                            <HomeIcon active={view === 'dashboard' || view === 'category' || view === 'subjectList' || view === 'subjectRecords'} />
                            <span className={`text-[10px] font-black ${view === 'dashboard' || view === 'category' || view === 'subjectList' || view === 'subjectRecords' ? 'text-blue-600' : 'text-gray-400'}`}>홈</span>
                        </button>
                        <div className="w-px h-6 bg-gray-100"></div>
                        <button className="flex flex-col items-center gap-1 opacity-40 cursor-not-allowed">
                            <svg className="w-7 h-7 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                            <span className="text-[10px] font-black text-gray-300">포트폴리오</span>
                        </button>
                    </div>
                )}
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ReactApp />);
</script>
</body>
</html>
