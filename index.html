<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>과천여고 창체 다이어리</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #e5e7eb; margin: 0; padding: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-gray-200 lg:py-8 lg:flex lg:justify-center lg:items-center min-h-screen">
<div id="root"></div>
<script type="text/babel">
    const { useState, useEffect } = React;
    // ── 설정 ──────────────────────────────────────────────────────
    const API_URL = "https://script.google.com/macros/s/AKfycbzjd1vigUWIpG61bu9y1Z9CVps-FK55yDWqQqoNRmh49-PD96-rlfg3RLdH57Lp_F-g/exec";
    const GEMINI_API_KEY = "AIzaSyBVFre9SnYauPiYtfiz_hQGa5KSRL0zW7c";
    // ── 아이콘 ────────────────────────────────────────────────────
    const HomeIcon     = ({ active }) => <svg className={`w-7 h-7 ${active ? 'text-blue-600' : 'text-gray-400'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>;
    const SparklesIcon = ({ active }) => <svg className={`w-7 h-7 ${active ? 'text-blue-600' : 'text-gray-400'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>;
    const BackIcon     = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M15 19l-7-7 7-7"/></svg>;
    const CareerIcon   = () => <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>;
    const SubjectIcon  = () => <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>;
    const CreativeIcon = () => <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"/></svg>;
    const FingerprintIcon = () => <svg className="w-10 h-10 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"/></svg>;
    const LoadingSpinner = () => <svg className="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/></svg>;
    // ── 카테고리 ──────────────────────────────────────────────────
    const CATEGORIES = {
        career:   { id:'career',   title:'진로활동',       color:'from-orange-400 to-red-500',    shadow:'shadow-orange-500/30',  bg:'bg-orange-50',  text:'text-orange-700', icon:<CareerIcon />,   desc:'나의 꿈과 진로 탐색 및 희망 전공 관련 기록' },
        subject:  { id:'subject',  title:'교과활동',       color:'from-blue-500 to-indigo-600',   shadow:'shadow-blue-500/30',    bg:'bg-blue-50',    text:'text-blue-700',   icon:<SubjectIcon />,  desc:'수업 시간의 배움, 수행평가, 세특 심화 탐구' },
        creative: { id:'creative', title:'창의적 체험활동', color:'from-emerald-400 to-teal-500', shadow:'shadow-teal-500/30',    bg:'bg-emerald-50', text:'text-teal-700',   icon:<CreativeIcon />, desc:'동아리, 자율, 봉사 등 학교 생활의 다양한 경험' }
    };
    // ── 역할 ──────────────────────────────────────────────────────
    const ROLES = {
        student:  { id:'student',  label:'학생',      emoji:'🎒', color:'from-blue-500 to-indigo-600',    shadow:'shadow-blue-500/30',   desc:'나의 창체활동 기록' },
        homeroom: { id:'homeroom', label:'담임교사',   emoji:'🏫', color:'from-emerald-500 to-teal-600',  shadow:'shadow-emerald-500/30', desc:'반 학생 기록 조회 + AI 생기부' },
        career:   { id:'career',   label:'진로담당',   emoji:'🧭', color:'from-orange-500 to-red-500',    shadow:'shadow-orange-500/30',  desc:'진로활동 전체 조회' },
        subject:  { id:'subject',  label:'교과목교사', emoji:'📚', color:'from-violet-500 to-purple-600', shadow:'shadow-violet-500/30',  desc:'교과활동 전체 조회' },
    };
    // ── GAS API 호출 헬퍼 (fetch 방식) ──────────────────────────
    async function callAPI(payload) {
        const res = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(payload),
            headers: { 'Content-Type': 'text/plain' },
            redirect: 'follow'
        });
        const text = await res.text();
        try {
            return JSON.parse(text);
        } catch(e) {
            console.error('응답 파싱 실패:', text);
            throw new Error('서버 응답 오류');
        }
    }
    // ── Header ────────────────────────────────────────────────────
    function Header({ title, user, onLogout }) {
        return (
            <div className="bg-white/80 backdrop-blur-xl sticky top-0 z-20 px-6 py-4 border-b border-gray-100 flex items-center shadow-sm relative h-[60px]">
                <h1 className="flex-1 text-center text-lg font-extrabold text-gray-800 tracking-tight">{title}</h1>
                {user && (
                    <button onClick={onLogout} className="absolute right-6 text-gray-500 hover:text-red-500 font-bold text-xs bg-white border border-gray-200 px-3 py-1.5 rounded-xl transition-colors shadow-sm active:scale-95">
                        로그아웃
                    </button>
                )}
            </div>
        );
    }
    // ── 역할 선택 화면 ────────────────────────────────────────────
    function RoleSelectScreen({ onSelectRole }) {
        return (
            <div className="w-full h-[100dvh] flex flex-col items-center justify-center p-6 relative overflow-hidden bg-[#eff2f6]">
                <div className="absolute inset-0 flex items-center justify-center opacity-[0.06] pointer-events-none">
                    <img src="./logo.png" onError={e=>e.target.style.display='none'} alt="" className="w-full max-w-[400px] object-contain mix-blend-multiply scale-[1.3] -translate-y-10" />
                </div>
                <div className="w-full max-w-[360px] relative z-10 animate-fade-in">
                    <div className="text-center mb-8">
                        <div className="w-20 h-20 bg-gradient-to-br from-indigo-50 to-blue-50 rounded-[1.8rem] mx-auto mb-4 flex items-center justify-center shadow-inner border border-indigo-100/30">
                            <FingerprintIcon />
                        </div>
                        <h1 className="text-[1.7rem] font-black text-gray-800 tracking-tighter mb-1">과천여고 창체 다이어리</h1>
                        <p className="text-gray-500 text-[13px] font-bold">로그인할 역할을 선택하세요</p>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                        {Object.values(ROLES).map(role => (
                            <button key={role.id} onClick={() => onSelectRole(role.id)}
                                className="group bg-white rounded-[1.8rem] p-5 shadow-sm hover:shadow-xl border border-gray-100 text-center transition-all duration-300 active:scale-[0.96] relative overflow-hidden">
                                <div className={`absolute -bottom-6 -right-6 w-20 h-20 bg-gradient-to-br ${role.color} rounded-full opacity-[0.07] group-hover:opacity-[0.13] transition-opacity`}></div>
                                <div className={`w-14 h-14 rounded-[1.2rem] bg-gradient-to-br ${role.color} text-white text-2xl flex items-center justify-center shadow-lg ${role.shadow} mx-auto mb-3 group-hover:scale-105 transition-transform`}>
                                    {role.emoji}
                                </div>
                                <p className="font-extrabold text-gray-800 text-[15px] mb-1">{role.label}</p>
                                <p className="text-[11px] text-gray-400 font-medium leading-tight break-keep">{role.desc}</p>
                            </button>
                        ))}
                    </div>
                </div>
            </div>
        );
    }
    // ── 로그인/회원가입 화면 ──────────────────────────────────────
    function LoginScreen({ role, onLogin, onBack }) {
        const roleInfo    = ROLES[role];
        const isStudent   = role === 'student';
        const isHomeroom  = role === 'homeroom';
        const isSubject   = role === 'subject';
        const [isLoginMode,    setIsLoginMode]    = useState(true);
        const [userId,         setUserId]          = useState('');
        const [name,           setName]            = useState('');
        const [password,       setPassword]        = useState('');
        const [matchedClass,   setMatchedClass]    = useState(null); // 담임: null=미조회, false=없음, object=매칭됨
        const [subjectMatched, setSubjectMatched]  = useState(null); // 교과: null=미조회, false=없음, array=매칭됨
        const [studentMatch,   setStudentMatch]    = useState(null); // 학생: null=미조회, false=없음, true=매칭됨
        const [checkingName,   setCheckingName]    = useState(false);
        const [loading,        setLoading]         = useState(false);

        // 담임교사: 이름 포커스 아웃 시 교사명단 조회
        const handleNameBlur = async () => {
            if (isLoginMode) return;
            if (isHomeroom && name.trim()) {
                setCheckingName(true);
                setMatchedClass(null);
                try {
                    const res = await callAPI({ action: 'lookupTeacher', name: name.trim() });
                    if (res.success && res.homeroomClass) {
                        setMatchedClass({ homeroomClass: res.homeroomClass, grade: res.grade, classNum: res.classNum });
                    } else {
                        setMatchedClass(false);
                    }
                } catch(e) { setMatchedClass(false); }
                finally { setCheckingName(false); }
            }
            // 교과목 교사: 이름으로 담당 과목+학급 조회
            if (isSubject && name.trim()) {
                setCheckingName(true);
                setSubjectMatched(null);
                try {
                    const res = await callAPI({ action: 'lookupSubjectTeacher', name: name.trim() });
                    if (res.success && res.assignments) {
                        setSubjectMatched(res.assignments);
                    } else {
                        setSubjectMatched(false);
                    }
                } catch(e) { setSubjectMatched(false); }
                finally { setCheckingName(false); }
            }
            // 학생: 학번+이름 둘 다 입력됐을 때 매칭
            if (isStudent && userId.trim().length === 4 && name.trim()) {
                setCheckingName(true);
                setStudentMatch(null);
                try {
                    const res = await callAPI({ action: 'lookupStudent', studentId: userId.trim(), name: name.trim() });
                    setStudentMatch(res.success ? true : false);
                } catch(e) { setStudentMatch(false); }
                finally { setCheckingName(false); }
            }
        };

        // 학생: 학번 입력 후 포커스 아웃 시에도 매칭 시도
        const handleUserIdBlur = async () => {
            if (!isStudent || isLoginMode || !userId.trim() || !name.trim()) return;
            if (userId.trim().length !== 4) return;
            setCheckingName(true);
            setStudentMatch(null);
            try {
                const res = await callAPI({ action: 'lookupStudent', studentId: userId.trim(), name: name.trim() });
                setStudentMatch(res.success ? true : false);
            } catch(e) { setStudentMatch(false); }
            finally { setCheckingName(false); }
        };

        const handleSubmit = async (e) => {
            e.preventDefault();
            if (isLoginMode) {
                if (!userId.trim() || !password.trim()) return alert('아이디와 비밀번호를 입력해주세요!');
            } else {
                if (!userId.trim() || !name.trim() || !password.trim()) return alert('모든 항목을 채워주세요!');
                if (isHomeroom && !matchedClass) return alert('이름을 입력하고 학급 매칭을 확인해주세요!');
                if (isSubject && !subjectMatched) return alert('이름을 입력하고 교과담당 매칭을 확인해주세요!');
                if (isStudent && !studentMatch) return alert('학번과 이름이 학생 명단과 일치하지 않습니다!');
            }
            if (isStudent && userId.trim().length !== 4) return alert('학번은 4자리 숫자입니다! (예: 1101)');
            setLoading(true);
            try {
                const action = isLoginMode ? 'login' : 'register';
                const payload = isLoginMode
                    ? { action, studentId: userId.trim(), password, role }
                    : { action, studentId: userId.trim(), name: name.trim(), password, role,
                        homeroomClass: (isHomeroom && matchedClass) ? matchedClass.homeroomClass : '',
                        assignments: (isSubject && subjectMatched) ? JSON.stringify(subjectMatched) : '' };
                const res = await callAPI(payload);
                if (res.success) {
                    if (isLoginMode) {
                        onLogin({ studentId: userId.trim(), name: res.name, role, homeroomClass: res.homeroomClass || '', assignments: res.assignments || '' });
                    } else {
                        const hc = (isHomeroom && matchedClass) ? matchedClass.homeroomClass : '';
                        const assign = (isSubject && subjectMatched) ? JSON.stringify(subjectMatched) : '';
                        alert(`환영합니다! ${name.trim()} 계정이 생성되었습니다.`);
                        onLogin({ studentId: userId.trim(), name: name.trim(), role, homeroomClass: hc, assignments: assign });
                    }
                } else {
                    alert(res.message || res.error || '알 수 없는 오류가 발생했습니다.');
                }
            } catch(err) {
                alert('서버와 연결할 수 없습니다. 잠시 후 다시 시도해주세요.');
            } finally {
                setLoading(false);
            }
        };

        const inputClass = "w-full bg-gray-50/70 border border-gray-200/80 rounded-[1.2rem] px-5 py-3.5 text-gray-800 font-extrabold focus:outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-500/10 transition-all text-center tracking-widest shadow-inner";

        return (
            <div className="w-full h-[100dvh] flex flex-col items-center justify-center p-6 relative overflow-hidden bg-[#eff2f6]">
                <div className="absolute inset-0 flex items-center justify-center opacity-[0.06] pointer-events-none">
                    <img src="./logo.png" onError={e=>e.target.style.display='none'} alt="" className="w-full max-w-[400px] object-contain mix-blend-multiply scale-[1.3] -translate-y-10" />
                </div>
                <div className="w-full max-w-[340px] bg-white/95 backdrop-blur-3xl p-8 rounded-[2.8rem] shadow-[0_12px_50px_rgb(0,0,0,0.06)] border border-white/80 relative z-10 animate-fade-in text-center mx-auto">
                    <button onClick={onBack} className="absolute top-6 left-6 text-gray-400 hover:text-gray-700 bg-gray-50 hover:bg-gray-100 rounded-full p-2.5 transition-colors active:scale-95">
                        <BackIcon />
                    </button>
                    <div className={`w-20 h-20 bg-gradient-to-br ${roleInfo.color} rounded-[1.8rem] mx-auto mb-4 flex items-center justify-center shadow-lg ${roleInfo.shadow} text-3xl`}>
                        {roleInfo.emoji}
                    </div>
                    <div className={`inline-block text-[11px] font-extrabold px-3 py-1 rounded-full mb-2 bg-gradient-to-r ${roleInfo.color} text-white`}>{roleInfo.label}</div>
                    <h2 className="text-[1.7rem] font-black text-gray-800 tracking-tighter mb-1">{isLoginMode ? '로그인' : '계정 등록'}</h2>
                    <p className="text-gray-500 text-[13px] font-bold mb-7">{isLoginMode ? '개인 비밀번호로 안전하게 접속하세요.' : '나만의 비밀번호로 계정을 만들어보세요.'}</p>
                    <form onSubmit={handleSubmit} className="space-y-4 text-left">
                        {/* 아이디/학번 */}
                        <div>
                            <label className="block text-[11px] font-extrabold text-indigo-900/80 mb-1.5 ml-2 uppercase tracking-wider">
                                {isStudent ? '학번 (4자리 숫자)' : '교사 아이디'}
                            </label>
                            <input type={isStudent ? 'number' : 'text'} value={userId}
                                onChange={e => { setUserId(e.target.value); setStudentMatch(null); }}
                                onBlur={handleUserIdBlur}
                                placeholder={isStudent ? '예: 1101 (1학년 1반 1번)' : '아이디 입력'}
                                className={inputClass} />
                        </div>
                        {/* 회원가입 전용 필드 */}
                        {!isLoginMode && (
                            <>
                                {/* 이름 */}
                                <div>
                                    <label className="block text-[11px] font-extrabold text-indigo-900/80 mb-1.5 ml-2 uppercase tracking-wider">실명</label>
                                    <input type="text" value={name}
                                        onChange={e => { setName(e.target.value); setMatchedClass(null); setStudentMatch(null); }}
                                        onBlur={handleNameBlur}
                                        placeholder={isHomeroom ? '이름 입력 후 학급 자동 조회' : '이름 입력 후 학번과 매칭 확인'}
                                        className={inputClass} />
                                </div>
                                {/* 학생 매칭 결과 */}
                                {isStudent && (
                                    <div className="animate-fade-in">
                                        {checkingName && (
                                            <div className="flex items-center justify-center gap-2 bg-gray-50 rounded-2xl p-3 border border-gray-100">
                                                <svg className="animate-spin h-4 w-4 text-blue-500" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                                                <span className="text-xs text-gray-500 font-bold">학생 명단 확인 중...</span>
                                            </div>
                                        )}
                                        {!checkingName && studentMatch === false && name.trim() && userId.trim() && (
                                            <div className="bg-red-50 border border-red-200 rounded-2xl p-3 text-center animate-fade-in">
                                                <p className="text-red-600 font-extrabold text-[13px]">❌ 학번과 이름이 일치하지 않습니다</p>
                                                <p className="text-red-400 text-[11px] mt-0.5">담임선생님께 명단 등록을 요청하세요</p>
                                            </div>
                                        )}
                                        {!checkingName && studentMatch === true && (
                                            <div className="bg-blue-50 border border-blue-200 rounded-2xl p-3 text-center animate-fade-in">
                                                <p className="text-blue-700 font-extrabold text-[13px]">✅ 학번과 이름이 확인되었습니다</p>
                                            </div>
                                        )}
                                    </div>
                                )}
                                {/* 담임교사 학급 매칭 결과 */}
                                {isHomeroom && (
                                    <div className="animate-fade-in">
                                        {checkingName && (
                                            <div className="flex items-center justify-center gap-2 bg-gray-50 rounded-2xl p-3 border border-gray-100">
                                                <svg className="animate-spin h-4 w-4 text-emerald-500" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                                                <span className="text-xs text-gray-500 font-bold">교사 명단 확인 중...</span>
                                            </div>
                                        )}
                                        {!checkingName && matchedClass === false && name.trim() && (
                                            <div className="bg-red-50 border border-red-200 rounded-2xl p-3 text-center animate-fade-in">

        const [unit,       setUnit]       = useState(editingRecord?.unit || '');
        const [inquiry,    setInquiry]    = useState(editingRecord?.inquiry || '');
        const [learned,    setLearned]    = useState(editingRecord?.learned || '');
        const [reflection, setReflection] = useState(editingRecord?.reflection || '');
        const [loading,    setLoading]    = useState(false);
        const isEditing = !!editingRecord;

        const handleSubmit = async (e) => {
            e.preventDefault();
            if (!unit.trim()) return alert('단원/주제를 입력해주세요!');
            if (!learned.trim()) return alert('배운점을 입력해주세요!');
            setLoading(true);
            await onSave(isEditing
                ? { ...editingRecord, date, unit, inquiry, learned, reflection }
                : { categoryId: 'subject', date, subject: subject.subject, unit, inquiry, learned, reflection }
            );
            setLoading(false);
        };

        return (
            <div className="animate-fade-in bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100 relative mt-4">

                <div className="flex-1 p-5 -mt-6 relative z-10">
                    <div className="flex justify-between items-end mb-4 px-1">
                        <h3 className="font-bold text-gray-800 text-lg">기록 목록</h3>
                        {!loadingRecords && <span className={`text-[11px] font-bold ${cat.bg} ${cat.text} px-2.5 py-1 rounded-full`}>{catRecords.length}개의 활동</span>}
                    </div>
                    {loadingRecords ? (

                        </div>
                    ) : catRecords.length === 0 ? (
                        <div className="bg-white p-8 mb-20 rounded-[2rem] text-center shadow-sm mt-2 border border-gray-100">

                                <svg className={`w-8 h-8 ${cat.text}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
                            </div>
                            <p className="text-gray-600 font-bold mb-1">아직 기록이 없네요!</p>
                            <p className="text-sm text-gray-400">오른쪽 아래 버튼을 눌러 새 기록을 남겨보세요.</p>
                        </div>
                    ) : (
                        <div className="space-y-4 mb-20">
                            {catRecords.sort((a,b) => new Date(b.date)-new Date(a.date)).map(r => (
                                <div key={r.id} className="bg-white p-5 rounded-[1.5rem] shadow-sm border border-gray-100 hover:shadow-md transition-shadow relative overflow-hidden">
                                    <div className={`absolute top-0 left-0 w-1.5 h-full bg-gradient-to-b ${cat.color} opacity-80`}></div>
                                    <div className="pl-2">
                                        <div className="flex items-center justify-between mb-2">
                                            <span className="text-xs font-bold text-gray-500">{r.date}</span>
                                            <div className="flex gap-1.5">
                                                <button onClick={() => onDelete && onDelete(r.id)} className="text-[11px] font-bold text-red-400 bg-red-50 hover:bg-red-100 px-2.5 py-1 rounded-full transition-colors active:scale-95">삭제</button>
                                            </div>
                                        </div>
                                        <h3 className="font-bold text-gray-800 mb-2 text-[17px]">{r.title}</h3>
                                        <p className="text-gray-600 text-[14px] leading-relaxed break-keep">{r.content}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
                <div className="fixed bottom-[110px] right-6 z-40 lg:absolute lg:bottom-10 lg:right-6">
                    <button onClick={onWrite} disabled={loadingRecords}
                        className={`w-[3.5rem] h-[3.5rem] rounded-full shadow-2xl bg-gradient-to-br ${cat.color} text-white flex items-center justify-center hover:scale-105 active:scale-95 transition-all border-2 border-white/20 disabled:opacity-50`}>
                        <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 4v16m8-8H4"/></svg>
                    </button>
                </div>
            </div>
        );
    }
    // ── 기록 작성 폼 ──────────────────────────────────────────────
    function WriteForm({ categoryId, onSave, onCancel }) {
        const cat = CATEGORIES[categoryId];
        const [date,    setDate]    = useState(new Date().toISOString().split('T')[0]);
        const [title,   setTitle]   = useState('');
        const [content, setContent] = useState('');
        const [loading, setLoading] = useState(false);
        const handleSubmit = async (e) => {
            e.preventDefault();
            if (!title.trim() || !content.trim()) return alert('활동명과 내용을 모두 입력해주세요!');
            setLoading(true);
            await onSave({ categoryId, date, title, content });
            setLoading(false);
        };
        return (
            <div className="animate-fade-in bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100 relative mt-4">
                <button onClick={onCancel} className="absolute top-6 right-6 text-gray-400 hover:text-gray-600 bg-gray-50 hover:bg-gray-100 rounded-full p-2.5 transition-colors active:scale-95">
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
                <div className="flex items-center mb-8 pr-12">
                    <span className={`px-3 py-1.5 bg-gradient-to-r ${cat.color} text-white font-bold text-[11px] rounded-lg shadow-sm mr-3 shrink-0`}>{cat.title}</span>
                    <h2 className="text-xl font-extrabold text-gray-800 tracking-tight">새 활동 기록하기</h2>
                </div>
                <form onSubmit={handleSubmit} className="space-y-6">
                    <div>
                        <label className="block text-[13px] font-extrabold text-gray-700 mb-2.5 ml-1">언제 활동했나요?</label>
                        <input type="date" value={date} onChange={e=>setDate(e.target.value)} disabled={loading}
                            className="w-full bg-gray-50 border border-gray-200 rounded-2xl px-5 py-4 text-gray-800 font-medium focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400 transition-all shadow-inner"/>
                    </div>
                    <div>
                        <label className="block text-[13px] font-extrabold text-gray-700 mb-2.5 ml-1">어떤 활동이었나요?</label>
                        <input type="text" value={title} onChange={e=>setTitle(e.target.value)} disabled={loading}
                            placeholder="예: 교내 융합과학 창작대회"
                            className="w-full bg-gray-50 border border-gray-200 rounded-2xl px-5 py-4 text-gray-800 font-medium focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400 transition-all shadow-inner"/>
                    </div>
                    <div>
                        <label className="block text-[13px] font-extrabold text-gray-700 mb-2.5 ml-1">배운 점과 느낀 점</label>
                        <textarea value={content} onChange={e=>setContent(e.target.value)} disabled={loading} rows="5"
                            placeholder="자세한 활동 내용과 느낀 점, 본인의 역할 등을 자유롭게 적어보세요."
                            className="w-full bg-gray-50 border border-gray-200 rounded-2xl px-5 py-4 text-gray-800 font-medium focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400 transition-all shadow-inner resize-none leading-relaxed"/>
                    </div>
                    <button type="submit" disabled={loading}
                        className={`w-full bg-gradient-to-r ${cat.color} text-white font-extrabold py-4 rounded-2xl transition-all shadow-lg ${cat.shadow} active:scale-[0.98] text-[15px] flex justify-center items-center h-14 disabled:opacity-50`}>
                        {loading ? <LoadingSpinner /> : '활동내용 저장하기'}
                    </button>
                </form>
            </div>
        );
    }
    // ── AI 생기부 (담임교사 전용) ─────────────────────────────────
    // ── 학생별 AI 생기부 생성 화면 ───────────────────────────────
    function StudentAI({ student, records, savedResult, onBack, onSave }) {
        const [selectedIds, setSelectedIds] = useState(new Set());
        const [loading,     setLoading]     = useState(false);
        const [result,      setResult]      = useState(savedResult || '');
        const [saving,      setSaving]      = useState(false);
        const [saved,       setSaved]       = useState(!!savedResult);
        const toggleSelect = (id) => {
            const s = new Set(selectedIds);
            s.has(id) ? s.delete(id) : s.add(id);
            setSelectedIds(s);
        };
        const selectAll = () => {
            setSelectedIds(new Set(records.map(r => r.id)));
        };
        const handleSave = async () => {
            if (!result) return;
            setSaving(true);
            try {
                const res = await callAPI({
                    action: 'saveReport',
                    studentId: student.studentId,
                    name: student.name,
                    content: result,
                    savedAt: new Date().toLocaleString('ko-KR')
                });
                if (res.success) {
                    setSaved(true);
                    onSave(student.studentId, result);
                    alert('저장 완료!');
                } else {
                    alert('저장 실패: ' + (res.message || '알 수 없음'));
                }
            } catch(e) {
                alert('저장 중 오류가 발생했습니다.');
            } finally {
                setSaving(false);
            }
        };
        const generateAI = async () => {
            if (selectedIds.size === 0) return alert('요약할 기록을 1개 이상 선택해주세요.');
            setLoading(true); setResult('');
            const selected = records.filter(r => selectedIds.has(r.id));
            const text = selected.map(r => {
                if (r.categoryId === 'subject') {
                    let t = `[교과활동 - ${r.subject || ''}] 단원: ${r.unit || ''}`;
                    if (r.inquiry) t += `
탐구활동: ${r.inquiry}`;
                    if (r.learned) t += `\n배운점: ${r.learned}`;
                    if (r.reflection) t += `\n느낀점: ${r.reflection}`;
                    return t;
                }
                return `[${CATEGORIES[r.categoryId]?.title || r.categoryId}] ${r.title || r.subject || ''}\n내용: ${r.content || r.unit || ''}`;
            }).join('\n\n');
            const prompt = `다음은 어느 고등학생의 창의적 체험학습 실제 기록들입니다. 학교생활기록부(생기부) 양식에 맞게 아래 규칙을 반드시 따라 단일 문단으로 작성해 주세요.
🚨 문체 규칙(가장 중요): 모든 문장은 반드시 개조식("~함", "~임", "~보임", "~나타냄" 등)으로 끝내야 합니다. "~했습니다", "~하였습니다", "~합니다" 등 서술식 종결어미는 절대 사용하지 마세요.
이 학생의 리더십, 비판적 사고, 인성 및 발전 가능성을 은은하게 부각해 주세요.
🚨 언어 규칙: 영어 단어, 알파벳, 한자는 절대 사용하지 마세요. 모든 내용은 순수 한글로만 작성하세요.
🚨 다양성 규칙: 학생마다 생기부 문장의 구조, 표현 방식, 시작 어구가 모두 달라야 합니다. 같은 반 학생들의 생기부가 비슷한 패턴으로 반복되지 않도록 각 학생의 활동 특성에 맞는 고유한 문체와 표현을 사용하세요.
🚨 분량 규칙(절대 엄수): 완성된 문장 전체 길이는 UTF-8 바이트 기준으로 반드시 1500바이트 이하여야 합니다. 1500바이트를 단 1바이트라도 초과하면 절대 안 됩니다. 한글 1자는 3바이트입니다. 목표는 1400~1480바이트입니다. 작성 후 반드시 스스로 바이트 수를 계산해서 초과하면 문장을 줄이세요.\n\n[학생 활동 원본 기록]\n${text}`;
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                if (data.candidates?.[0]) setResult(data.candidates[0].content.parts[0].text.trim());
                else alert('AI 오류: ' + (data.error?.message || '알 수 없음'));
            } catch(e) { alert('AI 서버 통신 실패.'); }
            finally { setLoading(false); }
        };
        const getNum = (sid) => String(sid).length >= 4 ? String(sid).slice(2) : String(sid);
        return (
            <div className="animate-fade-in space-y-4 pb-10">
                {/* 학생 헤더 */}
                <div className="bg-gradient-to-br from-indigo-500 to-blue-600 rounded-[2rem] p-5 text-white shadow-lg relative overflow-hidden">
                    <div className="absolute -top-6 -right-6 w-24 h-24 bg-white rounded-full opacity-10"></div>
                    <button onClick={onBack} className="flex items-center text-white/80 hover:text-white bg-white/15 px-3 py-1.5 rounded-full text-xs font-bold mb-3 transition-all active:scale-95">
                        <BackIcon /><span className="ml-1">학생 목록</span>
                    </button>
                    <div className="flex items-center">
                        <div className="w-12 h-12 rounded-full bg-white/20 flex flex-col items-center justify-center mr-3 font-extrabold shadow-inner">
                            <span className="text-[13px] leading-none">{getNum(student.studentId)}</span>
                            <span className="text-[9px] opacity-70 mt-0.5">번</span>
                        </div>
                        <div>
                            <p className="font-extrabold text-xl">{student.name}</p>
                            <p className="text-white/70 text-xs">학번 {student.studentId} · 기록 {records.length}건</p>
                        </div>
                    </div>
                </div>
                {/* 기록 선택 */}
                <div className="bg-gradient-to-br from-indigo-50 to-blue-50 p-5 rounded-[2rem] border border-blue-100/50 shadow-sm">
                    <div className="flex items-center justify-between mb-4">
                        <p className="font-extrabold text-blue-900 text-[15px]">✅ 생기부에 포함할 기록 선택</p>
                        <button onClick={selectAll} className="text-[11px] font-bold text-blue-600 bg-blue-100 px-3 py-1 rounded-full hover:bg-blue-200 transition-colors active:scale-95">
                            전체선택
                        </button>
                    </div>
                    {records.length > 0 ? (
                        <div className="space-y-3 mb-5">
                            {Object.values(CATEGORIES).map(cat => {
                                const cr = records.filter(r => r.categoryId === cat.id);
                                if (cr.length === 0) return null;
                                return (
                                    <div key={cat.id} className="bg-white/70 p-3.5 rounded-2xl border border-white">
                                        <div className="flex items-center mb-2.5 pl-1">
                                            <div className={`w-2 h-4 rounded-full mr-2 bg-gradient-to-br ${cat.color}`}></div>
                                            <span className={`text-[12px] font-extrabold ${cat.text}`}>{cat.title}</span>
                                            <span className={`ml-1.5 text-[10px] ${cat.bg} ${cat.text} px-1.5 py-0.5 rounded-full font-bold`}>{cr.length}건</span>
                                        </div>
                                        <div className="space-y-2">
                                            {cr.map(r => (
                                                <label key={r.id} className={`flex items-start p-3 rounded-xl border-2 cursor-pointer transition-all ${selectedIds.has(r.id) ? 'bg-white border-blue-500 shadow-sm' : 'bg-white/60 border-transparent hover:bg-white'}`}>
                                                    <input type="checkbox" className="mt-0.5 mr-3 w-4 h-4 text-blue-600 rounded" checked={selectedIds.has(r.id)} onChange={() => toggleSelect(r.id)} />
                                                    <div className="flex-1 min-w-0">
                                                        <p className={`text-sm font-bold truncate ${selectedIds.has(r.id) ? 'text-blue-900' : 'text-gray-800'}`}>{r.title}</p>
                                                        <p className="text-xs text-gray-400 mt-0.5">{r.date}</p>
                                                    </div>
                                                </label>
                                            ))}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    ) : (
                        <p className="text-sm text-gray-500 bg-white/60 p-4 rounded-2xl text-center mb-4">기록이 없습니다.</p>
                    )}
                    <button onClick={generateAI} disabled={loading || selectedIds.size === 0}
                        className="w-full bg-blue-600 disabled:bg-gray-400 text-white font-extrabold py-4 rounded-2xl transition-all shadow-xl shadow-blue-500/30 active:scale-[0.98] flex justify-center items-center text-[15px]">
                        {loading ? <LoadingSpinner /> : `선택한 ${selectedIds.size}건으로 생기부 작성`}
                    </button>
                </div>
                {/* AI 결과 */}
                {result && (
                    <div className="bg-white p-6 rounded-[2rem] shadow-lg border border-gray-100 animate-fade-in">
                        <div className="flex items-center justify-between mb-1">
                            <h3 className="font-extrabold text-gray-800 flex items-center text-lg"><span className="text-2xl mr-2">✨</span>{student.name} 생기부 완성</h3>
                            {saved && <span className="text-[11px] font-bold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200">✅ 저장됨</span>}
                        </div>
                        {(() => {
                            const bytes = new TextEncoder().encode(result).length;
                            const over = bytes > 1500;
                            return (
                                <div className={`flex items-center gap-2 mb-4 pl-1 ${over ? 'text-red-500' : 'text-emerald-600'}`}>
                                    <span className="text-xs font-extrabold">{bytes} bytes / 1500 bytes</span>
                                    {over
                                        ? <span className="text-[11px] font-bold bg-red-50 text-red-500 px-2 py-0.5 rounded-full border border-red-200">⚠️ 초과! 재생성 권장</span>
                                        : <span className="text-[11px] font-bold bg-emerald-50 text-emerald-600 px-2 py-0.5 rounded-full border border-emerald-200">✅ 적합</span>
                                    }
                                </div>
                            );
                        })()}
                        <div className="text-[14px] text-gray-700 bg-gray-50 p-5 rounded-2xl leading-relaxed border border-gray-100 tracking-wide break-keep">{result}</div>
                        <div className="mt-5 flex gap-2 justify-end">
                            <button className="bg-gray-100 text-gray-700 font-bold px-5 py-2.5 rounded-xl hover:bg-gray-200 transition-colors text-[13px]"
                                onClick={() => { navigator.clipboard.writeText(result); alert('복사 완료!'); }}>
                                복사하기
                            </button>
                            <button onClick={handleSave} disabled={saving || saved}
                                className="bg-emerald-600 disabled:bg-gray-300 text-white font-bold px-5 py-2.5 rounded-xl hover:bg-emerald-700 transition-colors shadow-md text-[13px] flex items-center gap-1.5">
                                {saving ? <><svg className="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>저장 중</> : saved ? '✅ 저장완료' : '💾 저장하기'}
                            </button>
                        </div>
                    </div>
                )}
            </div>
        );
    }
    // ── AI 생기부 탭 - 학생 목록 ─────────────────────────────────
    function Summary({ records, user }) {
        const [selectedStudent, setSelectedStudent] = useState(null);
        const [savedReports,    setSavedReports]    = useState({});   // { studentId: content }
        const [loadingSaved,    setLoadingSaved]    = useState(true);
        // 마운트 시 저장된 생기부 목록 불러오기
        useEffect(() => {
            const fetchSaved = async () => {
                try {
                    const res = await callAPI({ action: 'getReports', homeroomClass: user.homeroomClass || '' });
                    if (res.success) {
                        const map = {};
                        (res.reports || []).forEach(r => { map[String(r.studentId)] = r.content; });
                        setSavedReports(map);
                    }
                } catch(e) {}
                finally { setLoadingSaved(false); }
            };
            fetchSaved();
        }, []);
        const handleSave = (studentId, content) => {
            setSavedReports(prev => ({ ...prev, [String(studentId)]: content }));
        };
        // 학번 기준으로 학생별 그룹핑
        const grouped = records.reduce((acc, r) => {
            const sid = String(r.studentId || '미상');
            if (!acc[sid]) acc[sid] = { studentId: sid, name: r.name || sid, records: [] };
            acc[sid].records.push(r);
            return acc;
        }, {});
        const students = Object.values(grouped).sort((a,b) => Number(a.studentId) - Number(b.studentId));
        const getNum = (sid) => String(sid).length >= 4 ? String(sid).slice(2) : String(sid);
        const savedCount = Object.keys(savedReports).length;
        // 학생 선택 시 해당 학생 AI 화면으로
        if (selectedStudent) {
            const st = grouped[selectedStudent];
            return <StudentAI
                student={st}
                records={st.records}
                savedResult={savedReports[selectedStudent] || ''}
                onBack={() => setSelectedStudent(null)}
                onSave={handleSave}
            />;
        }
        return (
            <div className="animate-fade-in space-y-4 pb-10">
                {/* 헤더 */}
                <div className="bg-gradient-to-br from-indigo-50 to-blue-50 p-5 rounded-[2rem] border border-blue-100/50 shadow-sm relative overflow-hidden">
                    <div className="absolute -top-10 -right-10 w-40 h-40 bg-blue-300 rounded-full mix-blend-multiply opacity-20 filter blur-3xl"></div>
                    <div className="flex items-center justify-between mb-1 relative z-10">
                        <div className="flex items-center">
                            <div className="bg-blue-600 text-white p-2.5 rounded-xl mr-3 shadow-md shadow-blue-500/30"><SparklesIcon active={false} /></div>
                            <h2 className="font-extrabold text-blue-900 text-xl">생기부 AI 편집기</h2>
                        </div>
                        {!loadingSaved && savedCount > 0 && (
                            <span className="text-[11px] font-bold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200">
                                {savedCount}명 저장됨
                            </span>
                        )}
                    </div>
                    <p className="text-[13px] text-blue-800/70 relative z-10 pl-1">학생을 선택하면 해당 학생의 기록으로 생기부를 작성합니다.</p>
                </div>
                {/* 학생 목록 */}
                {students.length === 0 ? (
                    <div className="bg-white p-10 rounded-[2rem] text-center shadow-sm border border-gray-100">
                        <p className="text-gray-500 font-bold">아직 학생 기록이 없습니다.</p>
                    </div>
                ) : (
                    <div className="space-y-3">
                        {students.map(st => {
                            const hasSaved = !!savedReports[st.studentId];
                            return (
                                <button key={st.studentId} onClick={() => setSelectedStudent(st.studentId)}
                                    className={`w-full bg-white rounded-[1.8rem] p-5 shadow-sm border hover:shadow-md active:scale-[0.98] transition-all text-left flex items-center group ${hasSaved ? 'border-emerald-200' : 'border-gray-100'}`}>
                                    <div className={`w-12 h-12 rounded-full text-white font-extrabold flex flex-col items-center justify-center mr-4 shrink-0 shadow group-hover:scale-105 transition-transform bg-gradient-to-br ${hasSaved ? 'from-emerald-400 to-teal-500' : 'from-indigo-400 to-blue-500'}`}>
                                        <span className="text-[13px] leading-none">{getNum(st.studentId)}</span>
                                        <span className="text-[9px] opacity-70 leading-none mt-0.5">번</span>
                                    </div>
                                    <div className="flex-1">
                                        <div className="flex items-center gap-2">
                                            <p className="font-extrabold text-gray-800 text-[16px]">{st.name}</p>
                                            {hasSaved && <span className="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full">생기부 저장됨</span>}
                                        </div>
                                        <p className="text-xs text-gray-400 mt-0.5">기록 {st.records.length}건</p>
                                    </div>
                                    <div className="text-gray-300 group-hover:text-blue-400 transition-colors">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M9 5l7 7-7 7"/></svg>
                                    </div>
                                </button>
                            );
                        })}
                    </div>
                )}
            </div>
        );
    }
    // ── 교사용 학생 기록 조회 ─────────────────────────────────────
    // ── 교사용 학생 기록 카드 ─────────────────────────────────────
    function StudentRecordCard({ sid, name, records: sRecs }) {
        const getNum = (sid) => String(sid).length >= 4 ? String(sid).slice(2) : String(sid);
        const [expanded, setExpanded] = useState(false);
        const preview = sRecs.slice(0, expanded ? sRecs.length : 2);
        return (
            <div className="bg-white rounded-[1.8rem] p-5 shadow-sm border border-gray-100">
                <div className="flex items-center mb-3">
                    <div className="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-400 to-blue-500 text-white font-extrabold flex flex-col items-center justify-center mr-3 shrink-0 shadow">
                        <span className="text-[11px] leading-none">{getNum(sid)}</span>
                        <span className="text-[9px] opacity-70 leading-none mt-0.5">번</span>
                    </div>
                    <div className="flex-1">
                        <span className="font-extrabold text-gray-800 text-[16px]">{name}</span>
                        <span className="text-gray-400 text-xs ml-2">({sid})</span>
                    </div>
                    <span className="text-xs font-bold bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-full">{sRecs.length}건</span>
                </div>
                <div className="space-y-2">
                    {preview.sort((a,b) => new Date(b.date)-new Date(a.date)).map(r => {
                        const cat = CATEGORIES[r.categoryId] || {};
                        return (
                            <div key={r.id || r.date+r.title} className="bg-gray-50 rounded-2xl p-3.5 border border-gray-100">
                                <div className="flex items-center mb-1 flex-wrap gap-1">
                                    <span className={`text-[10px] font-extrabold px-2 py-0.5 rounded-md ${cat.bg||'bg-gray-100'} ${cat.text||'text-gray-600'}`}>{cat.title||r.categoryId}</span>
                                    {r.subject && r.categoryId === 'subject' && <span className="text-[10px] font-bold bg-violet-50 text-violet-600 px-2 py-0.5 rounded-md">{r.subject}</span>}
                                    <span className="text-xs text-gray-400 ml-auto">{r.date}</span>
                                </div>
                                {r.categoryId === 'subject' ? (
                                    <>
                                        <p className="font-bold text-gray-800 text-sm">{r.unit || '(단원없음)'}</p>
                                        {r.learned && <p className="text-xs text-gray-500 mt-1 break-keep line-clamp-2">{r.learned}</p>}
                                    </>
                                ) : (
                                    <>
                                        <p className="font-bold text-gray-800 text-sm">{r.title || r.subject}</p>
                                        <p className="text-xs text-gray-500 mt-1 leading-relaxed break-keep line-clamp-2">{r.content || r.unit}</p>
                                    </>
                                )}
                            </div>
                        );
                    })}
                </div>
                {sRecs.length > 2 && (
                    <button onClick={() => setExpanded(!expanded)}
                        className="mt-2 w-full text-center text-xs font-bold text-indigo-500 hover:text-indigo-700 py-2 transition-colors">
                        {expanded ? '▲ 접기' : `▼ ${sRecs.length - 2}개 더 보기`}
                    </button>
                )}
            </div>
        );
    }

    function TeacherDashboard({ user, records, loadingRecords, filterCategory }) {
        const isHomeroom = user.role === 'homeroom';
        const isSubject  = user.role === 'subject';
        const homeroomClass = user.homeroomClass || '';

        // 교과목 교사: 담당 과목 탭
        const assignments = (() => {
            if (!isSubject || !user.assignments) return [];
            try { return typeof user.assignments === 'string' ? JSON.parse(user.assignments) : user.assignments; }
            catch(e) { return []; }
        })();
        const [activeTab, setActiveTab] = useState(0);

        let filtered = [...records];
        if (isHomeroom && homeroomClass) {
            filtered = filtered.filter(r => String(r.studentId || '').startsWith(homeroomClass));
        }
        if (filterCategory) {
            filtered = filtered.filter(r => r.categoryId === filterCategory);
        }
        // 교과목 교사: 선택된 탭의 과목+학급으로 필터
        if (isSubject && assignments.length > 0) {
            const tab = assignments[activeTab] || assignments[0];
            filtered = filtered.filter(r => {
                const sid = String(r.studentId || '');
                const inClass = tab.classes.some(c => sid.startsWith(String(c).trim()));
                const isSubjectRecord = r.categoryId === 'subject';
                const matchSubject = !r.subject || r.subject === tab.subject;
                return isSubjectRecord && inClass && matchSubject;
            });
        }

        const grouped = filtered.reduce((acc, r) => {
            const key = String(r.studentId || '미상');
            if (!acc[key]) acc[key] = { name: r.name || key, records: [] };
            acc[key].records.push(r);
            return acc;
        }, {});
        const sorted = Object.entries(grouped).sort(([a],[b]) => Number(a) - Number(b));

        if (loadingRecords) return (
            <div className="flex flex-col items-center justify-center py-24">
                <LoadingSpinner /><p className="text-gray-400 text-sm mt-4 font-bold">구글 서버와 연결 중...</p>
            </div>
        );

        return (
            <div className="space-y-4 animate-fade-in pb-10">
                {/* 교과목 교사: 과목 탭 */}
                {isSubject && assignments.length > 0 && (
                    <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                        {assignments.map((a, i) => (
                            <button key={i} onClick={() => setActiveTab(i)}
                                className={`shrink-0 px-4 py-2 rounded-2xl text-[13px] font-extrabold transition-all ${activeTab === i ? 'bg-violet-600 text-white shadow-md' : 'bg-white text-gray-500 border border-gray-200'}`}>
                                {a.subject}
                                <span className="ml-1.5 text-[10px] opacity-70">({a.classes.join(',')}반)</span>
                            </button>
                        ))}
                    </div>
                )}
                {sorted.length === 0 ? (
                    <div className="bg-white p-10 rounded-[2rem] text-center shadow-sm border border-gray-100">
                        <p className="text-2xl mb-3">{isSubject ? '📚' : '🏫'}</p>
                        <p className="text-gray-700 font-extrabold mb-1">기록이 없습니다</p>
                        <p className="text-gray-400 text-sm">아직 학생들이 활동을 기록하지 않았습니다.</p>
                    </div>
                ) : (
                    sorted.map(([sid, { name, records: sRecs }]) => (
                        <StudentRecordCard key={sid} sid={sid} name={name} records={sRecs} />
                    ))
                )}
            </div>
        );
    }
    // ── 메인 App ──────────────────────────────────────────────────
    function App() {
        const [selectedRole,   setSelectedRole]   = useState(null);
        const [user,           setUser]            = useState(null);
        const [tab,            setTab]             = useState('home');
        const [viewCategory,   setViewCategory]    = useState(null);
        const [isWriting,      setIsWriting]       = useState(false);
        const [records,        setRecords]         = useState([]);
        const [loadingRecords, setLoadingRecords]  = useState(false);
        const [selectedSubject, setSelectedSubject] = useState(null);
        const [subjectList,     setSubjectList]     = useState([]);
        const [loadingSubjects, setLoadingSubjects] = useState(false);
        const [editingRecord,   setEditingRecord]   = useState(null); // 수정 중인 기록
        // GAS 웹앱 환경에서는 스토리지 차단으로 state만 사용
        useEffect(() => {}, []);
        // 유저(또는 homeroomClass) 변경 시 데이터 fetch
        useEffect(() => {
            if (user) fetchRecords();
        }, [user?.studentId, user?.homeroomClass]);
        const fetchRecords = async () => {
            setLoadingRecords(true);
            try {
                const isStudent = user.role === 'student';
                // 교과목 교사의 경우 담당 학급 목록 전체를 서버에 전달
                let subjectClasses = [];
                if (user.role === 'subject' && user.assignments) {
                    try {
                        const assigns = typeof user.assignments === 'string' ? JSON.parse(user.assignments) : user.assignments;
                        assigns.forEach(a => { subjectClasses = subjectClasses.concat(a.classes || []); });
                        subjectClasses = [...new Set(subjectClasses)]; // 중복 제거
                    } catch(e) {}
                }
                const payload = isStudent
                    ? { action: 'getRecords', studentId: user.studentId }
                    : { action: 'getAllRecords', role: user.role, homeroomClass: user.homeroomClass || '', subjectClasses };
                const res = await callAPI(payload);
                if (res.success) setRecords(res.records || []);
            } catch(e) {
                alert('서버와 데이터를 동기화하는 데 실패했습니다. 다시 시도해주세요.');
            } finally {
                setLoadingRecords(false);
            }
        };
        const handleLogin = (userInfo) => {
            // GAS 환경에서 sessionStorage 차단으로 state만 사용
            setUser(userInfo);
            setSelectedRole(userInfo.role || 'student');
        };
        const handleLogout = () => {
            if (!confirm('정말 로그아웃 하시겠습니까?')) return;
            setUser(null); setSelectedRole(null); setRecords([]);
            setTab('home'); setViewCategory(null);
        };
        // 교과활동 카테고리 선택 시 해당 반 과목 목록 로드
        const handleSelectCategory = async (categoryId) => {
            setViewCategory(categoryId);
            setSelectedSubject(null);
            if (categoryId === 'subject' && user) {
                const classCode = String(user.studentId || '').slice(0, 2); // 학번 앞 2자리
                setLoadingSubjects(true);
                try {
                    const res = await callAPI({ action: 'getSubjectsByClass', classCode });
                    if (res.success) setSubjectList(res.subjects || []);
                } catch(e) { setSubjectList([]); }
                finally { setLoadingSubjects(false); }
            }
        };

        const handleSaveRecord = async (newRecord) => {
            const record = { studentId: user.studentId, name: user.name, ...newRecord };
            try {
                const res = await callAPI({ action: 'saveRecord', record });
                if (res.success) {
                    setRecords(prev => [...prev, { ...record, id: res.id || Date.now().toString() }]);
                    setIsWriting(false);
                } else {
                    alert('저장 실패: ' + (res.message || '알 수 없음'));
                }
            } catch(e) {
                alert('저장 중 오류가 발생했습니다. 다시 시도해주세요.');
            }
        };

        const handleDeleteRecord = async (recordId) => {
            if (!confirm('이 기록을 삭제하시겠습니까?')) return;
            try {
                const res = await callAPI({ action: 'deleteRecord', recordId, studentId: user.studentId });
                if (res.success) {
                    setRecords(prev => prev.filter(r => r.id !== recordId));
                    alert('삭제되었습니다.');
                } else {
                    alert('삭제 실패: ' + (res.message || '알 수 없음'));
                }
            } catch(e) {
                alert('삭제 중 오류가 발생했습니다.');
            }
        };

        const handleUpdateRecord = async (updatedRecord) => {
            try {
                const res = await callAPI({ action: 'updateRecord', record: { ...updatedRecord, studentId: user.studentId } });
                if (res.success) {
                    setRecords(prev => prev.map(r => r.id === updatedRecord.id ? { ...r, ...updatedRecord } : r));
                    setIsWriting(false);
                    alert('수정되었습니다.');
                } else {
                    alert('수정 실패: ' + (res.message || '알 수 없음'));
                }
            } catch(e) {
                alert('수정 중 오류가 발생했습니다.');
            }
        };
        const navHome    = () => { setTab('home');    setViewCategory(null); setIsWriting(false); setSelectedSubject(null); };
        const navSummary = () => { setTab('summary'); setViewCategory(null); setIsWriting(false); };
        // ── 화면 분기 ──
        if (!selectedRole) return <RoleSelectScreen onSelectRole={setSelectedRole} />;
        if (!user)         return <LoginScreen role={selectedRole} onLogin={handleLogin} onBack={() => setSelectedRole(null)} />;
        const role      = user.role || 'student';
        const isStudent = role === 'student';
        const roleInfo  = ROLES[role] || ROLES.student;
        const teacherFilterCat = role === 'career' ? 'career' : role === 'subject' ? 'subject' : null;
        const getTitle = () => {
            if (!isStudent) return tab === 'summary' ? 'AI 생기부 생성' : `${roleInfo.label} ${user.name}`;
            if (tab === 'summary') return '생기부 자동 편집';
            if (isWriting) return CATEGORIES[viewCategory].title + ' 작성';
            return `${user.name}의 창체 일기`;
        };
        return (
            <div className="w-full max-w-[400px] mx-auto h-[100dvh] lg:h-[844px] bg-[#f8f9fa] flex flex-col relative lg:rounded-[3rem] lg:border-[12px] lg:border-white lg:shadow-2xl overflow-hidden ring-1 ring-gray-200">
                {/* 배경 워터마크 */}
                <div className="absolute inset-0 flex items-center justify-center opacity-[0.12] pointer-events-none z-0">
                    <img src="./logo.png" onError={e=>e.target.style.display='none'} alt="" className="w-full max-w-[400px] object-contain mix-blend-multiply scale-[1.3] -translate-y-10" />
                </div>
                {(!viewCategory || isWriting) && <Header title={getTitle()} user={user} onLogout={handleLogout} />}
                <div className="flex-1 overflow-y-auto no-scrollbar p-5 pb-28">
                    {/* 학생 화면 */}
                    {isStudent && tab === 'home' && !viewCategory && (
                        <Dashboard onSelectCategory={handleSelectCategory} records={records} loadingRecords={loadingRecords} />
                    )}
                    {/* 교과활동 - 과목 선택 화면 */}
                    {isStudent && tab === 'home' && viewCategory === 'subject' && !selectedSubject && !isWriting && (
                        <SubjectSelectScreen subjects={subjectList} loading={loadingSubjects} onSelectSubject={setSelectedSubject} onBack={navHome} />
                    )}
                    {/* 교과활동 - 과목별 기록 목록 */}
                    {isStudent && tab === 'home' && viewCategory === 'subject' && selectedSubject && !isWriting && (
                        <SubjectRecordList subject={selectedSubject} records={records} loadingRecords={loadingRecords}
                            onBack={() => setSelectedSubject(null)}
                            onWrite={() => setIsWriting(true)}
                            onDelete={handleDeleteRecord}
                            onEdit={(r) => { setEditingRecord(r); setIsWriting(true); }} />
                    )}
                    {/* 교과활동 - 입력/수정 폼 */}
                    {isStudent && tab === 'home' && viewCategory === 'subject' && selectedSubject && isWriting && (
                        <SubjectWriteForm subject={selectedSubject} editingRecord={editingRecord}
                            onSave={editingRecord ? handleUpdateRecord : handleSaveRecord}
                            onCancel={() => { setIsWriting(false); setEditingRecord(null); }} />
                    )}
                    {/* 진로/창체 - 기존 화면 */}
                    {isStudent && tab === 'home' && viewCategory && viewCategory !== 'subject' && !isWriting && (
                        <CategoryList categoryId={viewCategory} records={records} loadingRecords={loadingRecords}
                            onBack={navHome} onWrite={() => setIsWriting(true)} onDelete={handleDeleteRecord} />
                    )}
                    {isStudent && tab === 'home' && viewCategory && viewCategory !== 'subject' && isWriting && (
                        <WriteForm categoryId={viewCategory} onSave={handleSaveRecord} onCancel={() => setIsWriting(false)} />
                    )}
                    {/* 교사 화면 */}
                    {!isStudent && tab === 'home' && (
                        <div className="animate-fade-in pt-2">
                            <div className={`bg-gradient-to-br ${roleInfo.color} rounded-[2rem] p-5 mb-5 text-white shadow-lg relative overflow-hidden`}>
                                <div className="absolute -top-8 -right-8 w-28 h-28 bg-white rounded-full opacity-10"></div>
                                <p className="font-extrabold text-lg">{roleInfo.emoji} {user.name} {roleInfo.label}</p>
                                {role === 'homeroom' && user.homeroomClass ? (
                                    <div className="mt-2 flex items-center gap-2 flex-wrap">
                                        <div className="inline-flex items-center bg-white/25 px-3 py-1.5 rounded-full">
                                            <span className="text-white font-extrabold text-sm">🏫 {user.homeroomClass[0]}학년 {user.homeroomClass[1]}반 담임</span>
                                        </div>
                                        <span className="text-white/70 text-xs">해당 학급 기록만 표시</span>
                                    </div>
                                ) : role === 'subject' && user.assignments ? (
                                    <div className="mt-2 flex flex-wrap gap-1.5">
                                        {(() => {
                                            try {
                                                const assigns = typeof user.assignments === 'string' ? JSON.parse(user.assignments) : user.assignments;
                                                return assigns.map((a, i) => (
                                                    <div key={i} className="inline-flex items-center bg-white/25 px-2.5 py-1 rounded-full">
                                                        <span className="text-white font-bold text-xs">📚 {a.subject} ({a.classes.join(',')}반)</span>
                                                    </div>
                                                ));
                                            } catch(e) { return null; }
                                        })()}
                                    </div>
                                ) : (
                                    <p className="text-white/80 text-xs mt-1">{roleInfo.desc}</p>
                                )}
                            </div>
                            <TeacherDashboard user={user} records={records} loadingRecords={loadingRecords} filterCategory={teacherFilterCat} />
                        </div>
                    )}
                    {/* 담임교사 AI 생기부 (담당 학급 학생만) */}
                    {role === 'homeroom' && tab === 'summary' && (
                        <Summary records={user.homeroomClass ? records.filter(r => String(r.studentId||"").startsWith(user.homeroomClass)) : records} user={user} />
                    )}
                </div>
                {/* 하단 내비게이션 */}
                <div className="absolute bottom-0 w-full bg-white/90 backdrop-blur-xl border-t border-gray-100/50 pb-safe z-30">
                    <div className="flex justify-evenly items-center p-2.5">
                        <button onClick={navHome}
                            className={`flex flex-col items-center p-2.5 px-10 rounded-2xl transition-all duration-300 w-[140px] ${tab==='home' ? 'text-blue-600 bg-blue-50/80 -translate-y-1' : 'text-gray-400'}`}>
                            <HomeIcon active={tab==='home'} />
                            <span className="text-[12px] font-extrabold mt-1">{isStudent ? '홈 대시보드' : '기록 조회'}</span>
                        </button>
                        {role === 'homeroom' && (
                            <button onClick={navSummary}
                                className={`flex flex-col items-center p-2.5 px-10 rounded-2xl transition-all duration-300 w-[140px] ${tab==='summary' ? 'text-blue-600 bg-blue-50/80 -translate-y-1' : 'text-gray-400'}`}>
                                <SparklesIcon active={tab==='summary'} />
                                <span className="text-[12px] font-extrabold mt-1">AI 생기부</span>
                            </button>
                        )}
                    </div>
                </div>
            </div>
        );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
