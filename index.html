function adjustToByteRange(text,min=1400,max=1500){const enc=new TextEncoder();if(!text||typeof text!=='string')return text||'';let r=text.trim().replace(/^(이\s*)?학생은\s*/,'').replace(/^해당\s*학생은\s*/,'');if(enc.encode(r).length>=min&&enc.encode(r).length<=max)return r;if(enc.encode(r).length>max){const ends=['함.','임.','음.','됨.','보임.','나타냄.'];let at=0;while(enc.encode(r).length>max&&at<200){at++;if(r.length<10)break;let lp=-1;for(const e of ends){const idx=r.lastIndexOf(e);if(idx>lp&&idx<r.length-e.length)lp=idx;}if(lp>0){const ep=ends.find(e=>r.indexOf(e,lp)===lp);r=r.slice(0,lp+(ep?ep.length:2)).trim();}else{const ld=r.lastIndexOf('.');if(ld>r.length*0.5)r=r.slice(0,ld+1).trim();else r=r.slice(0,-Math.ceil(20/3)).trim();}}}return r;}

const GAS_URL='https://script.google.com/macros/s/AKfycbzqesWKR4hO0Yo4kb0sp4-RdJ3h8d8bmQoUQ4fKDUQfifP7itBSjtj6CTmyReX5rVjl/exec';

function callAPI(payload){return fetch(GAS_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(r=>{if(!r.ok)return r.text().then(t=>{throw new Error('HTTP '+r.status);});return r.json();});}

async function callAIWithRetry(text,onProgress){
  const MAX=3, DELAYS=[0,4000,8000];
  const ENGINE_MSGS=[
    'Gemini 2.5 Flash 시도 중...',
    'Gemini Flash Latest 재시도 중...',
    'GPT-4o Mini로 전환 중...'
  ];
  for(let i=0;i<MAX;i++){
    if(DELAYS[i]>0){
      if(onProgress)onProgress(`${ENGINE_MSGS[i]} (${Math.round(DELAYS[i]/1000)}초 대기)`);
      await new Promise(r=>setTimeout(r,DELAYS[i]));
    } else {
      if(onProgress)onProgress(ENGINE_MSGS[i]);
    }
    try{
      const res=await callAPI({action:'generateAI',text});
      if(res.success&&res.content){
        const modelLabel=res.model==='gpt-4o-mini'?'GPT-4o Mini':res.model||'AI';
        if(onProgress)onProgress(`✓ ${modelLabel} 생성 완료!`);
        return res;
      }
      if(res.errorType==='overloaded'&&i<MAX-1){
        if(onProgress)onProgress(`${ENGINE_MSGS[i]} 실패 → 다음 엔진으로...`);
        continue;
      }
      return res;
    }catch(e){
      if(i<MAX-1){if(onProgress)onProgress(`${ENGINE_MSGS[i]} 오류 → 다음 엔진으로...`);continue;}
      throw e;
    }
  }
  return{success:false,errorType:'overloaded',message:'선생님! 지금은 AI 요청이 많아 완성하지 못했습니다. 한번 더 시도해 주세요.'};
}

function LoginScreen({role,onLogin,onBack}){
  const isStudent=role==='student',isTeacher=role==='teacher',isCareer=role==='career';
  const [mode,setMode]=useState('login');
  const [id,setId]=useState(''),[name,setName]=useState(''),[pw,setPw]=useState(''),[phone,setPhone]=useState('');
  const [match,setMatch]=useState(null),[loading,setLoading]=useState(false),[checking,setChecking]=useState(false);
  const [saveId,setSaveId]=useState(false),[autoLogin,setAutoLogin]=useState(false);

  const storageKey=`autologin_${role}`,idKey=`savedid_${role}`;
  const c=ROLE_COLORS[role]||'#9b1c2e',phoneBg=ROLE_PHONE_BG[role]||'#f7f0f2';

  useEffect(()=>{try{const saved=localStorage.getItem(storageKey);if(saved){const{savedId,savedPw}=JSON.parse(saved);if(savedId&&savedPw){setId(savedId);setPw(savedPw);setAutoLogin(true);setSaveId(true);setLoading(true);callAPI({action:'login',studentId:savedId,password:savedPw,role}).then(res=>{if(res.success)onLogin({studentId:savedId,name:res.name,role,homeroomClass:res.homeroomClass||'',assignments:res.assignments||''});else{localStorage.removeItem(storageKey);setAutoLogin(false);setPw('');}setLoading(false);}).catch(()=>setLoading(false));return;}}const si=localStorage.getItem(idKey);if(si){setId(si);setSaveId(true);}}catch(e){}},[]);
  useEffect(()=>{if((isTeacher||isCareer)&&mode==='register')callAPI({action:'getSubjectList'}).then(r=>{if(r.success)setSubjects(r.subjects||{});}).catch(()=>{});},[mode]);

  const toggleClass=(idx,cls)=>setAssigns(prev=>prev.map((a,i)=>{if(i!==idx)return a;const s=new Set(a.classes);s.has(cls)?s.delete(cls):s.add(cls);return{...a,classes:s};}));

  const checkName=async()=>{if(!id.trim()||!name.trim()||!phone.trim())return alert('학번, 이름, 전화번호를 모두 입력해주세요!');setChecking(true);setMatch(null);try{const r=await callAPI({action:'lookupStudent',studentId:id.trim(),name:name.trim(),phone:phone.replace(/\D/g,'')});if(r.success)setMatch(true);else{setMatch(false);alert(r.message||'불일치');}}catch(e){setMatch(false);}setChecking(false);};

  const submit=async(e)=>{e.preventDefault();if(!id.trim()||!pw.trim())return alert('입력해주세요!');if(mode==='register'&&!name.trim())return alert('이름을 입력해주세요!');if(mode==='register'&&isStudent&&!match)return alert('학번 확인이 필요합니다!');if(mode==='register'&&isTeacher&&!match)return alert('이름/인증코드 확인이 필요합니다!');setLoading(true);try{let res;if(mode==='login'){res=await callAPI({action:'login',studentId:id.trim(),password:pw,role});}else if(isStudent){res=await callAPI({action:'register',studentId:id.trim(),name:name.trim(),password:pw,role:'student'});}else if(isTeacher){const va=assigns.filter(a=>a.subject&&a.classes.size>0);const ad=va.length>0?JSON.stringify(va.map(a=>({subject:a.subject,classes:[...a.classes].sort()}))):'';;res=await callAPI({action:'registerTeacher',teacherId:id.trim(),name:name.trim(),password:pw,role:'teacher',grade:match?.grade||'',classNum:match?.classNum||'',assignments:ad});if(res.success)res.assignments=ad;}else{res=await callAPI({action:'registerTeacher',teacherId:id.trim(),name:name.trim(),password:pw,role:'career',grade:'',classNum:'',assignments:''});}if(res.success){if(mode==='login'){if(autoLogin)try{localStorage.setItem(storageKey,JSON.stringify({savedId:id.trim(),savedPw:pw}));}catch(e){}else if(saveId){try{localStorage.removeItem(storageKey);}catch(e){}try{localStorage.setItem(idKey,id.trim());}catch(e){}}else{try{localStorage.removeItem(storageKey);localStorage.removeItem(idKey);}catch(e){}}}onLogin({studentId:id.trim(),name:mode==='login'?res.name:name.trim(),role,homeroomClass:res.homeroomClass||(isTeacher&&match?match.homeroomClass:''),assignments:res.assignments||'',club:res.club||''});}else alert(res.message||'오류');}catch(e){alert('서버 오류');}setLoading(false);};

  if(loading&&autoLogin)return(<div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',background:phoneBg}}><div style={{textAlign:'center'}}><div style={{width:52,height:52,background:c,borderRadius:15,margin:'0 auto 14px',display:'flex',alignItems:'center',justifyContent:'center'}}><RoleIcon role={role}/></div><p style={{fontSize:14,fontWeight:700,color:c,margin:'0 0 8px'}}>자동 로그인 중...</p><Spin/></div></div>);

      <div style={{position:'relative',zIndex:3}}>

          <div style={{display:'inline-flex',alignItems:'center',gap:6,background:'rgba(255,255,255,0.18)',border:'1px solid rgba(255,255,255,0.3)',borderRadius:20,padding:'5px 11px',height:26}}><div style={{width:5,height:5,borderRadius:'50%',background:'#ffd580'}}/><span style={{fontSize:10,color:'rgba(255,255,255,0.9)',fontWeight:600}}>{ROLE_LABELS[role]}</span></div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
  <div style={{width:64,height:64,background:'white',borderRadius:16,display:'flex',alignItems:'flex-end',justifyContent:'center',overflow:'hidden',boxShadow:`0 2px 12px rgba(${role==='student'?'155,28,46':'10,110,85'},0.25)`,flexShrink:0}}><img src={`https://jeondemo.github.io/chante-diary/${role==='student'?'1':'3-1'}.png`} style={{width:role==='student'?'115%':'95%',height:role==='student'?'115%':'95%',objectFit:role==='student'?'cover':'contain',objectPosition:'center bottom'}} alt=""/></div>
  <div style={{flex:1,display:'flex',justifyContent:'center'}}><div><p style={{fontFamily:"'Cormorant Garamond',serif",fontSize:20,fontStyle:'italic',fontWeight:600,color:'rgba(255,255,255,0.35)',margin:0,lineHeight:1.2,textTransform:'uppercase',letterSpacing:'0.05em'}}>Creating Tomorrow,</p><p style={{fontFamily:"'Cormorant Garamond',serif",fontSize:25,fontStyle:'italic',fontWeight:600,color:'rgba(255,255,255,0.5)',margin:'2px 0 0',lineHeight:1.1,textTransform:'uppercase',letterSpacing:'0.05em'}}>Together</p></div></div>
</div>
        <p style={{fontSize:22,fontWeight:700,color:'#fff',margin:'0 0 3px'}}>{mode==='login'?'로그인':'계정 등록'}</p>
        <p style={{fontSize:10,color:'rgba(255,255,255,0.5)',letterSpacing:'0.1em',margin:0}}>GWACHEON WOMANS HIGH SCHOOL</p>
      </div>
    </div>
    <div style={{padding:'8px 16px 28px'}}>
      <div style={{display:'flex',gap:6,marginBottom:18,marginTop:4}}>
        {['login','register'].map(m=>(<button key={m} onClick={()=>{setMode(m);setPw('');setName('');setPhone('');setMatch(null);setTeacherCode('');setCodeErr('');}} style={{flex:1,padding:'9px 0',borderRadius:12,border:`1.5px solid ${mode===m?c:'#e8d8db'}`,background:mode===m?c:'#fff',fontSize:12,fontWeight:700,color:mode===m?'#fff':'#bbb',cursor:'pointer',fontFamily:'inherit'}}>{m==='login'?'로그인':'계정 등록'}</button>))}

function BehaviorStudentList({user,onSelect,onBack}){
  const [students,setStudents]=useState(null),[loading,setLoading]=useState(true);
  const [countMap,setCountMap]=useState({});
  const hc=user.homeroomClass||'';

  useEffect(()=>{
    if(hc){
      callAPI({action:'getStudentsByClass',classCode:hc}).then(r=>{
        const list=r.students||[];
        setStudents(list);
        // 각 학생의 행동특성 기록 건수 조회
        Promise.all(list.map(s=>{
          const sid=s.studentId||s.grade+s.classNum+String(s.number).padStart(2,'0');
          return callAPI({action:'getRecords',studentId:sid}).then(res=>{
            const cnt=(res.records||[]).filter(rec=>rec.categoryId==='behavior').length;
            return[sid,cnt];
          }).catch(()=>[sid,0]);
        })).then(results=>{
          const map={};
          results.forEach(([sid,cnt])=>{map[sid]=cnt;});
          setCountMap(map);
          setLoading(false);
        });
      }).catch(()=>setLoading(false));
    }else setLoading(false);
  },[]);

  const g=hc[0]||'',cls=hc.slice(1)||'';

  return(<div style={{background:'#e8eaf6',minHeight:'100%',paddingBottom:20}}>
    <div style={{background:'linear-gradient(135deg,#3949ab,#5c6bc0)',padding:'28px 20px 42px',position:'relative',overflow:'hidden'}}>
      <div style={{position:'absolute',bottom:-1,left:0,right:0,lineHeight:0,zIndex:2}}><svg viewBox="0 0 390 40" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" style={{display:'block',width:'100%'}}><path d="M0,0 C80,38 180,42 280,28 C340,20 370,14 390,12 L390,40 L0,40 Z" fill="#e8eaf6"/></svg></div>
      <div style={{position:'relative',zIndex:3}}>
        <button onClick={onBack} style={{display:'inline-flex',alignItems:'center',gap:5,background:'rgba(255,255,255,0.15)',border:'1px solid rgba(255,255,255,0.25)',borderRadius:20,padding:'5px 12px',height:26,fontSize:11,color:'rgba(255,255,255,0.9)',fontWeight:500,cursor:'pointer',fontFamily:'inherit',marginBottom:16}}><svg width="11" height="11" fill="none" stroke="rgba(255,255,255,0.9)" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7"/></svg>홈으로</button>
        <p style={{fontSize:22,fontWeight:900,color:'white',margin:'0 0 3px'}}>행동특성 및 종합의견</p>
        <p style={{fontSize:11,color:'rgba(255,255,255,0.65)',margin:0}}>{g}학년 {cls}반 · {(students||[]).length}명</p>
      </div>
    </div>

      {loading&&<p style={{textAlign:'center',color:'#ccc',padding:20}}>불러오는 중...</p>}
      {!loading&&(students||[]).length===0&&<div style={{background:'white',borderRadius:14,padding:24,textAlign:'center',color:'#ccc'}}>학생이 없습니다</div>}
      {(students||[]).map(s=>{
        const sid=s.studentId||s.grade+s.classNum+String(s.number).padStart(2,'0');
        const cnt=countMap[sid]||0;
        return(<button key={sid} onClick={()=>onSelect({id:sid,name:s.name})} className="active-btn" style={{background:'white',borderRadius:14,padding:'11px 14px',display:'flex',alignItems:'center',gap:12,textAlign:'left',width:'100%',border:'1.5px solid #c5cae9',cursor:'pointer',marginBottom:7}}>
          <div style={{width:34,height:34,background:'linear-gradient(135deg,#e8eaf6,#c5cae9)',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:900,color:'#3949ab',flexShrink:0}}>{s.name[0]}</div>
          <span style={{fontSize:12,color:'#bbb',fontWeight:700,width:30,flexShrink:0}}>{s.number}번</span>
          <span style={{flex:1,fontSize:14,fontWeight:800,color:'#1a1a2e'}}>{s.name}</span>
          {cnt>0?
            <span style={{fontSize:11,fontWeight:700,background:'#e8eaf6',color:'#3949ab',padding:'3px 9px',borderRadius:8}}>관찰기록 {cnt}건</span>
            :<span style={{fontSize:11,fontWeight:600,color:'#ccc',padding:'3px 9px',borderRadius:8,border:'1px solid #eee'}}>기록 없음</span>
          }
          <svg width="11" height="11" fill="none" stroke="#ccc" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M9 5l7 7-7 7"/></svg>
        </button>);
      })}
    </div>
  </div>);
}

  const [isDesktop,setIsDesktop]=useState(window.innerWidth>500);
  const [subjectRecords,setSubjectRecords]=useState(null);

  useEffect(()=>{const h=()=>setIsDesktop(window.innerWidth>500);window.addEventListener('resize',h);return()=>window.removeEventListener('resize',h);},[]);

  // 새로고침 방지: pull-to-refresh 차단
  

  const fetchRecords=useCallback(async(u)=>{if(!u)return;setLoading(true);try{const isS=u.role==='student';let p;if(isS)p={action:'getRecords',studentId:u.studentId};else{let sc=[];if(u.assignments){try{sc=JSON.parse(u.assignments).flatMap(a=>a.classes);}catch(e){}}p={action:'getAllRecords',role:u.role,grade:u.grade||'',classNum:u.classNum||'',homeroomClass:u.homeroomClass||'',subjectClasses:sc,studentId:u.studentId};}const res=await callAPI(p);if(res.success)setRecords(res.records||[]);}catch(e){}setLoading(false);},[]);

  const login=u=>{setUser(u);saveSession({role:u.role,user:u});fetchRecords(u);};

  // 세션 복원 시 records 로드
  useEffect(()=>{if(user&&records.length===0)fetchRecords(user);},[user]);

  const goBackToRole=()=>{try{if(user)localStorage.removeItem(`autologin_${user.role}`);}catch(e){}setUser(null);setRole(null);setRecords([]);setView('home');setCatId(null);setSubject(null);setWriting(false);setEditing(null);setSelStudent(null);setSelAssignment(null);setSelClass(null);clearSession();};
  const logout=()=>goBackToRole();

  const saveRec=async(data)=>{try{const r=await callAPI({action:'saveRecord',record:{...data,studentId:user.studentId,name:user.name}});if(r.success){await fetchRecords(user);setWriting(false);setEditing(null);}else alert(r.message);}catch(e){alert('저장 실패');}};
  const updateRec=async(data)=>{try{const r=await callAPI({action:'updateRecord',record:{...data,studentId:user.studentId,name:user.name}});if(r.success){await fetchRecords(user);setWriting(false);setEditing(null);}else alert(r.message);}catch(e){alert('수정 실패');}};
  const deleteRec=async(id)=>{if(!confirm('삭제할까요?'))return;try{await callAPI({action:'deleteRecord',recordId:id,studentId:user.studentId});fetchRecords(user);}catch(e){alert('삭제 실패');}};

  const dH=isDesktop?Math.min(window.innerHeight*0.92,900):null,dW=isDesktop?Math.round(dH*(430/844)):null;
  const cs={width:isDesktop?dW:'100%',maxWidth:isDesktop?dW:430,margin:isDesktop?`${window.innerHeight*0.04}px auto`:0,background:'white',height:isDesktop?dH:'auto',minHeight:isDesktop?dH:'100dvh',display:'flex',flexDirection:'column',position:'relative',overflow:'visible',boxShadow:isDesktop?'0 30px 80px rgba(206,147,216,0.4)':'none',borderRadius:isDesktop?44:0};

  if(!role)return<div style={cs}><RoleScreen onSelect={setRole}/></div>;
  if(!user)return<div style={cs}><LoginScreen role={role} onLogin={login} onBack={()=>setRole(null)}/></div>;

  const isStudent=user.role==='student',isTeacher=user.role==='teacher',isCareer=user.role==='career';
  const phoneBg=ROLE_PHONE_BG[user.role]||'#f7f0f2';

  return(<div style={cs}>
    <div style={{background:'white',borderBottom:'1px solid #f8e8f0',padding:'0 20px',height:52,display:'flex',alignItems:'center',position:'sticky',top:0,zIndex:30,boxShadow:'0 1px 10px rgba(206,147,216,0.1)'}}>
      <h1 style={{flex:1,textAlign:'center',fontSize:15,fontWeight:900,color:'#1a1a2e',margin:0}}>창체 다이어리</h1>
      <button onClick={logout} style={{position:'absolute',right:16,background:'#fce4ec',border:'none',color:'#c2185b',fontSize:11,fontWeight:700,padding:'5px 11px',borderRadius:18,cursor:'pointer'}}>로그아웃</button>
    </div>
    <div className="no-scrollbar" style={{flex:1,overflowY:'scroll',minHeight:0,background:phoneBg,height:0}}>
      {isStudent&&view==='home'&&!catId&&<StudentHome user={user} records={records} loading={loading} onCat={id=>{setCatId(id);setView('cat');}} onBack={goBackToRole}/>}
      {isStudent&&view==='cat'&&catId!=='subject'&&catId!=='club'&&!writing&&<RecordList catId={catId} records={records} onBack={()=>{setCatId(null);setView('home');}} onWrite={()=>setWriting(true)} onDelete={deleteRec} onEdit={r=>{setEditing(r);setWriting(true);}}/>}
      {isStudent&&view==='cat'&&catId!=='subject'&&catId!=='club'&&writing&&<WriteForm catId={catId} editing={editing} onSave={editing?updateRec:saveRec} onCancel={()=>{setWriting(false);setEditing(null);}}/>}
      {isStudent&&view==='cat'&&catId==='subject'&&!subject&&<SubjectList user={user} records={records} onSelect={s=>setSubject(s)} onBack={()=>{setCatId(null);setView('home');}}/>}
      {isStudent&&view==='cat'&&catId==='subject'&&subject&&!writing&&<SubjectRecords subject={subject} records={records} onBack={()=>setSubject(null)} onWrite={()=>setWriting(true)} onDelete={deleteRec} onEdit={r=>{setEditing(r);setWriting(true);}}/>}
      {isStudent&&view==='cat'&&catId==='subject'&&subject&&writing&&<SubjectForm subject={subject} editing={editing} onSave={editing?updateRec:saveRec} onCancel={()=>{setWriting(false);setEditing(null);}}/>}
      {isStudent&&view==='cat'&&catId==='club'&&!subject&&<ClubList user={user} records={records} onSelect={s=>setSubject(s)} onBack={()=>{setCatId(null);setView('home');}}/>}
      {isStudent&&view==='cat'&&catId==='club'&&subject&&!writing&&<ClubRecords club={subject} records={records} onBack={()=>{setSubject(null);setCatId(null);setView('home');}} onWrite={()=>setWriting(true)} onDelete={deleteRec} onEdit={r=>{setEditing(r);setWriting(true);}} onChangeClub={()=>{try{localStorage.removeItem('selectedClub_'+user.studentId);}catch(e){}setSubject(null);}}/>}
      {isStudent&&view==='cat'&&catId==='club'&&subject&&writing&&<ClubForm club={subject} editing={editing} onSave={editing?updateRec:saveRec} onCancel={()=>{setWriting(false);setEditing(null);}}/>}

      {(isTeacher||isCareer)&&view==='home'&&<TeacherHome user={user} records={records} onSelectStudent={()=>setView('students')} onViewReports={()=>setView('reports')} onSubjectHome={()=>{setView('subjectHome');let sc=[];if(user.assignments){try{sc=JSON.parse(user.assignments).flatMap(a=>a.classes);}catch(e){}}callAPI({action:'getAllRecords',role:'subject',grade:'',classNum:'',homeroomClass:'',subjectClasses:sc,studentId:user.studentId}).then(res=>{if(res.success)setSubjectRecords(res.records||[]);});}} onAddSubject={()=>setView('addSubject')} onMyReports={()=>setView('myReports')} onClubReports={()=>setView('clubReports')} onBehavior={()=>setView('behavior')} onClubHome={()=>{setView('clubHome');callAPI({action:'getAllRecords',role:'club',grade:'',classNum:'',homeroomClass:'',subjectClasses:[],studentId:user.studentId,club:user.club||''}).then(res=>{if(res.success)setSubjectRecords(res.records||[]);});}} onBack={goBackToRole}/>}
      {(isTeacher||isCareer)&&view==='students'&&!selStudent&&<StudentList user={user} records={records} onSelect={s=>{setSelStudent(s);setView('ai');}} onBack={()=>setView('home')}/>}
      {(isTeacher||isCareer)&&view==='ai'&&selStudent&&<AIReport student={selStudent} user={user} onBack={()=>{setSelStudent(null);setView('students');}}/>}
      {(isTeacher||isCareer)&&view==='reports'&&<ReportList user={user} onBack={()=>setView('home')}/>}

      {isTeacher&&view==='myReports'&&<MyReportList user={user} onBack={()=>setView('home')}/>}
      {isTeacher&&view==='addSubject'&&<AddSubjectOnly onDone={async(nd)=>{let ex=[];try{ex=user.assignments?JSON.parse(user.assignments):[];}catch(e){}const ni=JSON.parse(nd);const mg=[...ex];ni.forEach(n=>{const idx=mg.findIndex(e=>e.subject===n.subject);if(idx>=0)mg[idx]={...mg[idx],classes:[...new Set([...mg[idx].classes,...n.classes])].sort()};else mg.push(n);});const ms=JSON.stringify(mg);const res=await callAPI({action:'updateTeacherAssignments',teacherId:user.studentId,assignments:ms});if(res.success){const u2={...user,assignments:ms};setUser(u2);saveSession({role:u2.role,user:u2});fetchRecords(u2);}setView('home');}} onBack={()=>setView('home')}/>}
      {isTeacher&&view==='subjectHome'&&!selAssignment&&<SubjectTeacherHome user={user} records={subjectRecords||[]} onSelectSubject={a=>{setSelAssignment(a);setView('classes');}} onAddSubject={()=>setView('addSubject')} onDeleteSubject={async(a)=>{if(!confirm(`"${a.subject}" 과목을 삭제할까요?`))return;let ex=[];try{ex=user.assignments?JSON.parse(user.assignments):[];}catch(e){}const mg=ex.filter(e=>e.subject!==a.subject);const ms=JSON.stringify(mg);const res=await callAPI({action:'updateTeacherAssignments',teacherId:user.studentId,assignments:ms});if(res.success){const u2={...user,assignments:ms};setUser(u2);saveSession({role:u2.role,user:u2});fetchRecords(u2);}}} onBack={()=>setView('home')}/>}
      {isTeacher&&view==='classes'&&selAssignment&&!selClass&&<SubjectClassList assignment={selAssignment} records={subjectRecords||records} onSelect={cls=>{setSelClass(cls);setView('students2');}} onBack={()=>{setSelAssignment(null);setView('subjectHome');}}/>}
      {isTeacher&&view==='students2'&&selClass&&!selStudent&&<SubjectStudentList assignment={selAssignment} classCode={selClass} records={subjectRecords||records} onSelect={s=>{setSelStudent(s);setView('detail');}} onBack={()=>{setSelClass(null);setView('classes');}}/>}
      {isTeacher&&view==='detail'&&selStudent&&<SubjectStudentDetail student={selStudent} user={user} records={subjectRecords||records} onBack={()=>{setSelStudent(null);setView('students2');}}/>}
      {isTeacher&&view==='clubHome'&&!selStudent&&<ClubStudentList user={user} records={subjectRecords||[]} onSelect={s=>{setSelStudent(s);setView('clubDetail');}} onBack={()=>setView('home')}/>}
      {isTeacher&&view==='clubDetail'&&selStudent&&<ClubStudentDetail student={selStudent} user={user} records={subjectRecords||[]} onBack={()=>{setSelStudent(null);setView('clubHome');}}/>}
      {isTeacher&&view==='clubReports'&&<ClubReportList user={user} onBack={()=>setView('home')}/>}
      {isTeacher&&view==='behavior'&&!selStudent&&<BehaviorStudentList user={user} onSelect={s=>{setSelStudent(s);setView('behaviorDetail');}} onBack={()=>setView('home')}/>}
      {isTeacher&&view==='behaviorDetail'&&selStudent&&<BehaviorDetail student={selStudent} user={user} onBack={()=>{setSelStudent(null);setView('behavior');}}/>}
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
