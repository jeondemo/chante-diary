/* ── 안전한 바이트 조정 함수 (무한루프 방지) ── */
function adjustToByteRange(text, min=1400, max=1500) {
  const enc = new TextEncoder();
  if (!text || typeof text !== 'string') return text || '';
  
  let r = text.trim()
    .replace(/^(이\s*)?학생은\s*/, '')
    .replace(/^해당\s*학생은\s*/, '');
  
  let bytes = enc.encode(r).length;
  
  // 이미 범위 안이면 바로 반환
  if (bytes >= min && bytes <= max) return r;
  
  // 너무 길면 줄이기 (최대 200회 시도)
  if (bytes > max) {
    const ends = ['함.','임.','음.','됨.','보임.','나타냄.'];
    let attempts = 0;
    const maxAttempts = 200;
    
    while (enc.encode(r).length > max && attempts < maxAttempts) {
      attempts++;
      
      // 너무 짧아지면 강제 종료
      if (r.length < 10) break;
      
      // 마지막 문장 종결 패턴 찾기
      let lastPos = -1;
      for (const e of ends) {
        const idx = r.lastIndexOf(e);
        if (idx > lastPos && idx < r.length - e.length) lastPos = idx;
      }
      
      if (lastPos > 0) {
        // 종결 패턴 뒤에서 자르기
        const endPattern = ends.find(e => r.indexOf(e, lastPos) === lastPos);
        r = r.slice(0, lastPos + (endPattern ? endPattern.length : 2)).trim();
      } else {
        // 종결 패턴이 없으면 마지막 마침표에서 자르기
        const lastDot = r.lastIndexOf('.');
        if (lastDot > r.length * 0.5) {
          r = r.slice(0, lastDot + 1).trim();
        } else {
          // 최후의 수단: 뒤에서 20바이트씩 제거
          const chars = Math.ceil(20 / 3); // 한글 ~3바이트
          r = r.slice(0, -chars).trim();
        }
      }
    }
  }
  
  return r;
}

const GAS_URL = 'https://script.google.com/macros/s/AKfycbwGWlTMoZh-3RUH4fPn_ibxuJht-bGcBww64XPOfrETc-0jD-GG91OJxLdgUjEE2p8Q/exec';

function callAPI(payload) {
  return fetch(GAS_URL, {
    method: 'POST',
    redirect: 'follow',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  }).then(r => {
    if (!r.ok) {
      return r.text().then(t => {
        throw new Error('HTTP ' + r.status + ': ' + t.substring(0, 100));
      });
    }
    return r.json();
  });
}

/* AI 전용 호출: 프론트엔드 재시도 포함 */
async function callAIWithRetry(text, onProgress) {
  const MAX_ATTEMPTS = 5;
  const DELAYS = [0, 3000, 5000, 8000, 12000]; // 첫 시도는 즉시, 이후 3→5→8→12초 대기
  
  for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
    // 대기
    if (DELAYS[attempt] > 0) {
      const sec = Math.round(DELAYS[attempt] / 1000);
      if (onProgress) onProgress(`재시도 ${attempt}/${MAX_ATTEMPTS-1}... (${sec}초 대기 중)`);
      await new Promise(r => setTimeout(r, DELAYS[attempt]));
    } else {
      if (onProgress) onProgress('AI 생성 요청 중...');
    }
    
    try {
      const res = await callAPI({action: 'generateAI', text: text});
      
      // 성공
      if (res.success && res.content) {
        return res;
      }
      
      // 503/과부하 관련 메시지 → 재시도
      const msg = (res.message || '').toLowerCase();
      const is503 = msg.includes('503') || msg.includes('unavailable') || msg.includes('high demand') || msg.includes('overloaded');
      
      if (is503 && attempt < MAX_ATTEMPTS - 1) {
        if (onProgress) onProgress(`서버 과부하 (시도 ${attempt+1}/${MAX_ATTEMPTS}), 잠시 후 재시도...`);
        continue; // 다음 시도
      }
      
      // 503이 아닌 다른 에러 또는 마지막 시도
      return res;
      
    } catch (e) {
      if (attempt < MAX_ATTEMPTS - 1) {
        if (onProgress) onProgress(`통신 오류 (시도 ${attempt+1}/${MAX_ATTEMPTS}), 재시도 중...`);
        continue;
      }
      throw e;
    }
  }
  
  return { success: false, message: '서버가 계속 과부하 상태입니다. 잠시 후 다시 시도해 주세요.' };
}

function LoginScreen({role,onLogin,onBack}){
  const isStudent=role==='student', isHomeroom=role==='homeroom', isSubject=role==='subject';
  const [mode,setMode]=useState('login');
  const [id,setId]=useState(''), [name,setName]=useState(''), [pw,setPw]=useState('');
  const [match,setMatch]=useState(null), [loading,setLoading]=useState(false), [checking,setChecking]=useState(false);

  if(isSubject && mode==='register') return <SubjectRegister onDone={onLogin} onBack={()=>setMode('login')}/>;

  const checkName = async()=>{
    if(mode!=='register'||!name.trim()) return;
    setChecking(true); setMatch(null);
    try{
      if(isHomeroom){
        const r=await callAPI({action:'lookupTeacher',name:name.trim()});
        setMatch(r.success?r:false);
      } else if(isStudent && id.trim().length===4){
        const r=await callAPI({action:'lookupStudent',studentId:id.trim(),name:name.trim()});
        setMatch(r.success?true:false);
      }
    }catch(e){setMatch(false);}
    setChecking(false);
  };

  const submit = async(e)=>{
    e.preventDefault();
    if(!id.trim()||!pw.trim()) return alert('입력해주세요!');
    if(mode==='register'&&!name.trim()) return alert('이름을 입력해주세요!');
    if(mode==='register'&&isHomeroom&&!match) return alert('이름 확인이 필요합니다!');
    if(mode==='register'&&isStudent&&!match) return alert('학번과 이름이 일치하지 않습니다!');
    setLoading(true);
    try{
      const isTeacher=(role==='homeroom'||role==='subject'||role==='career');
      const action=mode==='login'?'login':(isTeacher?'registerTeacher':'register');
      const payload=mode==='login'
        ?{action,studentId:id.trim(),password:pw,role}
        :isTeacher
          ?{action,teacherId:id.trim(),name:name.trim(),password:pw,role,grade:match?.grade||'',classNum:match?.classNum||'',assignments:''}
          :{action,studentId:id.trim(),name:name.trim(),password:pw,role,homeroomClass:''};
      const res=await callAPI(payload);
      if(res.success){
        const hc=isHomeroom&&match?match.homeroomClass:'';
        onLogin({studentId:id.trim(),name:mode==='login'?res.name:name.trim(),role,homeroomClass:res.homeroomClass||hc,assignments:res.assignments||''});
      } else alert(res.message||'오류가 발생했습니다.');
    }catch(e){alert('서버 오류');}
    setLoading(false);

/* ── 교과목교사 등록 ── */
function SubjectRegister({onDone,onBack}){
  const [code,setCode]=useState(''), [verified,setVerified]=useState(false), [checking,setChecking]=useState(false), [codeErr,setCodeErr]=useState('');
  const [id,setId]=useState(''), [name,setName]=useState(''), [pw,setPw]=useState(''), [loading,setLoading]=useState(false);
  const [subjects,setSubjects]=useState({});
  const [assigns,setAssigns]=useState([{grade:'1',subject:'',classes:new Set()}]);

  useEffect(()=>{
    callAPI({action:'getSubjectList'}).then(r=>{if(r.success)setSubjects(r.subjects||{});}).catch(()=>{});
  },[]);

  const checkCode=async()=>{
    if(!code.trim()) return setCodeErr('코드를 입력하세요.');
    setChecking(true); setCodeErr('');
    try{const r=await callAPI({action:'checkTeacherCode',code:code.trim()});
      if(r.success) setVerified(true);
      else setCodeErr(r.message||'코드가 틀렸습니다.');
    }catch(e){setCodeErr('서버 오류');}
    setChecking(false);
  };

  const toggle=(idx,cls)=>setAssigns(prev=>prev.map((a,i)=>{
    if(i!==idx) return a;
    const s=new Set(a.classes); s.has(cls)?s.delete(cls):s.add(cls); return {...a,classes:s};
  }));

  const submit=async(e)=>{
    e.preventDefault();
    if(!id||!name||!pw) return alert('모든 항목을 입력하세요!');
    if(!assigns.every(a=>a.subject&&a.classes.size>0)) return alert('담당 학급을 선택하세요!');
    setLoading(true);
    try{
      const data=assigns.map(a=>({subject:a.subject,classes:[...a.classes].sort()}));
      const r=await callAPI({action:'registerTeacher',teacherId:id.trim(),name:name.trim(),password:pw,role:'subject',grade:'',classNum:'',assignments:JSON.stringify(data)});
      if(r.success){alert('등록 완료!'); onDone({studentId:id.trim(),name:name.trim(),role:'subject',homeroomClass:'',assignments:JSON.stringify(data)});}
      else alert(r.message||'오류');
    }catch(e){alert('서버 오류');}
    setLoading(false);
  };

  return(
    <div style={{flex:1,background:'linear-gradient(160deg,#fce4ec,#f3e5f5,#e8eaf6)',padding:'20px',overflowY:'auto'}}>
      <div className="card fade-up" style={{maxWidth:380,margin:'0 auto',padding:24}}>
        <button onClick={onBack} style={{background:'none',border:'none',color:'#999',cursor:'pointer',marginBottom:12,display:'flex',alignItems:'center',gap:4,fontSize:13}}><Back/>돌아가기</button>
        <h2 style={{fontSize:18,fontWeight:900,color:'#1a1a2e',margin:'0 0 20px'}}>📚 교과목교사 등록</h2>
        {!verified?(
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            <input className="input" type="password" placeholder="교사 인증코드" value={code} onChange={e=>setCode(e.target.value)} onKeyDown={e=>e.key==='Enter'&&checkCode()}/>
            {codeErr&&<p style={{fontSize:11,color:'#e53935',margin:0}}>❌ {codeErr}</p>}
            <button onClick={checkCode} className="btn-pink" disabled={checking}>{checking?<Spin/>:'인증 확인'}</button>
          </div>
        ):(
          <form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:12}}>
            <div style={{background:'#e8f5e9',borderRadius:10,padding:'8px 12px',fontSize:12,color:'#2e7d32',fontWeight:700}}>✅ 인증 완료</div>
            <input className="input" type="text" placeholder="아이디" value={id} onChange={e=>setId(e.target.value)}/>
            <input className="input" type="text" placeholder="이름" value={name} onChange={e=>setName(e.target.value)}/>
            <input className="input" type="password" placeholder="비밀번호" value={pw} onChange={e=>setPw(e.target.value)}/>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <p style={{fontSize:13,fontWeight:800,color:'#1a1a2e',margin:0}}>담당 과목</p>
              <button type="button" onClick={()=>setAssigns(p=>[...p,{grade:'1',subject:'',classes:new Set()}])} style={{background:'#ede7f6',color:'#7c3aed',border:'none',borderRadius:12,padding:'4px 10px',fontSize:12,fontWeight:700,cursor:'pointer'}}>+ 추가</button>
            </div>
            {assigns.map((a,idx)=>(
              <div key={idx} style={{background:'#fafafa',borderRadius:14,padding:14,border:'1px solid #f3e5f5'}}>
                {assigns.length>1&&<button type="button" onClick={()=>setAssigns(p=>p.filter((_,i)=>i!==idx))} style={{float:'right',background:'none',border:'none',color:'#ccc',cursor:'pointer',fontSize:16}}>✕</button>}
                <p style={{fontSize:11,color:'#999',margin:'0 0 6px',fontWeight:700}}>학년</p>
                <div style={{display:'flex',gap:6,marginBottom:10}}>
                  {['1','2','3'].map(g=>(
                    <button type="button" key={g} onClick={()=>setAssigns(p=>p.map((x,i)=>i===idx?{...x,grade:g,subject:'',classes:new Set()}:x))}
                      style={{flex:1,padding:'7px 0',borderRadius:10,border:'none',fontWeight:800,fontSize:13,cursor:'pointer',background:a.grade===g?'#8b5cf6':'#eee',color:a.grade===g?'white':'#666'}}>{g}학년</button>
                  ))}
                </div>
                <p style={{fontSize:11,color:'#999',margin:'0 0 6px',fontWeight:700}}>과목</p>
                <select value={a.subject} onChange={e=>setAssigns(p=>p.map((x,i)=>i===idx?{...x,subject:e.target.value}:x))}
                  style={{width:'100%',padding:'8px 12px',borderRadius:10,border:'1.5px solid #e9d5ff',background:'white',fontSize:13,fontWeight:700,marginBottom:10,outline:'none'}}>
                  <option value="">과목 선택</option>
                  {(subjects[a.grade]||[]).map(s=><option key={s} value={s}>{s}</option>)}
                </select>
                <p style={{fontSize:11,color:'#999',margin:'0 0 6px',fontWeight:700}}>담당 학급</p>
                <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                  {Array.from({length:CLASS_COUNT[a.grade]||5},(_,i)=>{
                    const cls=a.grade+String(i+1);
                    const sel=a.classes.has(cls);
                    return<button type="button" key={cls} onClick={()=>toggle(idx,cls)} style={{padding:'5px 12px',borderRadius:20,border:'none',fontSize:12,fontWeight:800,cursor:'pointer',background:sel?'#8b5cf6':'#eee',color:sel?'white':'#666'}}>{i+1}반</button>;
                  })}
                </div>
              </div>
            ))}
            <button type="submit" className="btn-pink" disabled={loading}>{loading?<Spin/>:'등록하고 시작'}</button>
          </form>
        )}
      </div>
    </div>
  );
}

function SubjectForm({subject,editing,onSave,onCancel}){

  const [loading,setLoading]=useState(false);
  const submit=async e=>{
    e.preventDefault();
    if(!unit||!learned) return alert('단원과 배운점은 필수입니다!');
    setLoading(true);
    await onSave(editing?{...editing,date,unit,inquiry,learned,reflection}:{categoryId:'subject',date,subject:subject.subject,unit,inquiry,learned,reflection});
    setLoading(false);
  };

          <div><p style={{fontSize:11,color:'#999',fontWeight:700,margin:'0 0 4px'}}>단원/주제 *</p><input className="input" type="text" placeholder="예: 3단원 - 에너지와 환경" value={unit} onChange={e=>setUnit(e.target.value)}/></div>

          <div><p style={{fontSize:11,color:'#999',fontWeight:700,margin:'0 0 4px'}}>배운점 *</p><textarea className="input" rows="3" placeholder="배운점을 기록하세요" value={learned} onChange={e=>setLearned(e.target.value)} style={{resize:'none'}}/></div>
          <div><p style={{fontSize:11,color:'#999',fontWeight:700,margin:'0 0 4px'}}>느낀점</p><textarea className="input" rows="3" placeholder="느낀점을 기록하세요" value={reflection} onChange={e=>setReflection(e.target.value)} style={{resize:'none'}}/></div>

/* ── AI 생기부 (담임/진로) ── */
function AIReport({student,onBack}){
  const [recs,setRecs]=useState([]), [loading,setLoading]=useState(true);
  const [sel,setSel]=useState(new Set()), [result,setResult]=useState(''), [generating,setGenerating]=useState(false), [saving,setSaving]=useState(false), [errMsg,setErrMsg]=useState('');
  const [progress,setProgress]=useState('');
  useEffect(()=>{
    callAPI({action:'getRecords',studentId:student.id}).then(r=>{setRecs(r.records||[]);setLoading(false);}).catch(()=>setLoading(false));
  },[]);
  const generate=async()=>{
    if(!sel.size) return alert('기록을 선택하세요!');
    setGenerating(true); setResult(''); setErrMsg(''); setProgress('AI 생성 요청 중...');
    const text=recs.filter(r=>sel.has(r.id)).map(r=>r.categoryId==='subject'?`[${r.subject}]${r.unit} 탐구:${r.inquiry} 배움:${r.learned} 느낌:${r.reflection}`:`[${r.categoryId==='career'?'진로':'창체'}]${r.title}: ${r.content}`).join('\n');
    try{
      const res=await callAIWithRetry(text, (msg)=>setProgress(msg));
      if(res.success) {
        setResult(adjustToByteRange(res.content||''));
      } else {
        setErrMsg(res.message||'AI 생성 실패');
      }
    }catch(e){setErrMsg('서버 오류: '+e.message);}
    setProgress('');
    setGenerating(false);
  };
  const save=async()=>{
    if(!result) return;
    setSaving(true);
    try{
      await callAPI({action:'saveReport',studentId:student.id,name:student.name,content:result,savedAt:new Date().toLocaleString()});
      alert('저장됐습니다!');
    }catch(e){alert('저장 실패');}
    setSaving(false);
  };
  return(
    <div style={{paddingBottom:20}}>
      <div style={{background:'linear-gradient(135deg,#f48fb1,#ce93d8)',padding:'20px 16px 28px'}}>
        <button onClick={onBack} style={{background:'rgba(255,255,255,0.2)',border:'none',color:'white',borderRadius:20,padding:'5px 12px',fontSize:12,fontWeight:700,cursor:'pointer',marginBottom:12,display:'flex',alignItems:'center',gap:4}}><Back/> 학생 목록</button>
        <h2 style={{fontSize:18,fontWeight:900,color:'white',margin:0}}>{student.name}</h2>
        <p style={{fontSize:12,color:'rgba(255,255,255,0.8)',margin:'4px 0 0'}}>{student.id}</p>
      </div>
      <div style={{padding:'12px 14px'}}>
        {result&&(
          <div style={{background:'#e8f5e9',borderRadius:14,padding:16,marginBottom:12}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
              <span style={{fontSize:12,fontWeight:800,color:'#2e7d32'}}>✨ AI 생기부</span>
              <span style={{fontSize:11,color:'#999'}}>{new TextEncoder().encode(result).length} bytes</span>
            </div>
            <p style={{fontSize:13,color:'#333',lineHeight:1.7,margin:'0 0 10px'}}>{result}</p>
            <div style={{display:'flex',gap:8}}>
              <button onClick={()=>navigator.clipboard.writeText(result)} style={{flex:1,background:'#f5f5f5',border:'none',borderRadius:10,padding:'8px 0',fontSize:12,fontWeight:700,cursor:'pointer'}}>복사</button>
              <button onClick={save} disabled={saving} className="btn-pink" style={{flex:2,padding:'8px 0',fontSize:12}}>{saving?<Spin/>:'저장하기'}</button>
            </div>
          </div>
        )}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
          <p style={{fontSize:13,fontWeight:800,color:'#1a1a2e',margin:0}}>기록 선택 ({sel.size}개)</p>
          <button onClick={generate} disabled={generating||!sel.size} className="btn-pink" style={{padding:'7px 14px',width:'auto',fontSize:12}}>
            {generating?'⏳ 생성 중':'AI 생성'}
          </button>
        </div>
        {/* 진행 상태 */}
        {generating&&progress&&(
          <div style={{background:'#e3f2fd',borderRadius:12,padding:'10px 14px',marginBottom:8,fontSize:12,color:'#1565c0',fontWeight:700,lineHeight:1.5,display:'flex',alignItems:'center',gap:8}}>
            <Spin/> {progress}
          </div>
        )}
        {errMsg&&<div style={{background:'#fce4ec',borderRadius:12,padding:'10px 14px',marginBottom:8,fontSize:12,color:'#c2185b',fontWeight:700,lineHeight:1.5}}>❌ {errMsg}</div>}
        {loading&&<p style={{color:'#ccc',textAlign:'center'}}>불러오는 중...</p>}
        {recs.sort((a,b)=>new Date(b.date)-new Date(a.date)).map(r=>(
          <div key={r.id} onClick={()=>{const s=new Set(sel);s.has(r.id)?s.delete(r.id):s.add(r.id);setSel(s);}} className="card" style={{padding:'12px 14px',marginBottom:8,cursor:'pointer',border:sel.has(r.id)?'2px solid #f48fb1':'2px solid transparent',opacity:sel.has(r.id)?1:0.65}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
              <span style={{fontSize:10,background:'#fce4ec',color:'#c2185b',padding:'2px 7px',borderRadius:8,fontWeight:700}}>{r.categoryId==='subject'?r.subject:r.categoryId==='career'?'진로':'창체'}</span>
              <span style={{fontSize:10,color:'#ccc'}}>{r.date}</span>
            </div>
            <p style={{fontSize:13,fontWeight:700,color:'#1a1a2e',margin:0}}>{r.categoryId==='subject'?r.unit:r.title}</p>
          </div>
        ))}
      </div>
    </div>
  );
}

    'rgba(0,105,92,0.25)','rgba(230,81,0,0.25)','rgba(46,125,50,0.25)',
  ];
  const clsArrows=['#f48fb1','#ce93d8','#90caf9','#80cbc4','#ffcc80','#a5d6a7'];
  return(
    <div style={{background:'#f8f5ff',minHeight:'100%'}}>
      <div style={{background:'linear-gradient(135deg,#7c3aed,#a855f7,#ec4899)',padding:'26px 20px 44px',position:'relative',overflow:'hidden'}}>
        <div style={{position:'absolute',top:-20,right:-20,width:90,height:90,background:'rgba(255,255,255,0.1)',borderRadius:'50%'}}/>
        <div style={{position:'absolute',bottom:-30,left:-10,width:70,height:70,background:'rgba(255,255,255,0.08)',borderRadius:'50%'}}/>
        <button onClick={onBack} style={{background:'rgba(255,255,255,0.2)',border:'none',color:'white',borderRadius:20,padding:'5px 12px',fontSize:11,fontWeight:700,cursor:'pointer',marginBottom:14,display:'flex',alignItems:'center',gap:4}}><Back/> 과목 목록</button>
        <p style={{fontSize:11,color:'rgba(255,255,255,0.7)',fontWeight:600,letterSpacing:'0.1em',margin:'0 0 6px'}}>담당 반 목록</p>
        <p style={{fontSize:24,fontWeight:900,color:'white',margin:'0 0 4px'}}>{assignment.subject}</p>
        <p style={{fontSize:11,color:'rgba(255,255,255,0.7)',margin:0}}>{assignment.classes[0]?assignment.classes[0][0]+'학년':''} · {assignment.classes.length}개 학급</p>
      </div>
      <div style={{padding:'0 14px',marginTop:-20,position:'relative',zIndex:1,display:'flex',flexDirection:'column',gap:9}}>
        {assignment.classes.map((cls,i)=>{
          const g=cls[0], c=cls[1];
          const cnt=records.filter(r=>r.categoryId==='subject'&&String(r.subject||r.title||'')===assignment.subject&&String(r.studentId).startsWith(cls)).length;
          const hasRec=cnt>0;
          const ci=i%clsColors.length;
          return hasRec?(
            <div key={cls} onClick={()=>onSelect(cls)} className="cameleon-card active-btn"
              style={{background:'white',borderRadius:18,padding:'13px 16px',display:'flex',alignItems:'center',gap:12,cursor:'pointer',animationDelay:`${i*0.8}s`}}>
              <div style={{background:clsColors[ci],borderRadius:12,padding:'5px 12px',flexShrink:0,boxShadow:`0 4px 12px ${clsShadows[ci]}`}}>
                <span style={{fontSize:13,fontWeight:900,color:'white',whiteSpace:'nowrap'}}>{g}학년 {c}반</span>
              </div>
              <p style={{flex:1,fontSize:13,fontWeight:800,color:'#888',margin:0,textAlign:'center'}}>기록 <span style={{color:'#e91e63',fontWeight:900}}>{cnt}건</span></p>
              <svg width="13" height="13" fill="none" stroke={clsArrows[ci]} viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M9 5l7 7-7 7"/></svg>
            </div>
          ):(
            <div key={cls} onClick={()=>onSelect(cls)} className="active-btn"
              style={{background:'#f9f9f9',border:'1px solid #eee',borderRadius:18,padding:'13px 16px',display:'flex',alignItems:'center',gap:12,cursor:'pointer',opacity:0.55}}>
              <div style={{background:'#e0e0e0',borderRadius:12,padding:'5px 12px',flexShrink:0}}>
                <span style={{fontSize:13,fontWeight:900,color:'#aaa',whiteSpace:'nowrap'}}>{g}학년 {c}반</span>
              </div>
              <p style={{flex:1,fontSize:11,color:'#ccc',margin:0}}>기록 없음</p>
              <svg width="13" height="13" fill="none" stroke="#ddd" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M9 5l7 7-7 7"/></svg>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ── 교과목교사 학생 목록 ── */
function SubjectStudentList({assignment,classCode,records,onSelect,onBack}){
  const g=classCode[0], c=classCode[1];
  const filtered=records.filter(r=>r.categoryId==='subject'&&String(r.subject||'')===assignment.subject&&String(r.studentId).startsWith(classCode));
  const grouped={};
  filtered.forEach(r=>{if(!grouped[r.studentId])grouped[r.studentId]={name:r.name,recs:[]};grouped[r.studentId].recs.push(r);});
  const list=Object.entries(grouped).sort(([a],[b])=>Number(a)-Number(b));
  return(
    <div style={{paddingBottom:20}}>
      <div style={{background:'linear-gradient(135deg,#7e57c2,#5c6bc0)',padding:'20px 16px 28px'}}>
        <button onClick={onBack} style={{background:'rgba(255,255,255,0.2)',border:'none',color:'white',borderRadius:20,padding:'5px 12px',fontSize:12,fontWeight:700,cursor:'pointer',marginBottom:12,display:'flex',alignItems:'center',gap:4}}><Back/> 반 목록</button>
        <h2 style={{fontSize:18,fontWeight:900,color:'white',margin:0}}>{g}학년 {c}반 {assignment.subject}</h2>
      </div>
      <div style={{padding:'0 14px',marginTop:-12,display:'flex',flexDirection:'column',gap:6}}>
        {list.length===0&&<div className="card" style={{padding:24,textAlign:'center',color:'#ccc',marginTop:4}}>기록이 없습니다</div>}
        {list.map(([sid,{name,recs}])=>(
          <button key={sid} onClick={()=>onSelect({id:sid,name,subject:assignment.subject})} className="active-btn card" style={{padding:'10px 14px',display:'flex',alignItems:'center',gap:12,textAlign:'left',width:'100%',border:'none',cursor:'pointer'}}>
            <span style={{fontSize:12,color:'#bbb',fontWeight:700,width:36,flexShrink:0}}>{String(sid).slice(2)}번</span>
            <span style={{flex:1,fontSize:14,fontWeight:800,color:'#1a1a2e'}}>{name}</span>
            <span style={{fontSize:11,background:'#fce4ec',color:'#c2185b',padding:'2px 8px',borderRadius:8,fontWeight:700}}>{recs.length}건</span>
            <Arr/>
          </button>
        ))}
      </div>
    </div>
  );
}

/* ── 교과목교사 학생 상세 + AI (핵심 수정) ── */
function SubjectStudentDetail({student,records,onBack}){
  const recs=records.filter(r=>r.categoryId==='subject'&&String(r.subject||'')===student.subject&&String(r.studentId)===String(student.id)).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const [showAI,setShowAI]=useState(false), [result,setResult]=useState(''), [generating,setGenerating]=useState(false), [copied,setCopied]=useState(false), [saving,setSaving]=useState(false);
  const [errMsg,setErrMsg]=useState('');
  const [progress,setProgress]=useState('');

  const generate=async()=>{
    setGenerating(true); setResult(''); setErrMsg(''); setProgress('AI 생성 요청 중...');
    const text=recs.map(r=>`[${r.subject}]단원:${r.unit||''} 탐구:${r.inquiry||''} 배움:${r.learned||''} 느낌:${r.reflection||''}`).join('\n');
    try{
      const res=await callAIWithRetry(text, (msg)=>setProgress(msg));
      if(res.success && res.content) {
        setResult(adjustToByteRange(res.content));
        setProgress('');
      } else {
        setErrMsg(res.message || 'AI 생성 실패: 응답 내용 없음');
        setProgress('');
      }
    }catch(e){
      setErrMsg('서버 통신 오류: ' + (e.message || String(e)));
      setProgress('');
    }
    setGenerating(false);
  };

  const copy=()=>{navigator.clipboard.writeText(result);setCopied(true);setTimeout(()=>setCopied(false),2000);};
  const save=async()=>{
    if(!result) return;
    setSaving(true);
    try{
      const r=await callAPI({action:'saveReport',studentId:student.id,name:student.name,content:result,savedAt:new Date().toLocaleString()});
      if(r.success) alert('저장됐습니다! ✅');
      else alert('저장 실패: '+(r.message||'오류'));
    }catch(e){alert('저장 실패');}
    setSaving(false);
  };
  return(
    <div style={{paddingBottom:20}}>
      <div style={{background:'linear-gradient(135deg,#7e57c2,#5c6bc0)',padding:'20px 16px 28px'}}>
        <button onClick={onBack} style={{background:'rgba(255,255,255,0.2)',border:'none',color:'white',borderRadius:20,padding:'5px 12px',fontSize:12,fontWeight:700,cursor:'pointer',marginBottom:12,display:'flex',alignItems:'center',gap:4}}><Back/> 학생 목록</button>
        <h2 style={{fontSize:18,fontWeight:900,color:'white',margin:0}}>{student.name}</h2>
        <p style={{fontSize:12,color:'rgba(255,255,255,0.8)',margin:'4px 0 0'}}>{student.subject} · {recs.length}건</p>
      </div>
      <div style={{padding:'12px 14px',display:'flex',flexDirection:'column',gap:10}}>
        {!showAI?(
          <button onClick={()=>setShowAI(true)} style={{background:'linear-gradient(135deg,#4db6ac,#26a69a)',color:'white',border:'none',borderRadius:14,padding:'13px',fontSize:14,fontWeight:800,cursor:'pointer'}}>✨ AI 생기부 생성</button>
        ):(
          <div style={{background:'#e8f5e9',borderRadius:16,padding:16,border:'2px solid #4db6ac'}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:12}}>
              <p style={{fontSize:14,fontWeight:800,color:'#1b5e20',margin:0}}>✨ AI 생기부</p>
              <button onClick={()=>{setShowAI(false);setResult('');setErrMsg('');}} style={{background:'none',border:'none',color:'#aaa',cursor:'pointer',fontSize:12}}>닫기</button>
            </div>

            {/* 에러 메시지 표시 영역 */}
            {errMsg&&(
              <div style={{background:'#fce4ec',borderRadius:12,padding:'10px 14px',marginBottom:12,fontSize:12,color:'#c2185b',fontWeight:700,lineHeight:1.5,wordBreak:'break-all'}}>
                ❌ {errMsg}
              </div>
            )}

            {/* 진행 상태 표시 */}
            {generating&&progress&&(
              <div style={{background:'#e3f2fd',borderRadius:12,padding:'10px 14px',marginBottom:8,fontSize:12,color:'#1565c0',fontWeight:700,lineHeight:1.5,display:'flex',alignItems:'center',gap:8}}>
                <Spin/> {progress}
              </div>
            )}

            <button onClick={generate} disabled={generating} style={{width:'100%',background:generating?'#90a4ae':'linear-gradient(135deg,#4db6ac,#26a69a)',color:'white',border:'none',borderRadius:10,padding:'10px',fontSize:13,fontWeight:800,cursor:'pointer',marginBottom:result?12:0}}>
              {generating?'⏳ 생성 중 (과부하 시 자동 재시도)':`${recs.length}건으로 생기부 작성`}
            </button>
            {result&&(
              <>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
                  <span style={{fontSize:11,color:'#388e3c',fontWeight:700}}>{new TextEncoder().encode(result).length} bytes</span>
                </div>
                <p style={{fontSize:13,color:'#333',lineHeight:1.7,margin:'0 0 12px'}}>{result}</p>
                <div style={{display:'flex',gap:8}}>
                  <button onClick={copy} style={{flex:1,background:copied?'#43a047':'#f5f5f5',color:copied?'white':'#555',border:'none',borderRadius:10,padding:'9px 0',fontSize:12,fontWeight:700,cursor:'pointer'}}>{copied?'✅ 복사됨':'복사'}</button>
                  <button onClick={generate} disabled={generating} style={{flex:1,background:'linear-gradient(135deg,#7986cb,#5c6bc0)',color:'white',border:'none',borderRadius:10,padding:'9px 0',fontSize:12,fontWeight:800,cursor:'pointer'}}>{generating?<Spin/>:'🔄 재작성'}</button>
                  <button onClick={save} disabled={saving} style={{flex:1,background:'linear-gradient(135deg,#f48fb1,#ce93d8)',color:'white',border:'none',borderRadius:10,padding:'9px 0',fontSize:12,fontWeight:800,cursor:'pointer'}}>{saving?<Spin/>:'💾 저장'}</button>
                </div>
              </>
            )}
          </div>
        )}
        {recs.map(r=>(
          <div key={r.id} className="card" style={{padding:'14px 16px',borderLeft:'3px solid #7e57c2'}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
              <span style={{fontSize:11,background:'#ede7f6',color:'#512da8',padding:'2px 8px',borderRadius:8,fontWeight:700}}>{r.subject}</span>
              <span style={{fontSize:11,color:'#ccc'}}>{r.date}</span>
            </div>
            <p style={{fontSize:14,fontWeight:800,color:'#1a1a2e',margin:'0 0 6px'}}>{r.unit||'(단원없음)'}</p>
            {r.learned&&<p style={{fontSize:12,color:'#666',margin:0,lineHeight:1.5}}>{r.learned}</p>}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── 메인 앱 ── */
function App(){
  const [role,setRole]=useState(null);
  const [user,setUser]=useState(null);
  const [records,setRecords]=useState([]);
  const [loading,setLoading]=useState(false);
  const [view,setView]=useState('home');
  const [catId,setCatId]=useState(null);
  const [subject,setSubject]=useState(null);
  const [writing,setWriting]=useState(false);
  const [editing,setEditing]=useState(null);
  const [selStudent,setSelStudent]=useState(null);
  const [selAssignment,setSelAssignment]=useState(null);
  const [selClass,setSelClass]=useState(null);
  const [isDesktop,setIsDesktop]=useState(window.innerWidth>500);

  useEffect(()=>{
    const handler=()=>setIsDesktop(window.innerWidth>500);
    window.addEventListener('resize',handler);
    return()=>window.removeEventListener('resize',handler);
  },[]);

  const fetchRecords=useCallback(async(u)=>{
    if(!u) return;
    setLoading(true);
    try{
      const isStudent=u.role==='student';
      let payload;
      if(isStudent) payload={action:'getRecords',studentId:u.studentId};
      else {
        let sc=[];
        if(u.assignments){try{sc=JSON.parse(u.assignments).flatMap(a=>a.classes);}catch(e){}}
        payload={action:'getAllRecords',role:u.role,grade:u.grade,classNum:u.classNum,homeroomClass:u.homeroomClass||'',subjectClasses:sc,studentId:u.studentId};
      }
      const res=await callAPI(payload);
      if(res.success) setRecords(res.records||[]);
    }catch(e){}
    setLoading(false);
  },[]);

  const login=u=>{setUser(u);fetchRecords(u);};
  const logout=()=>{setUser(null);setRole(null);setRecords([]);setView('home');};

  const saveRecord=async(data)=>{
    try{
      const r=await callAPI({action:'saveRecord',record:{...data,studentId:user.studentId,name:user.name}});
      if(r.success){await fetchRecords(user);setWriting(false);setEditing(null);}
      else alert(r.message);
    }catch(e){alert('저장 실패');}
  };
  const updateRecord=async(data)=>{
    try{
      const r=await callAPI({action:'updateRecord',record:{...data,studentId:user.studentId,name:user.name}});
      if(r.success){await fetchRecords(user);setWriting(false);setEditing(null);}
      else alert(r.message);
    }catch(e){alert('수정 실패');}
  };
  const deleteRecord=async(id)=>{
    if(!confirm('삭제할까요?')) return;
    try{
      await callAPI({action:'deleteRecord',recordId:id,studentId:user.studentId});
      fetchRecords(user);
    }catch(e){alert('삭제 실패');}
  };

  const desktopH = isDesktop ? Math.min(window.innerHeight * 0.92, 900) : null;
  const desktopW = isDesktop ? Math.round(desktopH * (430/844)) : null;
  const containerStyle = {
    width: isDesktop ? desktopW : '100%',
    maxWidth: isDesktop ? desktopW : 430,
    margin: isDesktop ? `${window.innerHeight*0.04}px auto` : 0,
    background:'white',
    height: isDesktop ? desktopH : 'auto',
    minHeight: isDesktop ? desktopH : '100dvh',
    display:'flex', flexDirection:'column',
    position:'relative', overflow:'hidden',
    boxShadow: isDesktop ? '0 30px 80px rgba(206,147,216,0.4)' : 'none',
    borderRadius: isDesktop ? 44 : 0
  };

  if(!role) return(
    <div style={containerStyle}>
      <RoleScreen onSelect={setRole}/>
    </div>
  );
  if(!user) return(
    <div style={containerStyle}>
      <LoginScreen role={role} onLogin={login} onBack={()=>setRole(null)}/>
    </div>
  );

  const isStudent=user.role==='student';
  const isSubjectTeacher=user.role==='subject';

  return(
    <div style={containerStyle}>
      <div style={{background:'white',borderBottom:'1px solid #f8e8f0',padding:'0 20px',height:52,display:'flex',alignItems:'center',position:'sticky',top:0,zIndex:30,boxShadow:'0 1px 10px rgba(206,147,216,0.1)'}}>
        <h1 style={{flex:1,textAlign:'center',fontSize:15,fontWeight:900,color:'#1a1a2e',margin:0,letterSpacing:'-0.3px'}}>
          {isSubjectTeacher?'과천여자고등학교':'창체 다이어리'}
        </h1>
        <button onClick={logout} style={{position:'absolute',right:16,background:'#fce4ec',border:'none',color:'#c2185b',fontSize:11,fontWeight:700,padding:'5px 11px',borderRadius:18,cursor:'pointer'}}>로그아웃</button>
      </div>

      <div className="no-scrollbar" style={{flex:1,overflowY:'auto',minHeight:0}}>
        {isStudent&&view==='home'&&!catId&&<StudentHome user={user} records={records} loading={loading} onCat={id=>{setCatId(id);setView('cat');}}/>}
        {isStudent&&view==='cat'&&catId!=='subject'&&!writing&&<RecordList catId={catId} records={records} onBack={()=>{setCatId(null);setView('home');}} onWrite={()=>setWriting(true)} onDelete={deleteRecord}/>}
        {isStudent&&view==='cat'&&catId!=='subject'&&writing&&<WriteForm catId={catId} onSave={saveRecord} onCancel={()=>setWriting(false)}/>}
        {isStudent&&view==='cat'&&catId==='subject'&&!subject&&<SubjectList user={user} onSelect={s=>{setSubject(s);}} onBack={()=>{setCatId(null);setView('home');}}/>}
        {isStudent&&view==='cat'&&catId==='subject'&&subject&&!writing&&<SubjectRecords subject={subject} records={records} onBack={()=>setSubject(null)} onWrite={()=>setWriting(true)} onDelete={deleteRecord} onEdit={r=>{setEditing(r);setWriting(true);}}/>}
        {isStudent&&view==='cat'&&catId==='subject'&&subject&&writing&&<SubjectForm subject={subject} editing={editing} onSave={editing?updateRecord:saveRecord} onCancel={()=>{setWriting(false);setEditing(null);}}/>}

        {!isStudent&&!isSubjectTeacher&&view==='home'&&<TeacherHome user={user} records={records} onSelectStudent={()=>setView('students')} onViewReports={()=>setView('reports')}/>}
        {!isStudent&&!isSubjectTeacher&&view==='students'&&!selStudent&&<StudentList user={user} records={records} onSelect={s=>{setSelStudent(s);setView('ai');}} onBack={()=>setView('home')}/>}
        {!isStudent&&!isSubjectTeacher&&view==='ai'&&selStudent&&<AIReport student={selStudent} onBack={()=>{setSelStudent(null);setView('students');}}/>}
        {!isStudent&&!isSubjectTeacher&&view==='reports'&&<ReportList user={user} onBack={()=>setView('home')}/>}

        {isSubjectTeacher&&view==='home'&&!selAssignment&&<SubjectTeacherHome user={user} onSelectSubject={a=>{setSelAssignment(a);setView('classes');}}/>}
        {isSubjectTeacher&&view==='classes'&&selAssignment&&!selClass&&<SubjectClassList assignment={selAssignment} records={records} onSelect={cls=>{setSelClass(cls);setView('students');}} onBack={()=>{setSelAssignment(null);setView('home');}}/>}
        {isSubjectTeacher&&view==='students'&&selClass&&!selStudent&&<SubjectStudentList assignment={selAssignment} classCode={selClass} records={records} onSelect={s=>{setSelStudent(s);setView('detail');}} onBack={()=>{setSelClass(null);setView('classes');}}/>}
        {isSubjectTeacher&&view==='detail'&&selStudent&&<SubjectStudentDetail student={selStudent} records={records} onBack={()=>{setSelStudent(null);setView('students');}}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
